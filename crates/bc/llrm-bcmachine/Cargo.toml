[package]
name = "llrm-bcmachine"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "llrm's machine layer for BC objects: x86 decode into machine IR, blocks, extents, stack facts and the runtime ABI"

[dependencies]
llrm-support = { workspace = true }
llrm-omf = { workspace = true }
llrm-x86-code16 = { workspace = true }
iced-x86 = { workspace = true }
toml = { workspace = true }

[dev-dependencies]
llrm-omf = { workspace = true, features = ["testing"] }
