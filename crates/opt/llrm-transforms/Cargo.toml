[package]
name = "llrm-transforms"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "MIR to MIR passes, adapted from llrm-codegen's optimizations"

[dependencies]
llrm-mir = { workspace = true }
llrm-analysis = { workspace = true }
llrm-support = { workspace = true }
num-bigint = { workspace = true }
num-traits = { workspace = true }
llrm-gpl-gcc = { workspace = true, optional = true }

[features]
# gcc-derived estimates (GPL-3.0-or-later), off by default: DEVIATE REC-2 is inert without it.
gcc-gpl = ["dep:llrm-gpl-gcc"]

[dev-dependencies]
regex = { workspace = true }
llrm-arm64 = { workspace = true }
llrm-x86 = { workspace = true }
llrm-x86-m16 = { workspace = true }
llrm-x86-m32 = { workspace = true }
llrm-target = { workspace = true }
llrm-analysis = { workspace = true, features = ["testing"] }
llrm-gpl-gcc = { workspace = true }
