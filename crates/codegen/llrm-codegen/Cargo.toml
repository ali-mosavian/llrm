[package]
name = "llrm-codegen"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "llrm's HIR, MIR, optimizer, x86 backend, OMF object support and BC raising"

[dependencies]
llrm-support = { workspace = true }
llrm-target = { workspace = true }
llrm-x86 = { workspace = true }
llrm-omf = { workspace = true }
llrm-dwarf = { workspace = true }
llrm-object = { workspace = true }
llrm-qbruntime = { workspace = true }
llrm-hir = { workspace = true }
llrm-dagisel = { path = "../../backend/llrm-dagisel" }
llrm-lir = { workspace = true }
llrm-mir = { workspace = true }
llrm-analysis = { workspace = true }
llrm-transforms = { workspace = true }
iced-x86 = { workspace = true }
indexmap = { workspace = true }
num-bigint = { workspace = true }
num-traits = { workspace = true }
rustc-hash = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
tempfile = { workspace = true }
toml = { workspace = true }

[build-dependencies]
llrm-iselgen = { workspace = true }
llrm-lir = { workspace = true }
llrm-peepgen = { workspace = true }
llrm-support = { workspace = true }

[features]
# testing, for the other crates' tests
default = ["testing"]
testing = ["llrm-omf/testing"]
# The m16 and m32 selectors, peephole rules and effect rows, generated here from
# their definition directories for this crate's own tests (a product binds a
# target's from its select crate; see docs/machine/targets.md, row 19b).
fixtures = []

[dev-dependencies]
llrm-codegen = { path = ".", features = ["fixtures"] }
llrm-x86-m16 = { workspace = true }
llrm-x86-m32 = { workspace = true }
llrm-x86-m64 = { workspace = true }
llrm-omf = { workspace = true, features = ["testing"] }
regex = { workspace = true }
