# What a CPU is to the pin's pattern predicates, for the x86-32 targets without SSE or MMX.
#
# `features` are the pin's `Proc<...>` lists: i486 is `[FeatureX87]` (X86.td L1914), i586 is
# `[FeatureX87, FeatureCX8]` (L1916); `Subtarget->hasX()` is true for the listed `X`. Every
# other `Subtarget->hasX()` is false.
[cpu.i486]
features = ["X87"]

# Real mode on a 386: the pin's `Proc<"i386", [FeatureX87]>` (L1912).
[cpu.m16]
features = ["X87"]

# m16.td's 16-bit string forms ask for the mode.
[cpu.m16.atom]
"Subtarget->is16Bit()" = true

[cpu.p5]
features = ["X87", "CX8"]

# x86-64 (D64-0): the 64-bit mode of the same pin table. The baseline CMOV and CX8 of any 64-bit CPU,
# x87 for `long double`; no SSE yet (scalar floating point is D64-4), so a float pattern stays on x87.
[cpu.x64]
features = ["X87", "CX8", "CMOV", "SSE1", "SSE2"]

[cpu.x64.atom]
"Subtarget->is64Bit()" = true
"Subtarget->isTarget64BitLP64()" = true

# Atoms that are not `Subtarget->hasX()`: a constant for every CPU here, or a feature list.
[atom]
"Subtarget->is64Bit()" = false
"Subtarget->isTarget64BitLP64()" = false
"Subtarget->isTargetWin64()" = false
"Subtarget->isTargetPS()" = false
"Subtarget->isCallingConvWin64(MF->getFunction().getCallingConv())" = false
# Tuning flags set only for Atom, Silvermont and later cores.
"Subtarget->slowIncDec()" = false
"Subtarget->slowTwoMemOps()" = false
"Subtarget->slowIndirectCall()" = false
"Subtarget->preferLegacySetCC()" = false
# Retpoline and the thunks need a feature flag nothing here sets.
"Subtarget->useIndirectThunkCalls()" = false
# Windows-only module flag.
"MF->getFunction().getParent()->getModuleFlag(\"import-call-optimization\")" = false
# No HiPE calling convention.
"MF->getFunction().getCallingConv() == CallingConv::HiPE" = false
"MF->getFunction().getCallingConv() != CallingConv::HiPE" = true
# Static code model, no PIC.
"TM.getCodeModel() == CodeModel::Small" = true
"TM.getCodeModel() == CodeModel::Kernel" = false
"TM.isPositionIndependent()" = false
"true" = true
# `X86Subtarget.h` L199: hasCMOV() || hasSSE1() || is64Bit().
"Subtarget->canUseCMOV()" = ["CMOV", "SSE1"]

# Atoms decided when a function is selected: the name of the `PatternContext` method.
[dynamic]
"shouldOptForSize(MF)" = "should_opt_for_size"
"MF->getFunction().hasMinSize()" = "has_min_size"
"Subtarget->getFrameLowering()->hasFP(*MF)" = "has_frame_pointer"
"Subtarget->isLegalToCallImmediateAddr()" = "is_legal_to_call_immediate_addr"

# Value types no selection here produces: vectors.
[types]
dead_prefixes = ["v", "nxv"]

# Node predicates (`CheckPredicate`): a name of the predicate's PatFrags, and the function of
# `llrm_dagisel::predicates` that is its body. One name per predicate is enough.
[node_predicate]
load = "non_extending_load"
unindexedload = "unindexed_load"
unindexedstore = "unindexed_store"
store = "non_truncating_store"
truncstore = "truncating_store"
