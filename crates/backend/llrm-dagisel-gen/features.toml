loadi8 = "loadi8"
loadi16 = "loadi16"
loadi32 = "loadi32"
extload = "ext_load"
zextload = "zext_load"
sextload = "sext_load"
extloadi64i32 = "extload_i64_i32"
memop = "memop"
simple_load = "simple_load"
simple_store = "simple_store"
alignedload128 = "aligned_16"
alignedloadf128 = "aligned_to_store_size"
