# SSE (D64-4). The vector broadcasts, `vzload` and `memopf128` never match a scalar DAG; the
# builder sets no `!nontemporal`.
X86VBroadcastld32 = "memory_vt_i32"
X86vzload32 = "memory_vt_i32"
X86VBroadcastld64 = "memory_vt_i64"
X86vzload64 = "memory_vt_i64"
