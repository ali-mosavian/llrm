# wasm64: the datalayout is the pin clang's for --target=wasm64. Linear memory is one address space.
mode = 64
llvm_triple = "wasm64"

datalayout = "e-m:e-p:64:64-p10:8:8-p20:8:8-i64:64-i128:128-n32:64-S128-ni:1:10:20"

# Only i32 and i64 exist as integer operands: narrower ones run at 32 bits.
promote = ["add.i8", "sub.i8", "mul.i8", "and.i8", "or.i8", "xor.i8", "add.i16", "sub.i16", "mul.i16", "and.i16", "or.i16", "xor.i16"]

[spaces]
near = 0
far = 0
data = 0
stack = 0

[pointers]
8 = "near"
