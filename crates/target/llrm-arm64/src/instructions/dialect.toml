# What the reader of arm64.instr must know: see llrm_target::instr::Dialect.
file = "arm64.instr"
# Register roots: the 64-bit general registers, sp, the zero register, the vector registers.
registers = [
    "x0", "x1", "x2", "x3", "x4", "x5", "x6", "x7",
    "x8", "x9", "x10", "x11", "x12", "x13", "x14", "x15",
    "x16", "x17", "x18", "x19", "x20", "x21", "x22", "x23",
    "x24", "x25", "x26", "x27", "x28", "x29", "x30", "sp",
    "xzr", "v0", "v1", "v2", "v3", "v4", "v5", "v6",
    "v7", "v8", "v9", "v10", "v11", "v12", "v13", "v14",
    "v15", "v16", "v17", "v18", "v19", "v20", "v21", "v22",
    "v23", "v24", "v25", "v26", "v27", "v28", "v29", "v30",
    "v31",
]
# General widths and the vector widths (a scalar float is a 32 or 64 bit vector lane).
widths = [8, 16, 32, 64, 128]
assembler_column = false
# What a rule's `any` reads: the condition flags.
arithmetic = ["N", "Z", "C", "V"]

# `{cc}` expands to these, in the assembler's spelling, each with the flags it tests.
conditions = [
    { name = "eq", flags = ["Z"] },
    { name = "ne", flags = ["Z"] },
    { name = "cs", flags = ["C"] },
    { name = "cc", flags = ["C"] },
    { name = "mi", flags = ["N"] },
    { name = "pl", flags = ["N"] },
    { name = "vs", flags = ["V"] },
    { name = "vc", flags = ["V"] },
    { name = "hi", flags = ["C", "Z"] },
    { name = "ls", flags = ["C", "Z"] },
    { name = "ge", flags = ["N", "V"] },
    { name = "lt", flags = ["N", "V"] },
    { name = "gt", flags = ["Z", "N", "V"] },
    { name = "le", flags = ["Z", "N", "V"] },
]

# NZCV, in the order of the PSTATE bits.
[flags]
N = 0x8
Z = 0x4
C = 0x2
V = 0x1
