# arm64 Linux (LP64): flat 64-bit.
mode = 64
llvm_triple = "aarch64-unknown-linux-gnu"
llvm_cpu = "generic"
tti = "AArch64"

# LLVM syntax, as the pin's clang prints it for aarch64-linux-gnu. i64 is native; long double is 128 bits.
datalayout = "e-m:e-p270:32:32-p271:32:32-p272:64:64-i8:8:32-i16:16:32-i64:64-i128:128-n32:64-S128-Fn32"

# A select of a float or integer is csel/fcsel: nothing expands. A sub-word add is done in a word register.
expand = ["abs", "fshl", "fshr"]
promote = ["add.i8", "sub.i8", "mul.i8", "and.i8", "or.i8", "xor.i8", "add.i16", "sub.i16", "mul.i16", "and.i16", "or.i16", "xor.i16"]

[spaces]
near = 0
far = 0
data = 0
stack = 0

[pointers]
8 = "near"

# Base + (index, optionally extended) << scale, or base + scaled unsigned 12-bit offset.
[[address_form]]
address_bits = 64
scales = [1, 2, 4, 8, 16]

# What the C front end lays types out as, in bytes: the one place sizeof(int), sizeof(void *) and the rest are stated
# (llrm-cc checks its clang against it; the triple's default decides nothing). A row names its libc's departures
# (`wchar_bytes`, `long_double_bytes` in targets.toml).
[c]
int = 4
long = 8
long_long = 8
pointer = 8
function_pointer = 8
size_t = 8
ptrdiff_t = 8
wchar_t = 4
double = 8
long_double = 16
enum = 4
