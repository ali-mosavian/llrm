  "AArch64::LDRHpre",
  "AArch64::LDRSpre",
  "AArch64::LDRDpre",
  "AArch64::LDRQpre",
  "AArch64::LDRXpost",
  "AArch64::LDRWpost",
  "AArch64::LDRSWpost",
  "AArch64::LDRSHXpost",
  "AArch64::LDRSHWpost",
  "AArch64::LDRHHpost",
  "AArch64::LDRSBXpost",
  "AArch64::LDRSBWpost",
