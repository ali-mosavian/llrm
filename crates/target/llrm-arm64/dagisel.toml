# Selected by hand when the vectors are live (a 64-bit `mvni`, a byte load for a lane): the tables before
# the vectors leave them out, so the scheduling model prices them only then.
dynamic_extra_symbols = [
  "AArch64::BIFv16i8",
  "AArch64::BIFv8i8",
  "AArch64::BITv16i8",
  "AArch64::BITv8i8",
  "AArch64::BSLv16i8",
  "AArch64::BSLv8i8",
  "AArch64::LDRBpost",
  "AArch64::LDRBpre",
  "AArch64::MVNIv2i32"
]
# Opcodes the hand code selects (a bitcast, a float round) that kept a scheduling class only through patterns of vector
# types now pruned: they keep their row in instrinfo.rs and sched.rs.
sched_symbols = [
  "AArch64::FABD64",
  "AArch64::FMOVDr",
  "AArch64::FMOVHr",
  "AArch64::FMOVWSr",
  "AArch64::FMOVXDr",
  "AArch64::FRINT32XDr",
  "AArch64::FRINT32ZDr",
  "AArch64::FRINT64XDr",
  "AArch64::FRINT64ZDr",
  "AArch64::STNPSi",
]
ids_includes = [
  '#include "MCTargetDesc/AArch64MCTargetDesc.h"',
  '#include "AArch64SelectionDAGInfo.h"',
]

# AArch64 pattern-predicate atoms for the scalar subset (NEON, SVE and SME off): the dry run of the DAG path
# (docs/working/selectiondag-plan.md, SD520-SD531). `[atom]` rows are what the pin's Subtarget says; an atom nothing states is an error.
# apple-m1: the pin's `Processor` list, the scalar subset.
[cpu.apple-m1]
features = ["FPARMv8", "FullFP16", "LSE", "CRC", "AES", "SHA2", "SHA3", "RCPC", "RDM"]

[atom]
"Subtarget->isLittleEndian()" = true
"Subtarget->isSVEorStreamingSVEAvailable()" = false
"Subtarget->isSVEAvailable()" = false
"Subtarget->isStreaming()" = false
"Subtarget->isNonStreamingSVEorSME2Available()" = false
"Subtarget->requiresStrictAlign()" = false
"Subtarget->disableUnpredicatedLdStLower()" = false
"shouldOptForSize(MF)" = false
"Subtarget->isSTRQroSlow()" = false
"Subtarget->useAlternateSExtLoadCVTF32Pattern()" = false
"Subtarget->useWzrToVecMove()" = false
"MF->getSubtarget<AArch64Subtarget>().hardenSlsBlr()" = false
"MF->getInfo<AArch64FunctionInfo>()->branchTargetEnforcement()" = false
"MF->getInfo<AArch64FunctionInfo>()->branchProtectionPAuthLR()" = false
"MF->getFunction().hasOptNone()" = false

# Decided when a function is selected (the flag-gated vectors, ARM64-VEC POC): off, NEON patterns never match, as when they were pruned.
[dynamic]
"Subtarget->isNeonAvailable()" = "neon_available"
# A feature the CPUs differ in (apple-m1 has SHA3, generic does not): the CPU answers at selection time, not the table.
"Subtarget->hasSHA3()" = "has_feature(\"SHA3\")"

[types]
dead_prefixes = ["v", "nxv", "aarch64"]
# The vectors the DAG builds (ARM64-VEC POC): their loads and stores, nothing NEON-gated; the 64-bit integer
# vectors are the narrow operands of the long forms (`ushll`, `uaddw`, `smull`).
live = ["v16i8", "v8i16", "v4i32", "v2i64", "v4f32", "v2f64", "v2f32", "v8i8", "v4i16", "v2i32"]

[node_predicate]
# One name per predicate number is enough (the pin groups equal bodies). Names with no Dag query answer false by name (see aarch64_predicates.rs).
