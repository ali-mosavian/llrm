# The AArch64 DAG selector's source: read by tools/dagisel/regen-target.sh and `llrm-dagisel-gen --target`.
# The tables sit in llrm-dagisel (`in_dagisel`); their node predicates are in its `aarch64_predicates`.
[target]
name = "aarch64"
llvm_build = "llvm-build-aarch64"
ns = "AArch64::"
isd = "AArch64ISD::"
llvm_dir = "AArch64"
td = "AArch64.td"
cpus = ["apple-m1"]
# The scheduling models (sched.rs): `generic` is Cortex-A510's, `apple-m1` Cyclone's.
sched_cpus = ["generic", "apple-m1"]
hw_modes = ["i64", "i64"]
in_dagisel = true
# The directory of the checked-in tables, from this file.
out = "../../backend/llrm-dagisel/src/generated/aarch64"
predicates = "crate::aarch64_predicates"
# The scalar registers the hand code maps to the arm64 file by name.
registers = ["X0", "X1", "X2", "X3", "X4", "X5", "X6", "X7", "X8", "X9", "X10", "X11", "X12", "X13", "X14", "X15", "X16", "X17", "X18", "X19", "X20", "X21", "X22", "X23", "X24", "X25", "X26", "X27", "X28", "FP", "LR", "SP", "XZR", "W0", "W1", "W2", "W3", "W4", "W5", "W6", "W7", "W8", "W9", "W10", "W11", "W12", "W13", "W14", "W15", "W16", "W17", "W18", "W19", "W20", "W21", "W22", "W23", "W24", "W25", "W26", "W27", "W28", "W29", "W30", "WSP", "WZR", "NZCV"]
# Selected by hand (tryIndexedLoad), so no pattern names them.
extra_symbols = [
  "AArch64::LDRXpre",
  "AArch64::LDRWpre",
  "AArch64::LDRSWpre",
  "AArch64::LDRSHXpre",
  "AArch64::LDRSHWpre",
  "AArch64::LDRHHpre",
  "AArch64::LDRSBXpre",
  "AArch64::LDRSBWpre",
