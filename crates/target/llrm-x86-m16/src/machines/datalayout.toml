# x86-m16: real mode. 16-bit near pointers, 32-bit far ones indexing by 16
# bits, 16-bit segments, huge ones as far but indexing by 32 bits (a displacement
# past 64K carries into the selector), and 16-bit alignment.
# What gcc's -m names it: -m16.
mode = 16

# What the LLVM tools are told to price this target as (opt -mtriple/-mcpu: the pricing CPU is the 486, nobody prices the 386) and the TTI llrm prices with (set before the TTI exists: the oracle refuses until the m16 machine states it).
llvm_triple = "i386-unknown-unknown-code16"
llvm_cpu = "i486"
tti = "X86"

datalayout = "e-p:16:16-p1:32:16:16:16-p2:16:16-p3:32:16:16:32-p4:32:16:16:16-i32:16-i64:16-f80:16-n8:16:32"

# No `S` on purpose: the pin's m16 datalayout (the clang fork's, `llrm-cc/targets.toml` x86_16-*) names none, so the pin's alloca raise to a type's
# preferred alignment is unbounded at m16 and ours follows it (bench/parity/qbsp -Os: the packed 16-byte local is raised to 4 and zeroed by
# `rep stosw` x8; S16 made it `rep stosb` x16). tools/test_datalayout_stack.py and assert_stack_facts read this key: a target with it must not declare an S.
stack_alignment_unstated = "the pin's m16 datalayout has no S"

# What a real-mode frame keeps, in bytes: SP stays even and nothing realigns it (an over-aligned local is clamped to this at pipeline entry,
# so the optimizer assumes no more), and the largest `alloca` alignment accepted (a larger one is a named refusal). Machine::kept_stack_align,
# Machine::max_alloca_align; w15's values, 2026-11-09.
kept_stack_align = 2
max_alloca_align = 32

# The operations this machine has no instruction for, which the compiler expands before selection: fptoui to a 64-bit integer
# (fistp stores signed qwords), a conditional move (none before the Pentium Pro), `ctpop` (no popcnt; `ctlz` and `cttz` are `bsr` and
# `bsf`, as at m32), `bswap` and the three-way compares `scmp` and `ucmp` (none is selected yet), and `abs`, `fshl` and
# `fshr` (no cmov, and SHLD/SHRD are not selected yet).
expand = ["abs", "bitreverse", "bswap", "ctpop", "fptoui.i64", "fshl", "fshr", "scmp", "select", "ucmp"]

# What a frontend's addresses are, by address space number.
[spaces]
near = 0
# A data segment holds 64K: a larger object is cut into segments a huge pointer steps through.
segment_bytes = 65536
# Where the program's data and its stack are, for the passes that ask.
data = 0
stack = 5
# A far pointer's.
far = 1
# A selector alone: a cast from a far pointer gives its segment, and one back gives segment:0.
segment = 2
# A far pointer whose index does not wrap at 64K.
huge = 3
# A far pointer into memory no program object occupies.
fixed = 4

# An unmarked pointer, by its width in bytes.
[pointers]
2 = "near"
4 = "far"

# What the C front end lays types out as, in bytes: the one place sizeof(int), sizeof(void *) and the rest are stated
# Medium model: near data, far code (-mcmodel names the others).
# (llrm-cc checks its clang against it; the triple's default decides nothing). A row names its libc's departures
# (`wchar_bytes`, `long_double_bytes` in targets.toml).
[c]
int = 2
long = 4
long_long = 8
pointer = 2
function_pointer = 4
size_t = 2
ptrdiff_t = 2
wchar_t = 2
double = 8
long_double = 10
enum = 2
