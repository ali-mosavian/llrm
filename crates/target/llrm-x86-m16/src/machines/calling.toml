# cdecl16, m16's C ABI: Borland's medium model as `wccq` is asked for it (-mm -ecc; `_name`
# symbols). A far call (a procedure that is exported) leaves a 4-byte return address.

[cdecl16]
cc = "cdecl"
slot_bytes = 2
order = "right-to-left"
cleanup = "caller"
# All arguments in memory.
argument_registers = []
# A near call's return address; a far one's is 4 bytes.
return_address_bytes = 2
# From BP after `push bp; mov bp, sp`: past the saved BP and the return address.
first_argument_offset = 4
first_argument_offset_far = 6
# The frame register: a cell is addressed through it, and no value is held in it.
frame = "bp"
stack = "sp"
# A Borland caller keeps SI and DI, not their upper halves: each by its full register and the one a
# prologue pushes.
preserved = ["bp", ["esi", "si"], ["edi", "di"]]
clobbered = ["ax", "bx", "cx", "dx", "es", "flags"]
# Direction flag clear and the x87 stack empty on entry and on return.
entry_state = ["df_clear", "x87_empty"]
# char and short arguments are widened to a slot; an i64 and a double take two, low half first.
promotion = "slot"
wide_slots = 2
variadic_float = "double"

# By the bytes a result takes: a byte or word in AX, a dword in DX:AX, an i64 in EDX:EAX; the
# registers are named by their dword, as the selector holds them. Floats in st(0).
[cdecl16.result]
1 = ["eax"]
2 = ["eax"]
4 = ["eax", "edx"]
8 = ["eax", "edx"]
pointer = ["eax"]
float = ["st0"]

# Pascal: arguments pushed left to right and popped by the callee. Nib's pascal16.
[pascal16]
like = "cdecl16"
order = "left-to-right"
cleanup = "callee"

# BASIC's own: the same, in the compilers of each dialect.
[qb45]
like = "pascal16"

[pds71]
like = "pascal16"

[vbdos]
like = "pascal16"

# An interrupt handler: entered with the flags, CS and IP pushed (six bytes), it saves every register
# (llrm_mir::opcode::X86_INTR_FRAME) and leaves by `iret`. It takes no stack arguments: its one
# parameter points at the saved frame, so no offset is from BP.
[interrupt16]
like = "cdecl16"
return_address_bytes = 6
first_argument_offset = 0
first_argument_offset_far = 0
clobbered = []
