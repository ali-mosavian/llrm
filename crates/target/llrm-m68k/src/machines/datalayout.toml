# m68k Linux: flat 32-bit, big-endian, 16-bit alignment for the 32-bit integer and pointer
# (M68kTargetMachine's data layout at the pin; `llc -mtriple=m68k-linux-gnu` prints it).
mode = 32
llvm_triple = "m68k-unknown-linux-gnu"
llvm_cpu = "M68000"

datalayout = "E-m:e-p:32:16:32-i8:8:8-i16:16:16-i32:16:32-n8:16:32-a:0:16-S16"

[spaces]
near = 0
far = 0
data = 0
stack = 0

[pointers]
4 = "near"

# What the C front end lays types out as, in bytes (llrm-cc checks its clang against it). The pin's clang gives the
# m68k target a 64-bit long double.
[c]
int = 4
long = 4
long_long = 8
pointer = 4
function_pointer = 4
size_t = 4
ptrdiff_t = 4
wchar_t = 4
double = 8
long_double = 8
enum = 4
