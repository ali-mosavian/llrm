# Z80: an 8-bit machine with 16-bit addresses in one flat space, a 16-bit add and no alignment. i32 and i64 are
# the type legalizer's chains of words.
mode = 8
llvm_triple = "z80-unknown-none"
llvm_cpu = "z80"

datalayout = "e-p:16:8-i16:8-i32:8-i64:8-f32:8-f64:8-a:8-n8:16"

# No multiply, divide, shift by a variable or bit count instruction: the compiler expands them (to libcalls
# where a loop is too big).
expand = ["abs", "bitreverse", "bswap", "ctlz", "ctpop", "cttz", "fshl", "fshr", "scmp", "ucmp"]

[spaces]
near = 0
far = 0
data = 0
stack = 0

[pointers]
2 = "near"

# The C front end's sizes in bytes (clang's msp430 with -funsigned-char -fpack-struct=1, as for the 6502 and SDCC:
# 16-bit int, 32-bit long). SDCC's `double` is 4 and has no `long long`; clang's are 8.
[c]
int = 2
long = 4
long_long = 8
pointer = 2
function_pointer = 2
size_t = 2
ptrdiff_t = 2
wchar_t = 2
double = 8
long_double = 8
enum = 2
