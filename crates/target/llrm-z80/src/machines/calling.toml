# The Z80 convention, after SDCC 4.5.0's `--sdcccall 1` (read off its output): a byte in A, then L, H, E, D, C, B;
# a word in HL, then DE, BC; a byte result in A, a word in DE, a long in HL:DE (HL low) as argument and as result.
# Whatever does not fit goes on the stack, the caller popping it. IX is the frame register and the callee keeps it.
# DEVIATE from SDCC: its second argument is in L or DE by the first one's width (f(u8, u16): DE); here a word takes
# the first free pair, HL. Its callee pops the stack arguments; here the caller does. Interop with SDCC-built objects
# is not a goal for the CP/M .COM first target (our own runtime, no SDCC library). Unpriced: no T-state or byte figure
# on the corpus yet. Exit: price both on the corpus once emission exists (by 2026-11-05), else follow SDCC.
# DEVIATE from SDCC: it puts a long's low word in DE and its high word in HL, as argument and as result. Here the
# argument is placed in order (HL, then DE) and the result list repeats that order, as the pin's RetCC lists the
# registers (`AnalyzeCallResult` assigns the parts in order). A long that passes through a function or into the next
# call needs no swap: with the result in DE:HL, shl_long_by_one was 31 B and long_step_by_one 18 B over SDCC.
# Owner z80-argpush, 2026-11-10; priced on the corpus at five levels (docs/working/z80-long-order-ab-2026-11-10.md).
default = "z80"
private = "z80"

[abi.z80]
convention = "z80"

[z80]
cc = "cdecl"
# The pin joins a copy from an argument register only when the register is reserved (`canJoinPhys`): left
# unjoined, 0 of the 46 corpus cells (23 programs x -O2, -Oz) is worse than joined, and 8 are better.
pinned_copies_unjoined = true
slot_bytes = 1
order = "left-to-right"
cleanup = "caller"
argument_registers = ["a", "l", "h", "e", "d", "c", "b"]
wide_pairs = [["l", "h"], ["e", "d"], ["c", "b"]]
backfill = true
return_address_bytes = 2
first_argument_offset = 4
frame = "ix"
frame_optional = true
stack = "sp"
preserved = [["ix", "ix"], ["sp", "sp"]]
clobbered = ["a", "bc", "de", "hl", "iy", "flags"]
entry_state = []
promotion = "slot"
wide_slots = 2
variadic_float = "double"
aggregate = "hidden-pointer"
aggregate_in_register_bytes = []
aggregate_pointer = "register"
aggregate_pointer_register = "hl"
aggregate_pointer_returned = "de"
aggregate_pointer_popped_by = "caller"

[z80.symbol]
elf = "*"

[z80.result]
1 = ["a"]
2 = ["e", "d"]
4 = ["l", "h", "e", "d"]
pointer = ["e", "d"]
