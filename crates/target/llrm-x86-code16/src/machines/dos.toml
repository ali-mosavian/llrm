# Real-mode DOS on a PC with VGA.

# A far address is selector * 16 + offset.
addressing = "real"

# Whether a word or dword access crossing offset FFFFh faults, as it does on
# a 286 or later (#GP, or #SS through ss), where an 8086 wraps. DOSBox-X
# faults too, with its default `segment limits = true`. No other real-mode
# access traps, whatever its selector and offset.
# Sources: Intel 80386 Programmer's Reference Manual, 14.7 (Differences From
# 8086); DOSBox-X src/cpu/core_normal/table_ea.h, `GetEADirect`.
segment_end_faults = true

# The processor code is priced for.
cpu = "486"

# The segment registers the program model reserves: the data group every
# unprefixed access reads, the stack and the code. The rest hold selectors.
# The stack need not be in the data group: an interrupt handler may call
# code on a stack of its own with DS the data group, as Watcom's -zu
# allows. -mstack-is-data promises it is, so ss: reaches the data and ds is
# free between the points that need it.
[segments]
data = "ds"
stack = "ss"
code = "cs"
stack_is_data = false

# Linear [low, high) ranges no program's own data occupies. A write there
# reaches no variable, array or runtime cell.
# Sources: Ralf Brown's Interrupt List, MEMORY.LST.
[[foreign]]
name = "interrupt vectors, BIOS data area, DOS work areas; IO.SYS loads at 0070:0000"
low = 0x00000
high = 0x00700

[[foreign]]
name = "VGA memory: graphics, monochrome and colour text"
low = 0xA0000
high = 0xC0000

[[foreign]]
name = "VGA BIOS ROM: B800:FFFF ends inside it"
low = 0xC0000
high = 0xC8000

# C8000-EFFFF stays out: an upper memory block there may hold a program
# loaded high, its data group included.
[[foreign]]
name = "system BIOS ROM and the HMA FFFF:FFFF reaches, where DOS=HIGH keeps DOS"
low = 0xF0000
high = 0x10FFF0

# I/O ports [low, high), and what an `in` or `out` of one may do to memory:
# "none", device registers only; "dma", start a transfer that reads or
# writes any memory. An unlisted port may read and write any memory.
# A register that changes what a VRAM access does, as the map mask or a
# bank select, acts only on VGA memory, which is foreign above.
# Sources: Ralf Brown's Interrupt List, PORTS.A and PORTS.B, by entry.

# PORTS.A "0000-001F - DMA 1".
[[ports]]
name = "8237 DMA controller 1"
low = 0x000
high = 0x020
memory = "dma"

# PORTS.A "0020-003F - PIC 1"; 22h up are chipset configuration.
[[ports]]
name = "8259 PIC 1"
low = 0x020
high = 0x022
memory = "none"

# PORTS.A "0040-005F - PIT".
[[ports]]
name = "8253/8254 PIT"
low = 0x040
high = 0x044
memory = "none"

# PORTS.A "0060-006F - KEYBOARD CONTROLLER"; its A20 gate only changes what FFFF:xxxx, foreign, reaches.
[[ports]]
name = "keyboard controller and system control port B"
low = 0x060
high = 0x065
memory = "none"

# PORTS.A "0070-007F - CMOS RAM/RTC".
[[ports]]
name = "CMOS RAM and RTC"
low = 0x070
high = 0x072
memory = "none"

# PORTS.A "0080-008F - DMA PAGE REGISTERS".
[[ports]]
name = "DMA page registers"
low = 0x080
high = 0x090
memory = "dma"

# PORTS.A "00A0-00AF - PIC 2".
[[ports]]
name = "8259 PIC 2"
low = 0x0A0
high = 0x0A2
memory = "none"

# PORTS.A "00C0-00DF - DMA 2".
[[ports]]
name = "8237 DMA controller 2"
low = 0x0C0
high = 0x0E0
memory = "dma"

# PORTS.B "0200-020F - Game port"; 208h up are EMS page registers on some chipsets.
[[ports]]
name = "game port"
low = 0x201
high = 0x202
memory = "none"

# PORTS.B "0220-022F - Soundblaster PRO".
[[ports]]
name = "Sound Blaster: the DSP starts DMA"
low = 0x220
high = 0x230
memory = "dma"

# PORTS.B "0278-027A - PARALLEL PRINTER PORT".
[[ports]]
name = "LPT"
low = 0x278
high = 0x27B
memory = "none"

# PORTS.B "02F8-02FF - serial port".
[[ports]]
name = "COM2"
low = 0x2F8
high = 0x300
memory = "none"

# PORTS.B "0370-0377 - FDC 2".
[[ports]]
name = "floppy controller 2"
low = 0x370
high = 0x378
memory = "dma"

# PORTS.B "0378-037A - PARALLEL PRINTER PORT".
[[ports]]
name = "LPT"
low = 0x378
high = 0x37B
memory = "none"

# PORTS.B "0388-0389 - AdLib".
[[ports]]
name = "AdLib FM"
low = 0x388
high = 0x38A
memory = "none"

# PORTS.B "03B0-03BF - MDA", "03BC-03BF - PARALLEL PRINTER PORT", "03BF - Hercules".
[[ports]]
name = "MDA, Hercules and VGA monochrome CRTC, status, LPT"
low = 0x3B0
high = 0x3C0
memory = "none"

# PORTS.B "03C0-03C1", "03C2-03CF", "03C4-03C5", "03C6-03C9", "03CA-03CD", "03CE-03CF".
[[ports]]
name = "VGA attribute, miscellaneous, sequencer, DAC, graphics controller"
low = 0x3C0
high = 0x3D0
memory = "none"

# PORTS.B "03D0-03D3", "03D4-03D5", "03D6-03D7", "03D8-03DF".
[[ports]]
name = "CGA and VGA colour CRTC, mode and status"
low = 0x3D0
high = 0x3E0
memory = "none"

# PORTS.B "03E8-03EF - serial port".
[[ports]]
name = "COM3"
low = 0x3E8
high = 0x3F0
memory = "none"

# PORTS.B "03F0-03F7 - FDC 1".
[[ports]]
name = "floppy controller 1"
low = 0x3F0
high = 0x3F8
memory = "dma"

# PORTS.B "03F8-03FF - Serial port".
[[ports]]
name = "COM1"
low = 0x3F8
high = 0x400
memory = "none"
