# cdecl32, code32's C ABI: Open Watcom's 386 flat ABI as `wccq` is asked for it (-ecc: the stack
# convention, not Watcom's register-based default; structs packed -zp4; `_name` symbols), with one
# deliberate difference: the aggregate return below, which is reentrant.

[cdecl32]
slot_bytes = 4
# Arguments are pushed right to left, so the first is lowest.
order = "right-to-left"
cleanup = "caller"
# All arguments in memory.
argument_registers = []
# Return address 4 bytes: the first argument is at [esp+4] on entry.
return_address_bytes = 4
# From EBP after `push ebp; mov ebp, esp`; from ESP on entry it is 4.
first_argument_offset = 8
# The frame register: a cell is addressed through it, and no value is held in it.
frame = "ebp"
stack = "esp"
preserved = ["ebx", "esi", "edi", "ebp"]
clobbered = ["eax", "ecx", "edx", "st0", "st1", "st2", "st3", "st4", "st5", "st6", "st7", "flags"]
# Direction flag clear and the x87 stack empty on entry and on return.
entry_state = ["df_clear", "x87_empty"]
# THE DIFFERENCE FROM OPEN WATCOM. Its -ecc returns a struct larger than a register by the address
# of one static result area in EAX: not reentrant. cdecl32 returns it as Borland's rule has it (llrm-c's
# `returned_as_integer` on code16): a struct of 1, 2 or 4 bytes in AL, AX or EAX; any other is
# written to caller memory through a pointer pushed after every argument (so it is the lowest slot),
# which the callee returns in EAX and the caller pops. A call into an Open Watcom object that returns
# such a struct is the one call this ABI does not match.
aggregate = "hidden-pointer"
aggregate_in_register_bytes = [1, 2, 4]
aggregate_pointer = "after-arguments"
aggregate_pointer_returned = "eax"
aggregate_pointer_popped_by = "caller"
# char and short arguments are widened to a slot.
promotion = "slot"
# i64 and double take two slots, low half first; a variadic float is a double.
wide_slots = 2
variadic_float = "double"

# By the bytes a result takes: at most 32 bits in eax, an i64 in edx:eax, low in eax; floats in st(0).
[cdecl32.result]
1 = ["eax"]
2 = ["eax"]
4 = ["eax"]
8 = ["eax", "edx"]
pointer = ["eax"]
float = ["st0"]
