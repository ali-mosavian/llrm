# x86-64: ELF64 relocatable objects, linked by the system linker against glibc.
formats = ["elf"]
default = "elf"
bitness = 64
# Symbols are `[rip + symbol]`: the isel makes a symbol's address a value before it adds a register to it.
pc_relative = true
header = []

# The ELF objects, linked by GNU ld: its emulation (`-m`).
[link.elf]
emulation = "elf_x86_64"
