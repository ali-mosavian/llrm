# The ABI a program has without -mabi=, and, for each ABI, the convention an unmarked function has under it.
default = "watcom"

# The convention a function nothing outside the program reaches takes under every ABI: no one else sees it, so the register one.
private = "watcall32"

[abi.watcom]
convention = "watcall32"

[abi.sysv]
convention = "sysv32"

# watcall32, m32's default: Open Watcom's register convention (`__watcall`), as `wcc386 -3r` emits
# it, read from its disassembly. Arguments take EAX, EDX, EBX, ECX in order; an i64 takes EAX:EDX
# or EBX:ECX (low first), the first pair with both free, and a register passed over stays free for
# a later 32-bit argument. The first argument that fits no register (a float, a struct by value, an
# i64 with no pair free) goes on the stack with every one after it; those are pushed right to
# left and the callee pops them. A callee changes the registers its own arguments arrive in, EAX
# and, for an i64 result, EDX, and keeps every other. Variadic calls pass as cdecl32 does.
# A struct larger than a dword is written to caller memory through a pointer in ESI, which the
# callee returns in EAX; one of 1, 2 or 4 bytes comes back in AL, AX or EAX.

[watcall32]
cc = "watcall"
slot_bytes = 4
order = "right-to-left"
cleanup = "callee"
argument_registers = ["eax", "edx", "ebx", "ecx"]
wide_pairs = [["eax", "edx"], ["ebx", "ecx"]]
backfill = true
arguments_clobbered = true
results_clobbered = true
variadic = "cdecl32"
return_address_bytes = 4
first_argument_offset = 8
frame = "ebp"
# A function that can address its frame through the stack pointer has no frame register: it is then one more value register (last to be
# given out, saved where used), decided before allocation (`backend/framefree.rs`).
frame_optional = true
stack = "esp"
preserved = ["ebx", "ecx", "edx", "esi", "edi", "ebp"]
clobbered = ["eax", "st0", "st1", "st2", "st3", "st4", "st5", "st6", "st7", "flags"]
entry_state = ["df_clear", "x87_empty"]
aggregate = "hidden-pointer"
aggregate_in_register_bytes = [1, 2, 4]
aggregate_pointer = "register"
aggregate_pointer_register = "esi"
aggregate_pointer_returned = "eax"
aggregate_pointer_popped_by = "callee"
promotion = "slot"
wide_slots = 2
variadic_float = "double"
# Open Watcom decorates a symbol with a trailing underscore, in OMF and COFF alike; ELF and Mach-O take C's.
[watcall32.symbol]
omf = "*_"
coff = "*_"
elf = "*"
macho = "_*"

[watcall32.result]
1 = ["eax"]
2 = ["eax"]
4 = ["eax"]
8 = ["eax", "edx"]
pointer = ["eax"]
float = ["st0"]

# cdecl32, m32's C ABI: Open Watcom's 386 flat ABI as `wccq` is asked for it (-ecc: the stack
# convention, not Watcom's register-based default; structs packed -zp4; `_name` symbols), with one
# deliberate difference: the aggregate return below, which is reentrant.

[cdecl32]
cc = "cdecl"
slot_bytes = 4
# Arguments are pushed right to left, so the first is lowest.
order = "right-to-left"
cleanup = "caller"
# All arguments in memory.
argument_registers = []
# Return address 4 bytes: the first argument is at [esp+4] on entry.
return_address_bytes = 4
# From EBP after `push ebp; mov ebp, esp`; from ESP on entry it is 4.
first_argument_offset = 8
# The frame register: a cell is addressed through it, and no value is held in it.
frame = "ebp"
# A function that can address its frame through the stack pointer has no frame register: it is then one more value register (last to be
# given out, saved where used), decided before allocation (`backend/framefree.rs`).
frame_optional = true
stack = "esp"
preserved = ["ebx", "esi", "edi", "ebp"]
clobbered = ["eax", "ecx", "edx", "st0", "st1", "st2", "st3", "st4", "st5", "st6", "st7", "flags"]
# Direction flag clear and the x87 stack empty on entry and on return.
entry_state = ["df_clear", "x87_empty"]
# THE DIFFERENCE FROM OPEN WATCOM. Its -ecc returns a struct larger than a register by the address
# of one static result area in EAX: not reentrant. cdecl32 returns it as Borland's rule has it (llrm-c's
# `returned_as_integer` on m16): a struct of 1, 2 or 4 bytes in AL, AX or EAX; any other is
# written to caller memory through a pointer pushed after every argument (so it is the lowest slot),
# which the callee returns in EAX and the caller pops. A call into an Open Watcom object that returns
# such a struct is the one call this ABI does not match.
aggregate = "hidden-pointer"
aggregate_in_register_bytes = [1, 2, 4]
aggregate_pointer = "after-arguments"
aggregate_pointer_returned = "eax"
aggregate_pointer_popped_by = "caller"
# char and short arguments are widened to a slot.
promotion = "slot"
# i64 and double take two slots, low half first; a variadic float is a double.
wide_slots = 2
variadic_float = "double"

[cdecl32.symbol]
omf = "_*"
coff = "_*"
elf = "*"
macho = "_*"

# By the bytes a result takes: at most 32 bits in eax, an i64 in edx:eax, low in eax; floats in st(0).
[cdecl32.result]
1 = ["eax"]
2 = ["eax"]
4 = ["eax"]
8 = ["eax", "edx"]
pointer = ["eax"]
float = ["st0"]

# sysv32: the i386 System V ABI, gcc's default on Linux, as `gcc -m32` emits it (read from its disassembly, not from the
# psABI's text): every argument on the stack, pushed right to left in dword slots, which the caller removes; EBX, ESI, EDI and
# EBP kept; results in EAX, EDX:EAX and ST0. Every struct result, whatever its size, is written through a pointer that is the
# first argument (pushed last, so the lowest slot), which the callee returns in EAX and pops, `ret 4`: gcc's default on Linux
# is memory for 1, 2, 4 and 8 byte structs too (`-freg-struct-return`, which Darwin and the BSDs default to, returns them in
# EAX and EDX; this is not that). Symbols are `_name` in OMF and undecorated in ELF.
[sysv32]
like = "cdecl32"
cc = "sysv"
aggregate_in_register_bytes = []
aggregate_pointer_popped_by = "callee"

[sysv32.symbol]
omf = "_*"
coff = "_*"
elf = "*"
macho = "_*"
