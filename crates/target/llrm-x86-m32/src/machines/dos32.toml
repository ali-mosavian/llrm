# A 32-bit DOS program under an extender, flat. Joined at compile time with
# llrm-target's pc-ports.toml (PC hardware). Draft against PR 3b's schema.

addressing = "flat"

# No segment is crossed: a flat access past 4 GB is the extender's fault, not
# the CPU's wrap, and no far data exists.
segment_end_faults = false
far_bss = false

# The extender the toolchain links with is DOS/32A (`object.toml`'s [link]): its
# flat data selector is zero-based, so a linear address is the DOS address of
# low memory, which it maps in. A host with another base (CWSDPMI under DJGPP
# asks the program for the conventional memory's) would state a different
# `flat_base`, and then has no [[foreign]] ranges rather than wrong ones.
flat_base = 0

# Linear [low, high) ranges no program's own data occupies. A write there
# reaches no variable, array or runtime cell.
# Sources: Ralf Brown's Interrupt List, MEMORY.LST. The memory above 1 MB is the
# extender's to give the program, so none of it is listed.
[[foreign]]
name = "interrupt vectors, BIOS data area, DOS work areas; IO.SYS loads at 0070:0000"
low = 0x00000
high = 0x00700

[[foreign]]
name = "VGA memory: graphics, monochrome and colour text"
low = 0xA0000
high = 0xC0000

[[foreign]]
name = "VGA BIOS ROM"
low = 0xC0000
high = 0xC8000

# C8000-EFFFF stays out: an upper memory block there may hold a program loaded
# high or the extender's own real-mode buffers.
[[foreign]]
name = "system BIOS ROM"
low = 0xF0000
high = 0x100000
