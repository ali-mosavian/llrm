# ld65 layout of an Atari 8-bit XEX file: $FFFF, one load chunk (start, inclusive end, bytes) at
# $2000, then a RUNAD chunk. Variables at $4000, the soft stack grows down from $8000.
MEMORY {
    HEADER:  file = %O, start = $0000, size = $0002;
    MAINHDR: file = %O, start = $0000, size = $0004;
    MAIN:    file = %O, define = yes, start = $2000, size = $4000 - $2000;
    TRAILER: file = %O, start = $0000, size = $0006;
    BSS:     file = "", start = $4000, size = $1000;
}
SEGMENTS {
    HEADER:  load = HEADER,  type = ro;
    MAINHDR: load = MAINHDR, type = ro;
    CODE:    load = MAIN,    type = ro;
    RODATA:  load = MAIN,    type = ro, optional = yes;
    DATA:    load = MAIN,    type = rw, optional = yes;
    TRAILER: load = TRAILER, type = ro;
    BSS:     load = BSS,     type = bss, optional = yes;
}
