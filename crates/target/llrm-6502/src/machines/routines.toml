# What the runtime's memcpy costs a call, in clocks, when a function with the copy as a call is priced
# against the same function with it as a loop (bytes first, clocks break a tie). Memcpy's own figures are
# measured from mos_rt.s.
[copy]
# Entry and exit: the page count, the return value, the saved byte.
entry_clocks = 60
# The page loop: lda (zp),y; sta (zp),y; iny; bne.
clocks_per_byte = 16
# The length a copy of unknown length is priced at (`profit::UNKNOWN_TRIPS`).
typical_bytes = 10

[compact]
# A routine with a compact variant: the same result in fewer bytes and more clocks. The call is renamed
# at size (-Os, -Oz); at speed the fast one stays. __udivhi3c is the bit loop without the short-divisor path; the
# signed pair is the same sign handling over it.
__udivhi3 = "__udivhi3c"
__umodhi3 = "__umodhi3c"
__divhi3 = "__divhi3c"
__modhi3 = "__modhi3c"

[share]
# Policy, for a speed routine linked at size (the speed multiply): the share of its estimated clocks a
# module must save for each percent of its bytes the routine adds.
percent_per_percent = 4
