# What the runtime's memcpy costs a call, in clocks, when a function with the copy as a call is priced
# against the same function with it as a loop (bytes first, clocks break a tie). Memcpy's own figures are
# measured from mos_rt.s.
[copy]
# Entry and exit: the page count, the return value, the saved byte.
entry_clocks = 60
# The page loop: lda (zp),y; sta (zp),y; iny; bne.
clocks_per_byte = 16
# The length a copy of unknown length is priced at (`profit::UNKNOWN_TRIPS`).
typical_bytes = 10

[compact]
# A routine with a compact variant: the same result in fewer bytes and more clocks. The call is renamed
# at size (-Os, -Oz); at speed the fast one stays. __udivhi3c is the bit loop without the short-divisor path; the
# signed pair is the same sign handling over it.
__udivhi3 = "__udivhi3c"
__umodhi3 = "__umodhi3c"
__divhi3 = "__divhi3c"
__modhi3 = "__modhi3c"
__divmodhi4 = "__divmodhi4c"

[pin.division16]
# DEVIATE 6502-DIV-16-OS-PIN-IMAGE (owner llrm-target-6502, review 2027-01-31): what the pin's flow links for the same
# 16-bit division, in bytes. llvm-mos a40207a (mos-sim-clang -Os -fno-lto, one program, the LINKED image, llvm-nm -S,
# 2026-11-23): `__modhi3` 111 + `__umodhi3` 174 = 285 for a signed remainder, `__umodhi3` 174 alone for an unsigned one
# (cross-check: the whole image of the signed program is 716 B). At size our speed routines are taken for the clocks they
# save while the image they link is no larger than the pin's for the same kind.
signed = 285
unsigned = 174

[share]
# Policy, for a speed routine linked at size (the speed multiply): the share of its estimated clocks a
# module must save for each percent of its bytes the routine adds.
percent_per_percent = 4

[share.size]
# The same, per routine, where the general rate is not the routine's. DEVIATE 6502-DIV-16-OS (owner llrm-target-6502,
# exit 2026-12-12): the pin's `__udivhi3` is one routine. The 16-bit speed division at size (131-166 bytes of image over the
# compact one): bytes are first on this target at every level (user ruling 2026-11-14), so 2, not the speed table's 1
# (ruling 2026-11-18): at 1 compound_assignment_types Os went 892 -> 1,044 B, over sdcc's 1,015.
division16 = 2
# The multiply by a constant expanded in line instead of called (`mulimage::expand_when_unshared`).
mul_expand = 2
# ... and only where the expansion removes at least this percent of the module's estimated clocks: a module whose
# clocks are elsewhere keeps its bytes (bytes are first at size; call_keeps +190 B for -21% clocks stays a call).
mul_expand_floor = 60

[share.speed]
# The same, at the speed levels (O1-O3), per routine: clocks are the second goal there and a module's bytes
# under the bytes bar are headroom (coordinator ruling 2026-11-18). 0 for the 16-bit division: the speed routine is
# taken wherever its clocks repay its bytes (`select::speed_division16_pays`, 12 clocks a byte; a cold division stays
# compact). The static run estimate rates a recursion's divisions low (idiv_loop_os -O1: 200 runs of 2,800), so the
# share test kept the compact routine there: 2.34M clocks against llvm-mos's 1.07M. Corpus A/B of the test off, both
# CPUs at O1-Os: one cell changes (idiv_loop_os O1 385 -> 519 B, 2.34M -> 1.03M clocks; bytes bar 685).
division16 = 0
# The outliner at -O2 and -O3: a place is kept where the share of the module's clocks its calls add is at most
# this many times the share of the module's bytes it saves.
outline = 1
