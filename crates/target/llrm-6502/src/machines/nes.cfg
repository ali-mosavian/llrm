# ld65 layout of an NES NROM image: iNES header, 32K PRG at $8000 with the vectors at $FFFA, 8K CHR.
# Variables are in RAM at $0200, the soft stack grows down from $0700. No DATA: initialised data
# would sit in ROM and nothing copies it.
MEMORY {
    HEADER:  file = %O, start = $0000, size = $0010, fill = yes;
    ROM0:    file = %O, start = $8000, size = $7FFA, fill = yes;
    ROMV:    file = %O, start = $FFFA, size = $0006, fill = yes;
    CHR:     file = %O, start = $0000, size = $2000, fill = yes;
    RAM:     file = "", start = $0200, size = $0500;
}
SEGMENTS {
    HEADER:  load = HEADER, type = ro;
    CODE:    load = ROM0,   type = ro;
    RODATA:  load = ROM0,   type = ro, optional = yes;
    VECTORS: load = ROMV,   type = ro;
    CHARS:   load = CHR,    type = ro, optional = yes;
    BSS:     load = RAM,    type = bss, optional = yes;
}
