# ld65 layout of a C64 PRG: the load address, a BASIC line `10 SYS 2061`, then the code at $080D.
MEMORY {
    LOADADDR: file = %O, start = $07FF, size = 2;
    MAIN:     file = %O, start = $0801, size = $96FF;
}
SEGMENTS {
    LOADADDR: load = LOADADDR, type = ro;
    BASIC:    load = MAIN, type = ro;
    CODE:     load = MAIN, type = ro;
    RODATA:   load = MAIN, type = ro, optional = yes;
    DATA:     load = MAIN, type = rw, optional = yes;
    BSS:      load = MAIN, type = bss, optional = yes;
}
