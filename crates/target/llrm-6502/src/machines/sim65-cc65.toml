# sim65 with cc65's sim6502 libraries linked: the same memory as `sim65`, and cc65's `_` before every C symbol, so a C
# global named like a library symbol (`sp`, `ptr1`, `tmp1`) does not meet it at link time and `main` is the `_main` crt0 calls.
[platform]
name = "sim65-cc65"
load_address = 0x0200
imag_base = 0x80
zero_page = 26
# The runtime's 15 scratch bytes (`__sa`, `__ra`, `__st`, `__sr`, `__sg`) are ZEROPAGE: ld65 puts them above cc65's own
# $00..$19, clear of the registers at $80 (the cfg's ZEROPAGE is $0000 size $0100). A two-byte address where BSS takes three.
scratch_zero_page = 15
soft_stack = 0x8000
c_symbol_prefix = "_"
