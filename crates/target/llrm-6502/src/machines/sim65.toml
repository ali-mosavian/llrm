# cc65's `sim65`, target sim6502: 64K of RAM, cc65's own zero page is $00..$19, the program at $0200.
# The oracle the spike checks its output against.
# zero_page = 26: cc65's own ZP segment for this target is $0000 size $0100 (all of it; cc65 runtime keeps $00..$19, which this program does not link) (/usr/share/cc65/cfg/sim6502.cfg:6); the program must assume: only this runtime is linked; no cc65 library code runs.
[platform]
name = "sim65"
load_address = 0x0200
imag_base = 0x80
zero_page = 26
# The runtime's 15 scratch bytes (`__sa`, `__ra`, `__st`, `__sr`, `__sg`) sit in zero page at $9A..$A8, after the 26
# registers ($80..$99); cc65's own bytes are $00..$19 and the cfg's ZEROPAGE is $0000 size $0100. Two-byte addresses where BSS takes three.
scratch_zero_page = 15
# 87 bytes from $A9 to $FF (after the registers and the scratch's 15) are the whole program's `s_` cells that the loops touch most
# (`zerospill`); the rest stay BSS.
static_zero_page = 87
soft_stack = 0x8000
