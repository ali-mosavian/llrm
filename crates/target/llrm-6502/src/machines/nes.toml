# ZP from cc65's nes config ($02); the image is assembled, linked and its header and vectors are
# tested, nothing here runs an NES.
[platform]
name = "nes"
status = "built"
load_address = 0x8000
imag_base = 0x02
zero_page = 26
soft_stack = 0x0700
