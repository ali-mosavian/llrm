# ld65 layout of an Apple II DOS 3.3 binary: load address and length (4 bytes), then the program at
# $0803 (cc65's apple2.cfg start). The zero page $80..$99 is cc65's own range, HIMEM is $9600: the variables are at $8000, the soft stack
# grows down from HIMEM.
MEMORY {
    HEADER: file = %O, start = $07FF, size = 4;
    MAIN:   file = %O, define = yes, start = $0803, size = $8000 - $0803;
    BSS:    file = "",               start = $8000, size = $1000;
}
SEGMENTS {
    HEADER: load = HEADER, type = ro;
    CODE:   load = MAIN, type = ro;
    RODATA: load = MAIN, type = ro, optional = yes;
    DATA:   load = MAIN, type = rw, optional = yes;
    BSS:    load = BSS, type = bss, optional = yes;
}
