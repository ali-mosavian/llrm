[package]
name = "llrm-6502"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "The 6502 target: its descriptions and DAG selector tables, generated from mos6502.td"

[dependencies]
llrm-dagisel = { path = "../../backend/llrm-dagisel" }
llrm-codegen = { workspace = true }
llrm-target = { workspace = true }
llrm-object = { workspace = true }
llrm-debug = { workspace = true }
llrm-lir = { workspace = true }
llrm-mir = { workspace = true }
llrm-spike-mf = { workspace = true }
llrm-elf = { workspace = true }
llrm-transforms = { workspace = true }
toml = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }

[build-dependencies]
llrm-target = { workspace = true }
llrm-lir = { workspace = true }

[[bin]]
name = "llrm-6502-llc"
path = "src/bin/llc.rs"
