evidence = '''
87btrig.asm, disassembled from the linked image because the math library is not in the source drop. tools/libdump.py shows one module defining B$SIN4, B$SIN8, B$COS4, B$COS8, B$TAN4, B$TAN8 and the __FI aliases, and in the library its first bytes are four `mov dx,<relocated>` stubs that all jump to one shared kernel -- six names, four stubs, because SIN4/SIN8 and COS4/COS8 each share an entry. In qbdemo's BASE.EXE that stub is at image 0x8b43 with the selectors relocated to 0x4a2, 0x4ba, 0x4d2 and 0x4ea, 24 bytes apart, and the kernel it jumps to is 0x8b81: push bp / mov bp,sp / sub sp,12h / call 0x8c09 / mov al,[bp-11h] / or al,al, and the normal path is mov sp,bp / pop bp / retf. The arithmetic at 0x8c09 is `int 35h` with the emulator's inline operand, which declen.py decodes. So: an 18-byte frame of its own below sp and the emulator's own DGROUP word, and no caller cell -- the same basis on which 87bhelp.asm's six helpers beside it in this library are NONE, and the same as B$FCMP's fnstsw. `retf` with no immediate is the cleanup: nothing arrives on the 8086 stack, the operand is on the x87 stack. One path leaves instead of returning -- `jmp 01B5h:4610h` at 0x8bd0, reached after testing al and the flag byte at [bp-6] -- so raises_error stays true and reachable() gates it on whether the program handles errors. Registers stay at the worst case: the stub itself writes dx and the kernel writes ax and bx, and nothing here establishes what the emulator tail preserves.
'''

