# Which routines write a runtime cell a program names by EXTDEF, where the
# runtime source settles it. A call to anything else leaves the cell alone,
# unless it runs the program's own code -- which `enters_user_code` and an
# error handler say, and the caller asks.
#
# b$seg, QuickBASIC 4.5: rt/rtinit.asm writes it three times and nothing else
# does. B$DSG0 `MOV [b$seg],DS` and B$DSEG `MOV [b$seg],AX`; B$RTCLR
# `MOV b$seg,DS`, reached through b$clr_disp from clear.asm's B$SCLR (whose
# CLR_RUN B$RUNL and B$StackReset jump to) and through b$run_disp's
# B$RTRUNINI from B$IINIT, B$Init and B$RUNINI. abs.asm, peek.asm and
# bload.asm only read it, and no reference takes its address. ABSOLUTE runs
# machine code of the program's choosing.
[[writers]]
cell = "b$seg"
family = "qb45"
routines = ["B$DSEG", "B$DSG0", "B$SCLR", "B$RUNL", "B$StackReset", "B$Init", "B$IINIT", "B$RUNINI", "ABSOLUTE"]

# llrm's runtime takes its calls as the target's own convention states them, except these routines, whose
# stack block is the call site's own length (the bounds of every dimension, the channels closed): a register
# convention cannot name that, so they keep BASIC's pushes and are popped by the callee.
[llrm]
stack_abi = ["B$CLOS", "B$COLR", "B$CSCN", "B$DDIM", "B$FERR", "B$LOCT", "B$OEGA", "B$RDIM", "B$RESN", "B$SERR"]

# What a call of the llrm runtime does to the heaps a loop's cached array words live in. `moves_far_heap`: it reclaims the
# far heap (shell.c: qb_shell_reclaim after the child returns). `moves_near_heap`: it compacts the local heap, which slides
# a near array (file.c close_fdb and fre.c nh_compact: B$CLOS, B$FRSD, B$FRI2). DIM, REDIM and ERASE allocate by their tags.
moves_far_heap = ["B$SSHL"]
moves_near_heap = ["B$CLOS", "B$FRSD", "B$FRI2"]

