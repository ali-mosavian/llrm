# What an inline copy of a routine computes, where the program is told how
# the runtime reads a string. The interprocedural inliner prices each copy
# against the call it replaces; a routine nothing here describes keeps its
# call.
#
# A runtime keeps its strings in one `form`. A `near` string is a descriptor
# in DGROUP: a `length` word and a `data` pointer at these offsets, `size`
# bytes in all, and a literal is that descriptor with its bytes after it.
# QB 4.5 and PDS 7.1 are near. VBDOS's strings are `far`: the length is in
# the payload's header, not at an offset in the descriptor, so nothing here
# reads one and every routine below keeps its call there.

[layout.qb45]
form = "near"
length = 0
data = 2
size = 4

[layout.pds71]
form = "near"
length = 0
data = 2
size = 4

[layout.vbdos]
form = "far"

# llrm's runtime lays a descriptor out as a C struct of a length and a near pointer, each a word of the target:
# QB 4.5's four bytes where the pointer is 2 bytes, and a length as wide as the pointer where that is wider.
[layout.llrm]
form = "near"
length = 0
data = 2
size = 4
natural = true

# What `-fsanitize=stack` compares and calls, per runtime. `limit` is the data-group word holding
# the lowest SP the runtime allows, `handler` the far routine entered when SP falls below it, and
# `entry` the runtime's own frame entry that checks (BC's /D calls it in place of B$ENRA, which
# does not check). `red_zone` is the bytes below the limit the runtime promises nothing else uses
# beyond its handler: 0 where that is not measured, so no leaf goes unchecked.
# Source: rt\rtenexit.asm in BCOM45.LIB, BCL71ENR.LIB and VBDCL10E.LIB, disassembled: B$ENRD
# does `mov ax,sp; sub ax,cx; jc E; sub ax,HDR; jc E; cmp ax,[b$pendchk]; jc E`, E being
# `push bp; mov bp,sp; jmp B$ERR_OSS` ("Out of stack space", the fatal 9007h of messages.inc),
# and falls into B$ENRA.

[stack.qb45]
limit = "b$pendchk"
handler = "B$ERR_OSS"
entry = "B$ENRD"
red_zone = 0

[stack.pds71]
limit = "b$pendchk"
handler = "B$ERR_OSS"
entry = "B$ENRD"
red_zone = 0

[stack.vbdos]
limit = "b$pendchk"
handler = "B$ERR_OSS"
entry = "B$ENRD"
red_zone = 0

[stack.llrm]
like = "qb45"

# `parameters`: `string` is a descriptor's address, `int` a word. `result`
# is a word, or a `view`: a string made of a `length` and a `data` address,
# which the runtime allocates a temporary descriptor for. `check` raises
# error `raise` where `when` holds; it is emitted only where the program
# asks for run-time checks or handles errors. `releases` lists the string
# parameters the routine frees if the runtime allocated them, which no copy
# can: a copy stands in only where the actual is not a runtime temporary.
# `$n` is parameter n; `len($n)` and `data($n)` read a string parameter;
# `byte(p)` is the byte at p; `slot(v)` the address of a frame byte holding v's low byte.

[semantics."B$FLEN"]
evidence = "rt/strfcn.asm B$FLEN: the length word of the descriptor."
parameters = ["string"]
result = "len($0)"
inline = "always"

[semantics."B$FASC"]
evidence = "rt/strfcn.asm B$FASC: a null string is JZ ERRFC -> B$ERR_FC (error 5); otherwise the first byte, and B$STDALCTMP frees the argument if it is a temp."
parameters = ["string"]
result = "byte(data($0))"
releases = [0]
inline = "always"
check = { when = "len($0) == 0", raise = 5 }

[semantics."B$FMID"]
evidence = "rt/mid.asm: MID$(s, i, n) is the n bytes of s from the i-th, fewer where s ends and none past it; a start below 1 or a negative count is error 5."
parameters = ["string", "int", "int"]
releases = [0]
inline = "always"
view = { length = "min($2, max(0, len($0) - $1 + 1))", data = "data($0) + ($1 - 1)" }
check = { when = "$1 < 1 or $2 < 0", raise = 5 }

[semantics."B$FCHR"]
evidence = "rt/stcore.asm B$FCHR: OR AH,AH / JNZ ERRFC raises error 5 where the value is not a byte; otherwise a one-byte temporary string holds it."
parameters = ["int"]
inline = "always"
view = { length = "1", data = "slot($0)" }
check = { when = "$0 < 0 or 255 < $0", raise = 5 }

# Normal-return stack cleanup read directly from the matching entry in all
# three shipped Microsoft runtimes.  This is deliberately only a stack ABI
# table: memory, clobber, allocation, error and alias effects remain those of
