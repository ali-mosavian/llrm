# What each QuickBASIC 4.5 runtime routine does, one row per routine.
#
# Data, not code: every field here is a claim about the runtime, and a
# claim wants an audit trail more than it wants a Python literal.
# `evidence` says where each came from -- the runtime source for the
# register and control facts, and `tools/runtime_writes.py` reading a
# linked image for what it writes.
#
# `established = false` means nothing here is known: the row concedes
# every register and every byte of memory, which is the only safe answer
# to a routine nobody has read.
#
# `captures = "NONE"` (optional, default: may keep) says the routine keeps no
# pointer argument past its return; it needs the source to show it.
#
# `cleanup = -1` is "not known", which is not the same as zero.
#
# For `llrm-qb` a row changes a listing only through `captures = "NONE"` (a
# pointer argument the routine keeps no copy of) or `raises_error = false`
# (the call is nounwind): any routine without a row already writes only
# runtime cells when the program handles no errors. Rows for B$PECY, B$PSR8,
# B$PCR8, B$PSR4 and B$PEOS were measured to leave the listing identical.

