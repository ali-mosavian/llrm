[package]
name = "llrm-qb"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "The QuickBASIC-family source frontend"
default-run = "qbfront"

[lib]
name = "llrm_qb"

[[bin]]
name = "qbfront"
path = "src/bin/qbfront.rs"

[dependencies]
llrm-support = { workspace = true }
llrm-core = { workspace = true }
llrm-driver = { workspace = true }
llrm-hir = { workspace = true }
llrm-qbruntime = { workspace = true }
llrm-mir = { workspace = true }
llrm-transforms = { workspace = true }
indexmap = { workspace = true }
logos = "0.16.1"
num-bigint = { workspace = true }
num-traits = { workspace = true }
rustc-hash = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
tempfile = { workspace = true }
toml = { workspace = true }

[dev-dependencies]
llrm-x86-m16 = { workspace = true }
llrm-object = { workspace = true }
regex = { workspace = true }
llrm-analysis = { workspace = true }
llrm-core = { workspace = true, features = ["testing"] }
