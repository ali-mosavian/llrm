# What `-fsanitize=stack` compares and calls, as Open Watcom's runtime has it: `_STACKLOW`, a
# DGROUP word start-up fills with the stack's bottom (clib/startup/a/cstrt086.asm), which `__STK`
# compares the new SP with (stk086.asm), and `__STKOVERFLOW`, the far routine it enters, which
# prints "Stack Overflow!" and exits with status 1. SS is DGROUP, so SP is an offset in it.
#
# `red_zone` is 0: nothing is promised below `_STACKLOW` beyond the handler's own frames, so no
# leaf goes unchecked.
limit = "_STACKLOW"
handler = "__STKOVERFLOW"
red_zone = 0
