[package]
name = "qbfront"
version = "0.1.0"
edition = "2021"
description = "QB/QBasic/PDS/VBDOS source frontend for llrm"
default-run = "qbfront"

[lib]
name = "qbfront"
path = "src/lib.rs"

[[bin]]
name = "qbfront"
path = "src/main.rs"

[dependencies]
buildprs = { path = "crates/buildprs" }
llrm-hir = { path = "../../ir/llrm-hir" }
llrm-qbruntime = { path = "../llrm-qbruntime" }

[build-dependencies]
buildprs = { path = "crates/buildprs" }
