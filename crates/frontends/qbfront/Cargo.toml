[package]
name = "qbfront"
version = "0.1.0"
edition = "2021"
description = "QB/QBasic/PDS/VBDOS source frontend for llrm"
default-run = "qbfront"

[lib]
name = "qbfront"
path = "src/lib.rs"

[[bin]]
name = "qbfront"
path = "src/main.rs"

[dependencies]
llrm-hir = { path = "../../ir/llrm-hir" }
llrm-qbruntime = { path = "../llrm-qbruntime" }
logos = "0.16.1"
llrm-core = { path = "../../backend/llrm-core" }
llrm-driver = { path = "../../backend/llrm-driver" }
