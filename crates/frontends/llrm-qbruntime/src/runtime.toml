# What each QuickBASIC-family runtime routine does, one table per routine.
#
# Data, not code: every field here is a claim about the runtime, and a
# claim wants an audit trail more than it wants a Python literal.
# `evidence` says where each came from -- the runtime source for the
# register and control facts, and `tools/runtime_writes.py` reading a
# linked image for what it writes.
#
# A table's contract fields are the routine's row. A row states what is
# established; every field it leaves out is worst()'s, which concedes every
# register and every byte of memory -- the only safe answer to a routine
# nobody has read. `established = false` means nothing in the row is known.
# `cleanup = -1` is "not known", which is not the same as zero.
#
# A subtable named for a family -- qb45, pds71, vbdos -- is that family's own
# row, filled the same way. `from = "NAME"` or `from = "NAME.family"` fills a
# row from that one instead; its own evidence comes first, then that row's.
#
# Facts about the routine itself, whatever its row:
#   flags_result   its result is the flags, as `cmp result, 0` leaves them
#   calls_program  hands control back to the program, so it writes what the
#                  code it runs writes -- GCC's modref gives up on an indirect
#                  call for the same reason
#   never_returns  never comes back to its caller
#   error_funnel   the registers the error funnel reads its error in
#   by_value       its stack arguments are values, not caller pointers
#   writes_cells   per family, the runtime cells a program names by EXTDEF
#                  that it writes, where the runtime source settles it
#   ends_module    a BASIC module body's fallthrough calls it, and every
#                  module references it
#   requires       a symbol a call to it makes the object reference, chosen
#                  by the constant value of one argument: `values` maps each
#                  symbol to its values, `none` needs nothing, `otherwise`
#                  answers any other value or a non-constant argument
# A table named `PREFIX*` gives its facts to every routine with that prefix.

# How a typed source call to a routine is described: its `call` table.
#   pushed   the stack bytes it matches: a number, "any", or "even >= N"
#   family   only under this family
#   label    only the label form (the frontend's `$QB$RESA:target`)
#   control, enters_user_code, error_handling, inputs
#            what the call does; by default it returns, runs no program
#            code, keeps the row's error handling and reads no register
#   results  the registers it answers in, beside the stack block
#   evidence or audit
#            why, or the name of a shared text below; {evidence} is the
#            row's, {name} and {pushed} the call's
# Such a call is established: it removes the bytes it matched.
[audits]
# Stack widths read from actual QB45 /A output, then checked against the
# shipped runtime's RETF.
statement = '''
{evidence} Actual QB45 /A output supplies {pushed} stack bytes to {name}; the shipped runtime returns past that exact fixed block. All non-stack effects remain conservative.
'''
# Stack widths read from actual QB 4.5 /A listings for the graphics forms,
# then checked against their runtime RETF cleanup. Coordinate state is latched
# by N1/N2 before the drawing call; it is deliberately not hidden in MIR.
graphics = '''
{evidence} QB45 /A listings show {name} consuming exactly {pushed} typed stack bytes; the shipped runtime returns past the same block. All graphics-state, memory, error, and clobber effects remain conservative.
'''
# Normal-return stack cleanup read directly from the matching entry in all
# three shipped Microsoft runtimes. Only a stack ABI claim: memory, clobber,
# allocation, error and alias effects remain those of the conservative
# runtime contract. BCOM45/BCL71ENR/VBDCL10E hashes are 5b1c7a6f...,
# 873fde67..., and 59ad49b0...; tools/libdump.py records the member, entry
# offset and RETF for every row. SCAT is family-specific (the VBDOS far-string
# entry consumes an extra word), so it has none.
string = '''
{evidence} Typed source supplies {pushed} stack bytes. BCOM45.LIB, BCL71ENR.LIB and VBDCL10E.LIB expose the same Pascal {name} normal-return cleanup; tools/libdump.py shows RETF {pushed} in each member. All non-stack effects remain conservative.
'''
print = '''
{evidence} QB45 rt/prnval.asm and rt/prnvalfp.asm dispatch {name} to B$PRINT, whose typed epilogue removes the {pushed}-byte value.
'''
output = '''
{evidence} QB45 rt/pr0a.asm/prnval.asm establishes the typed {name} entry with {pushed} stack bytes; output and error effects remain conservative.
'''
read = '''
{evidence} QB45 rt/read.asm sends {name} through CommRead with one far destination pointer; its shared cEnd removes 4 bytes.
'''
bounds = '''
{evidence} QB45 rt/dynamic.asm declares pAd and iDim as two word Pascal parameters for {name}; the shared cEnd removes exactly four bytes. Bounds errors and descriptor effects remain conservative.
'''
# B$ExitDim removes three header words and two words per dimension.
dim = '''
rt/dynamic.asm {name} reaches DIM_COMMON with stack parameters; B$ExitDim removes 6 + 4*rank bytes, represented exactly by this call site's typed operands. Other effects stay conservative.
'''
screen-parameters = '''
QB45 runtime/rt/gwscr.asm documents a presence word and optional value for each positional argument, followed by their word count; this site supplies {pushed} bytes. B$ScCleanUpParms removes that complete count-led block; later runtimes retain it.
'''
# The shared object raiser keeps these conservative because it does not
# model the mathpack's transitive stack paths. At a typed source site the
# wrapper's own RETF and exact argument width establish normal cleanup
# without any stronger effect claim.
string-of-float = '''
{evidence} VBDOS stringfp.asm wrapper ends RETF {pushed}; typed source supplies that exact stored floating argument. All memory, clobber and error effects remain conservative.
'''
record-3 = '''
{evidence} QB45 rt/dvstmt.asm declares Channel word, RecPtr dword, and RecLen word; B$GET3 cEnd returns past all 8 bytes and B$PUT3 joins that epilogue. Other effects stay conservative.
'''
record-4 = '''
{evidence} QB45 rt/dvstmt.asm declares Channel word, RecNum dword, RecPtr dword, and RecLen word; both entry points return past all 12 bytes.
'''
event-argument = '''
{evidence} QB45 rt/osstmt.asm declares one word descriptor or integer parameter for {name}; the far Pascal entry returns past 2 bytes.
'''
error-value = '''
{evidence} Typed ERR/ERL has no arguments; rt/error.asm returns directly after loading the saved value.
'''

