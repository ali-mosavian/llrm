[package]
name = "llrm-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "llrm's HIR, MIR, optimizer, x86 backend, OMF object support and BC raising"

[dependencies]
llrm-support = { workspace = true }
llrm-cycles = { workspace = true }
llrm-omf = { workspace = true }
llrm-hir = { workspace = true }
iced-x86 = { workspace = true }
indexmap = { workspace = true }
num-bigint = { workspace = true }
num-traits = { workspace = true }
rustc-hash = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
tempfile = { workspace = true }
toml = { workspace = true }

[features]
# testing, for the other crates' tests
testing = ["llrm-omf/testing"]

[dev-dependencies]
llrm-omf = { workspace = true, features = ["testing"] }
regex = { workspace = true }
