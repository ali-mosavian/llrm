# Real-mode DOS on a PC with VGA.

# A far address is selector * 16 + offset.
addressing = "real"

# The processor code is priced for.
cpu = "486"

# The segment registers the program model reserves: the data group every
# unprefixed access reads, the stack and the code. The rest hold selectors.
# The stack lives in the data group, so ss: reaches the data too.
[segments]
data = "ds"
stack = "ss"
code = "cs"
stack_is_data = true

# Linear [low, high) ranges no program's own data occupies. A write there
# reaches no variable, array or runtime cell.
[[foreign]]
name = "VGA memory: graphics, monochrome and colour text"
low = 0xA0000
high = 0xC0000

[[foreign]]
name = "VGA BIOS ROM: B800:FFFF ends inside it"
low = 0xC0000
high = 0xC8000

# I/O ports a write to changes no memory. The VGA DAC: PEL mask, read
# index, write index, data; the palette is mapped at no address.
[[silent_ports]]
name = "VGA DAC"
low = 0x3C6
high = 0x3CA
