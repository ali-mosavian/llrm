[package]
name = "llrm-cc"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "cc-compatible driver: the pinned clang's front end, llrm's optimizer and backend"

[dependencies]
llrm-driver = { workspace = true }
llrm-mir = { workspace = true }
llrm-target = { workspace = true }
llrm-x86-m16 = { workspace = true }
serde = { workspace = true }
toml = { workspace = true }

# Named apart from the root package's `llrm-cc` (src/bin/llrm-cc.rs), which tools and scripts run: two bins of one name wrote one file.
# This one is the crate's own integration tests' (CARGO_BIN_EXE_llrm-cc-bin).
[[bin]]
name = "llrm-cc-bin"
path = "src/main.rs"
