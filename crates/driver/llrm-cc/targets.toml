# The per-target facts of llrm-cc, and the only place they are written. Keyed by name; `-target` takes a name or a
# triple. `clang` are the arguments the pinned clang gets (triple, headers, macros), `llc` the ones llrm-llc gets.
# `datalayout` is what clang must print for the triple: a mismatch is refused before llrm sees the IR. `{datalayout:x86-m16}` stands for
# that target's `datalayout.toml` string (stated once, there); a suffix after it is the row's own.
# `description` names the crate whose `[c]` states sizeof(int, long, void *, ...); `wchar_bytes` and `long_double_bytes` are the row's libc's departures from it (tests/c_abi.rs
# holds the front end to them; the triple's default decides nothing).
# `llc_program` (default llrm-llc) and `llc_level` (default true: it takes -O<n>) say how the backend is run; a row without a level must give `llc_level_reason`.
# `llc_passes` (default true) says the backend takes the `-f[no-]PASS` switches; a row that does not gives `llc_passes_reason`, and the driver leaves them out with a warning (clang has written `noinline` and the loop hints into the IR).
# `llc_mcmodel` (default false) says the backend takes `-mcmodel=` and clang does not (the pin's clang refuses it for m68k): the flag goes to the backend alone.
# `unroll_at_o1` (default false) makes `-funroll-loops` the default at -O1 (DEVIATE UNROLL-O1: clang marks every loop unroll-disable there, so the pin's -O1 never unrolls).
# `thread_jumps_at_o1` (default false) makes `-fthread-jumps` the default at -O1 for the backend (DEVIATE JUMPTHREAD-O1: the pin's -O1 pipeline has no JumpThreadingPass).
# `clang_env` names an environment variable holding a clang for the target (m16's carries the i8086 patch).
# `link` is the recipe for objects to an executable; `{objects}` and `{flags}` stand for lists, `{output}` for a path, `{root}` for the llrm checkout.

[x86_64-linux]
description = "x86-m64"
triple = "x86_64-unknown-linux-gnu"
datalayout = "e-m:e-p270:32:32-p271:32:32-p272:64:64-i64:64-i128:128-f80:128-n8:16:32:64-S128"
clang = ["-target", "x86_64-unknown-linux-gnu"]
llc = []
object = "elf"
link = ["cc", "{objects}", "{flags}", "-o", "{output}"]
unroll_at_o1 = true

# `run` (optional) is the command that runs an executable of the target, the executable last; the checks use it.

# Flat DOS under DOS/32A. Clang's i386 layout differs from llrm's only in preferred alignments, so the module's layout
# is replaced by `datalayout` once the facts that matter are equal. Functions are cdecl (`-mabi=sysv`).
[x86_32-dos]
description = "x86-m32"
# The i8086 fork's clang reads `#pragma aux NAME "LINK"`, which the OS layer's header (llrm_os.h) names its routines with.
clang_env = "LLRM_CLANG_M16"
triple = "i486-unknown-linux-gnu"
datalayout = "{datalayout:x86-m32}"
clang = ["-target", "i486-unknown-linux-gnu", "-ffreestanding", "-fno-pic", "-fno-stack-protector", "-fno-asynchronous-unwind-tables",
  "-U__linux__", "-U__linux", "-U__gnu_linux__", "-Ulinux", "-D__DOS__=1", "-DPHYSICAL_TEXT_SCREEN=0xB8000UL", "-include", "{root}/toolchain/clang/flat.h"]
llc = ["-fobject-format=omf", "-mabi=sysv"]
object = "omf"
link = ["python3", "-I", "{root}/tools/dosbatch/link_objects.py", "x86-m32", "{output}", "{objects}"]
# How a program runs on the host: a command taking the executable last.
run = ["python3", "-I", "{root}/tools/dosbatch/run_exe.py", "x86-m32"]
unroll_at_o1 = true
thread_jumps_at_o1 = true

# arm64 Linux, run under qemu-aarch64 against the freestanding runtime of the arm64 tests (tools/targets/arm64-link.sh).
[arm64-linux]
description = "arm64"
triple = "aarch64-unknown-linux-gnu"
datalayout = "e-m:e-p270:32:32-p271:32:32-p272:64:64-i8:8:32-i16:16:32-i64:64-i128:128-n32:64-S128-Fn32"
clang = ["-target", "aarch64-unknown-linux-gnu", "-ffreestanding"]
llc = []
llc_program = "llrm-arm64-llc"
llc_level = true
object = "elf"
link = ["{root}/tools/targets/arm64-link.sh", "{output}", "{objects}"]
run = ["qemu-aarch64"]

# Real-mode DOS, Borland medium model: far code (function pointers and `P1` functions), near data, byte-packed
# structs. `far`, `huge`, `near` are Borland's keywords on clang's address spaces.
# Needs the patched clang: tools/build-clang-m16.sh, then LLRM_CLANG_M16=<its path>.
[x86_16-dos]
description = "x86-m16"
triple = "i386-unknown-unknown-code16"
datalayout = "{datalayout:x86-m16}-ni:2:3"
clang_env = "LLRM_CLANG_M16"
clang = [
  "-target", "i386-unknown-unknown-code16", "-march=i486", "-ffreestanding", "-fpack-struct=1", "-mms-bitfields", "-fno-pic", "-fomit-frame-pointer",
  "-fno-stack-protector", "-fno-asynchronous-unwind-tables", "-D__DOS__=1", "-DPHYSICAL_TEXT_SCREEN=0xB8000UL", "-U__STDC__", "-Wno-builtin-macro-redefined", "-std=gnu89", "-fborland-extensions", "-include", "{root}/toolchain/clang/borland.h",
]
llc = ["-mabi=cdecl"]
object = "omf"
link = ["python3", "-I", "{root}/tools/dosbatch/link_objects.py", "x86-m16", "{output}", "{objects}"]
run = ["python3", "-I", "{root}/tools/dosbatch/run_exe.py", "x86-m16"]

# The same compiler against Borland C++ 3.1's headers and library, as its programs are written: LLRM_BORLAND_INC is the
# lower-case mirror tools/lowercase-includes.sh makes of its INCLUDE, LLRM_BORLAND_LIB its LIB.

# x86_16-dos with the register convention llrm-cc had at m16 (regparm3, `name@3`): the all-llrm configuration. x86_16-dos stays cdecl for
# programs linked with Borland objects.
[x86_16-dos-rp3]
description = "x86-m16"
triple = "i386-unknown-unknown-code16"
datalayout = "{datalayout:x86-m16}-ni:2:3"
clang_env = "LLRM_CLANG_M16"
clang = [
  "-target", "i386-unknown-unknown-code16", "-march=i486", "-ffreestanding", "-fpack-struct=1", "-mms-bitfields", "-fno-pic", "-fomit-frame-pointer",
  "-fno-stack-protector", "-fno-asynchronous-unwind-tables", "-D__DOS__=1", "-U__STDC__", "-Wno-builtin-macro-redefined", "-std=gnu89", "-fborland-extensions", "-include", "{root}/toolchain/clang/borland.h",
]
llc = ["-mabi=regparm3", "-mc-library"]
object = "omf"
link = ["python3", "-I", "{root}/tools/dosbatch/link_objects.py", "--entry", "main_", "x86-m16", "{output}", "{objects}"]
run = ["python3", "-I", "{root}/tools/dosbatch/run_exe.py", "x86-m16"]

# The same compiler against Borland C++ 3.1's headers and library, as its programs are written: LLRM_BORLAND_INC is the
# lower-case mirror tools/lowercase-includes.sh makes of its INCLUDE, LLRM_BORLAND_LIB its LIB.
[x86_16-bcc]
description = "x86-m16"
triple = "i386-unknown-unknown-code16"
datalayout = "{datalayout:x86-m16}-ni:2:3"
clang_env = "LLRM_CLANG_M16"
clang = [
  "-target", "i386-unknown-unknown-code16", "-march=i486", "-ffreestanding", "-fpack-struct=1", "-mms-bitfields", "-fno-pic", "-fomit-frame-pointer",
  "-fno-stack-protector", "-fno-asynchronous-unwind-tables", "-D__DOS__=1", "-U__STDC__", "-Wno-builtin-macro-redefined", "-std=gnu99", "-fborland-extensions", "-include", "{root}/toolchain/clang/borland.h",
  "-nostdinc", "-isystem", "{root}/toolchain/clang/borland", "-isystem", "{env:LLRM_BORLAND_INC}", "-include", "{root}/toolchain/clang/floatm.h",
]
llc = ["-mabi=cdecl"]
object = "omf"
link = ["python3", "-I", "{root}/tools/bcc_link.py", "{env:LLRM_BORLAND_LIB}", "{output}", "{objects}"]
run = ["python3", "-I", "{root}/tools/dosbatch/run_exe.py", "x86-m16"]

# The i8086 and i386 targets on Open Watcom's headers and the C library tools/build-ow-clib.sh builds: `{ow}` is the
# tree it built in (~/.cache/llrm/ow-src-<commit>, tools/ow-fetch.sh). Calls are Watcom's register convention, as the library's.
[x86_16-wat]
description = "x86-m16"
# Open Watcom libc: wchar_t 2 (unsigned short), long double 8.
long_double_bytes = 8
triple = "i386-unknown-unknown-code16"
datalayout = "{datalayout:x86-m16}-ni:2:3"
clang_env = "LLRM_CLANG_M16"
clang = [
  "-target", "i386-unknown-unknown-code16", "-march=i486", "-fhosted", "-fpack-struct=1", "-mms-bitfields", "-fno-pic", "-fomit-frame-pointer",
  "-D__I86__=1", "-fno-stack-protector", "-fno-asynchronous-unwind-tables", "-D__DOS__=1", "-DPHYSICAL_TEXT_SCREEN=0xB8000UL", "-std=gnu99", "-Xclang", "-fdefault-calling-conv=regcall",
  "-fborland-extensions", "-fshort-wchar", "-mlong-double-64", "-include", "{root}/toolchain/clang/borland.h", "-fdeclspec", "-Wno-array-bounds", "-Wno-unknown-attributes", "-Wno-error=incompatible-function-pointer-types", "-Wno-ignored-attributes", "-include", "{root}/toolchain/clang/watcom.h", "-include", "{root}/toolchain/clang/floatm.h", "-nostdinc", "-isystem", "{root}/toolchain/clang/watcom", "-isystem", "{root}/toolchain/clang/os/x86-m16", "-isystem", "{ow}/bld/hdr/dos/h",
]
llc = ["-mregcall-default"]
object = "omf"
link = ["python3", "-I", "{root}/tools/wat_link.py", "m16", "{ow}", "{output}", "{objects}"]
run = ["python3", "-I", "{root}/tools/dosbatch/run_exe.py", "x86-m16"]

[x86_32-wat]
description = "x86-m32"
# Open Watcom libc: wchar_t 2, long double 8.
wchar_bytes = 2
long_double_bytes = 8
# The i8086 fork's clang: only it reads `#pragma aux NAME "LINK"`, which the runtime's symbols (B$COPY) need.
triple = "i486-unknown-linux-gnu"
datalayout = "{datalayout:x86-m32}"
clang_env = "LLRM_CLANG_M16"
clang = ["-target", "i486-unknown-linux-gnu", "-fhosted", "-fshort-wchar", "-mlong-double-64", "-fno-pic", "-fno-stack-protector",
  "-fno-asynchronous-unwind-tables", "-D__386__=1", "-D__DOS__=1", "-DPHYSICAL_TEXT_SCREEN=0xB8000UL", "-std=gnu99", "-Xclang", "-fdefault-calling-conv=regcall", "-fdeclspec", "-Wno-error=incompatible-function-pointer-types", "-Wno-unknown-attributes", "-Wno-ignored-attributes", "-include", "{root}/toolchain/clang/flat.h", "-include", "{root}/toolchain/clang/watcom.h", "-include", "{root}/toolchain/clang/floatm.h", "-nostdinc", "-isystem", "{root}/toolchain/clang/watcom", "-isystem", "{root}/toolchain/clang/os/x86-m32", "-isystem", "{ow}/bld/hdr/dos/h"]
llc = ["-fobject-format=omf", "-mabi=watcom", "-mregcall-default"]
object = "omf"
link = ["python3", "-I", "{root}/tools/wat_link.py", "m32", "{ow}", "{output}", "{objects}"]
run = ["python3", "-I", "{root}/tools/dosbatch/run_exe.py", "x86-m32"]
unroll_at_o1 = true
thread_jumps_at_o1 = true

# arm64 Linux on glibc, for qemu-aarch64: LLRM_ARM64_SYSROOT is the unpacked *-arm64-cross packages.
[arm64-glibc]
description = "arm64"
triple = "aarch64-unknown-linux-gnu"
datalayout = "e-m:e-p270:32:32-p271:32:32-p272:64:64-i8:8:32-i16:16:32-i64:64-i128:128-n32:64-S128-Fn32"
clang = ["-target", "aarch64-unknown-linux-gnu", "-nostdinc", "-isystem", "{env:LLRM_ARM64_SYSROOT}/usr/aarch64-linux-gnu/include"]
llc = []
llc_program = "llrm-arm64-llc"
llc_level = true
object = "elf"
link = ["{root}/tools/targets/arm64-glibc-link.sh", "{output}", "{objects}"]
run = ["qemu-aarch64"]

# arm64 macOS, on an Apple-silicon Mac only; headers from SDKROOT (`export SDKROOT=$(xcrun --show-sdk-path)`). Untested.
[arm64-macos]
description = "arm64"
long_double_bytes = 8
triple = "arm64-apple-macosx"
datalayout = "e-m:o-p270:32:32-p271:32:32-p272:64:64-i64:64-i128:128-n32:64-S128-Fn32"
clang = ["-target", "arm64-apple-macos"]
llc = []
llc_program = "llrm-arm64-llc"
llc_level = true
object = "macho"
link = ["clang", "-arch", "arm64", "-o", "{output}", "{objects}"]
run = []

# 32-bit Linux on the host's glibc (multilib), ELF32 objects linked by the system clang.
[x86_32-linux]
description = "x86-m32"
triple = "i486-unknown-linux-gnu"
datalayout = "{datalayout:x86-m32}"
clang = ["-target", "i486-unknown-linux-gnu", "-fno-pic", "-fno-stack-protector", "-fno-asynchronous-unwind-tables"]
llc = ["-fobject-format=elf", "-mabi=sysv"]
object = "elf"
link = ["clang", "-m32", "-no-pie", "-o", "{output}", "{objects}", "-lm"]
run = []
unroll_at_o1 = true
thread_jumps_at_o1 = true

# 6502 on sim65: clang's msp430 is only the C front end (16-bit int and pointers, as cc65; unsigned char, packed structs),
# its datalayout replaced by the 6502's. Stops at -S: ca65 text, which the tests assemble and link with cl65.
[6502-sim65]
description = "6502"
triple = "msp430"
datalayout = "{datalayout:6502}"
clang_datalayout = "e-m:e-p:16:16-i32:16-i64:16-f32:16-f64:16-a:8-n8:16-S16"
clang = ["-target", "msp430", "-funsigned-char", "-fpack-struct=1"]
llc = ["--platform=sim65", "--cpu=6502"]
llc_program = "llrm-6502-llc"
object = "ca65"
link = ["sh", "-c", "echo 'llrm-cc: the 6502 rows stop at -S' >&2; exit 1"]
unroll_at_o1 = true

# The same for a 65C02.
[65c02-sim65]
description = "6502"
triple = "msp430"
datalayout = "{datalayout:6502}"
clang_datalayout = "e-m:e-p:16:16-i32:16-i64:16-f32:16-f64:16-a:8-n8:16-S16"
clang = ["-target", "msp430", "-funsigned-char", "-fpack-struct=1"]
llc = ["--platform=sim65", "--cpu=65c02"]
llc_program = "llrm-6502-llc"
object = "ca65"
link = ["sh", "-c", "echo 'llrm-cc: the 6502 rows stop at -S' >&2; exit 1"]
unroll_at_o1 = true

# The 6502 rows for a program linked with cc65's sim6502 libraries and the runtime archive (tools/targets/6502-link.sh): every C symbol takes cc65's `_` (`sp` is `_sp`, `main` is the `_main`
# crt0 calls), so none meets a library symbol. The rows above keep bare names, which the runtime tests' hand glue names.
[6502-cc65]
description = "6502"
triple = "msp430"
datalayout = "{datalayout:6502}"
clang_datalayout = "e-m:e-p:16:16-i32:16-i64:16-f32:16-f64:16-a:8-n8:16-S16"
clang = ["-target", "msp430", "-funsigned-char", "-fpack-struct=1"]
llc = ["--platform=sim65-cc65", "--cpu=6502"]
llc_program = "llrm-6502-llc"
object = "ca65"
link = ["{root}/tools/targets/6502-link.sh", "6502", "{output}", "{objects}"]
unroll_at_o1 = true
whole_program = true

[65c02-cc65]
description = "6502"
triple = "msp430"
datalayout = "{datalayout:6502}"
clang_datalayout = "e-m:e-p:16:16-i32:16-i64:16-f32:16-f64:16-a:8-n8:16-S16"
clang = ["-target", "msp430", "-funsigned-char", "-fpack-struct=1"]
llc = ["--platform=sim65-cc65", "--cpu=65c02"]
llc_program = "llrm-6502-llc"
object = "ca65"
link = ["{root}/tools/targets/6502-link.sh", "65c02", "{output}", "{objects}"]
unroll_at_o1 = true
whole_program = true

# m68k Linux: -S is gas text, -c an ELF32 relocatable with .text and the data sections; no link line yet.
# The pin's clang gives the target a 64-bit long double (`[c]` of the description).
