# Z80, as far as sdasz80 text: clang's msp430 is only the C front end (16-bit int and pointers, as SDCC; unsigned char), its
# datalayout replaced by the Z80's. A row stops at -S, which the tests assemble and link with sdasz80 and sdldz80.
[z80-sdcc]
description = "z80"
triple = "msp430"
datalayout = "{datalayout:z80}"
clang_datalayout = "e-m:e-p:16:16-i32:16-i64:16-f32:16-f64:16-a:8-n8:16-S16"
clang = ["-target", "msp430", "-funsigned-char", "-fpack-struct=1"]
llc = []
llc_program = "llrm-z80-llc"
llc_passes = false
llc_passes_reason = "its argument parser takes no gcc pass switch; clang writes noinline into the IR"
object = "sdasz80"
link = ["sh", "-c", "echo 'llrm-cc: the z80 row stops at -S' >&2; exit 1"]

# WebAssembly, 32-bit linear memory, freestanding: the object for `wasm-ld`. The pinned clang is built for x86 only, so
# `LLRM_CLANG_WASM` names a clang with the WebAssembly target (clang 20 until the pin is built with it). The platform libc row (wasm32-wasi, a
# fetched sysroot) is planned in docs/working/wasm-libc-plan.md.
[wasm32]
description = "wasm"
description_file = "datalayout32.toml"
triple = "wasm32-unknown-unknown"
clang_env = "LLRM_CLANG_WASM"
datalayout = "e-m:e-p:32:32-p10:8:8-p20:8:8-i64:64-i128:128-n32:64-S128-ni:1:10:20"
clang = ["-target", "wasm32-unknown-unknown", "-ffreestanding"]
llc = ["-filetype=obj"]
llc_program = "llrm-wasm-llc"
llc_passes = false
llc_passes_reason = "clang writes noinline and the loop hints into the IR; the pipeline has no gcc pass names"
llc_level = true
object = "wasm"
link = ["wasm-ld", "--no-entry", "--allow-undefined", "{objects}", "-o", "{output}"]
