[workspace]
members = [".", "crates/*/*", "runtime/qb"]
default-members = [".", "crates/*/*", "runtime/qb"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.87"

[workspace.dependencies]
iced-x86 = { version = "=1.21.0", default-features = false, features = ["std", "decoder", "block_encoder", "op_code_info", "instr_info", "nasm", "no_vex", "no_evex", "no_xop", "no_d3now"] }
indexmap = "2"
# The compilers' allocator: glibc's malloc and free were a quarter of a compile's instructions.
mimalloc = { version = "0.1", default-features = false }
llrm-alloc = { path = "crates/support/llrm-alloc" }
llrm-env = { path = "crates/support/llrm-env" }
num-bigint = "0.4"
num-traits = "0.2"
rustc-hash = "2"
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3.27.0"
toml = { version = "0.9", features = ["preserve_order"] }
regex = "1"
llrm-support = { path = "crates/support/llrm-support" }
llrm-x86-m16 = { path = "crates/target/llrm-x86-m16" }
llrm-x86-m16-select = { path = "crates/target/llrm-x86-m16-select" }
llrm-target = { path = "crates/target/llrm-target" }
llrm-x86 = { path = "crates/target/llrm-x86" }
llrm-x86-m32 = { path = "crates/target/llrm-x86-m32" }
llrm-arm64 = { path = "crates/target/llrm-arm64" }
llrm-x86-m32-select = { path = "crates/target/llrm-x86-m32-select" }
llrm-x86-m64 = { path = "crates/target/llrm-x86-m64" }
llrm-x86-m64-select = { path = "crates/target/llrm-x86-m64-select" }
llrm-omf = { path = "crates/mc/llrm-omf" }
llrm-object = { path = "crates/mc/llrm-object" }
llrm-debug = { path = "crates/mc/llrm-debug" }
llrm-elf = { path = "crates/mc/llrm-elf" }
llrm-dwarf = { path = "crates/mc/llrm-dwarf" }
llrm-codeview = { path = "crates/mc/llrm-codeview" }
llrm-coff = { path = "crates/mc/llrm-coff" }
llrm-macho = { path = "crates/mc/llrm-macho" }
llrm-bcobj = { path = "crates/frontends/bcobj" }
llrm-bcdriver = { path = "crates/driver/llrm-bcdriver" }
llrm-hir = { path = "crates/ir/llrm-hir" }
llrm-mir = { path = "crates/ir/llrm-mir" }
llrm-lir = { path = "crates/ir/llrm-lir" }
llrm-analysis = { path = "crates/opt/llrm-analysis" }
llrm-transforms = { path = "crates/opt/llrm-transforms" }
llrm-codegen = { path = "crates/codegen/llrm-codegen" }
llrm-driver = { path = "crates/driver/llrm-driver" }
llrm-cc = { path = "crates/driver/llrm-cc" }
llrm-iselgen = { path = "crates/backend/llrm-iselgen" }
llrm-peepgen = { path = "crates/backend/llrm-peepgen" }
llrm-nib = { path = "crates/frontends/nib" }
llrm-qb = { path = "crates/frontends/qb" }
llrm-c = { path = "crates/frontends/llrm-c" }
llrm-qbruntime = { path = "runtime/qb" }

[package]
name = "llrm"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Low Level Real Machine: compiler suite for 16-bit real-mode DOS with GCC/LLVM-quality code generation"
default-run = "llrm-qb"

[dependencies]
llrm-alloc = { workspace = true }
llrm-codegen = { workspace = true }
llrm-mir = { workspace = true }
llrm-analysis = { workspace = true }
llrm-transforms = { workspace = true }
llrm-x86 = { workspace = true }
llrm-bcdriver = { workspace = true }
llrm-driver = { workspace = true }
llrm-nib = { workspace = true }
llrm-qb = { workspace = true }
llrm-c = { workspace = true, optional = true }
llrm-cc = { workspace = true }
serde_json = { workspace = true }
tempfile = { workspace = true }

[features]
default = ["toolchain"]
# What the build scripts bootstrap: Open Watcom's wccq (llrm-c), jwasm and jwlink, and DOSBox-X.
# The lib tests need only wccq.
toolchain = ["jw", "dosrun"]
# The Watcom-dialect llrm-c, kept until llrm-cc replaces it (C4): not built by default.
c-legacy = ["dep:llrm-c"]
wccq = ["c-legacy", "llrm-c/toolchain"]
jw = []
dosrun = []
system-alloc = []

[dev-dependencies]
llrm-target = { workspace = true }
llrm-x86-m16 = { workspace = true }
llrm-x86-m32 = { workspace = true }
llrm-object = { workspace = true }
llrm-debug = { workspace = true }
regex = { workspace = true }
toml = { workspace = true }

[[bin]]
name = "llrm-qb"
path = "src/bin/llrm-qb.rs"

[[bin]]
name = "llrm-c"
path = "src/bin/llrm-c.rs"
required-features = ["c-legacy"]

[[bin]]
name = "llrm-cc"
path = "src/bin/llrm-cc.rs"

[[bin]]
name = "llrm-llc"
path = "src/bin/llrm-llc.rs"

[[bin]]
name = "llrm-omf"
path = "src/bin/llrm-omf.rs"

[[bin]]
name = "llrm-nib"
path = "src/bin/llrm-nib.rs"

[[bin]]
name = "llrm-mir"
path = "src/bin/llrm-mir.rs"

[[bin]]
name = "llrm-pass"
path = "src/bin/llrm-pass.rs"

[[bin]]
name = "llrm-run"
path = "src/bin/llrm-run.rs"

[[bin]]
name = "nibfront"
path = "src/bin/nibfront.rs"

[[bin]]
name = "nib-lsp"
path = "src/bin/nib-lsp.rs"

# Release, bench and `test --release` inherit this; only a clean rebuilds all.
[profile.release]
incremental = true

# Debug builds and `cargo test` (the test profile inherits dev) keep line tables only: full DWARF made each target dir several times larger and /home was filling at
# 78 GB an hour. Backtraces still carry file:line; a debugger loses local variables there.
[profile.dev]
debug = "line-tables-only"

# The shipped llrm-c, the vs-gcc compile-time table and the creep run on main: one codegen unit and fat LTO (about 3 minutes from cold, against
# 7-60 s incremental). Compile instructions -11..-13% (d_faces, combat, cmd, mdl, nbody_single, queens, x_life, 2026-10-09); thin LTO with
# 16 units gets -6.5..-7.4% in ~40 s. Not for the PR gate, which compares two commits built the same way on `release`:
# the deltas of #1039, #1032 and #1029 agree in sign and size under release, thin and dist (docs/working/testing.md).
[profile.dist]
inherits = "release"
incremental = false
codegen-units = 1
lto = "fat"

# Iteration builds: `cargo test --profile fast`. More codegen units keep a
# one-line change from re-optimizing most of the crate.
[profile.fast]
inherits = "release"
codegen-units = 256
