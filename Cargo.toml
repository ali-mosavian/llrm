[workspace]
members = [".", "crates/*/llrm-*"]
default-members = [".", "crates/*/llrm-*"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.87"

[workspace.dependencies]
iced-x86 = { version = "=1.21.0", default-features = false, features = ["std", "decoder", "block_encoder", "op_code_info", "instr_info", "nasm", "no_vex", "no_evex", "no_xop", "no_d3now"] }
indexmap = "2"
# The compilers' allocator: glibc's malloc and free were a quarter of a compile's instructions.
mimalloc = { version = "0.1", default-features = false }
num-bigint = "0.4"
num-traits = "0.2"
rustc-hash = "2"
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3.27.0"
toml = { version = "0.9", features = ["preserve_order"] }
regex = "1"
llrm-support = { path = "crates/support/llrm-support" }
llrm-x86-m16 = { path = "crates/target/llrm-x86-m16" }
llrm-target = { path = "crates/target/llrm-target" }
llrm-x86 = { path = "crates/target/llrm-x86" }
llrm-x86-m32 = { path = "crates/target/llrm-x86-m32" }
llrm-omf = { path = "crates/target/llrm-omf" }
llrm-object = { path = "crates/target/llrm-object" }
llrm-elf = { path = "crates/target/llrm-elf" }
llrm-dwarf = { path = "crates/target/llrm-dwarf" }
llrm-coff = { path = "crates/target/llrm-coff" }
llrm-coff32 = { path = "crates/target/llrm-coff32" }
llrm-coff64 = { path = "crates/target/llrm-coff64" }
llrm-elf32 = { path = "crates/target/llrm-elf32" }
llrm-elf64 = { path = "crates/target/llrm-elf64" }
llrm-macho = { path = "crates/target/llrm-macho" }
llrm-x86-bcmachine = { path = "crates/target/llrm-x86-bcmachine" }
llrm-x86-bc = { path = "crates/target/llrm-x86-bc" }
llrm-bcdriver = { path = "crates/bc/llrm-bcdriver" }
llrm-hir = { path = "crates/ir/llrm-hir" }
llrm-mir = { path = "crates/ir/llrm-mir" }
llrm-lir = { path = "crates/ir/llrm-lir" }
llrm-analysis = { path = "crates/opt/llrm-analysis" }
llrm-transforms = { path = "crates/opt/llrm-transforms" }
llrm-core = { path = "crates/backend/llrm-core" }
llrm-driver = { path = "crates/backend/llrm-driver" }
llrm-peepgen = { path = "crates/backend/llrm-peepgen" }
llrm-nib = { path = "crates/frontends/llrm-nib" }
llrm-qb = { path = "crates/frontends/llrm-qb" }
llrm-c = { path = "crates/frontends/llrm-c" }
llrm-qbruntime = { path = "crates/frontends/llrm-qbruntime" }

[package]
name = "llrm"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Low Level Real Machine: compiler suite for 16-bit real-mode DOS with GCC/LLVM-quality code generation"
default-run = "llrm-qb"

[dependencies]
mimalloc = { workspace = true }
llrm-core = { workspace = true }
llrm-mir = { workspace = true }
llrm-bcdriver = { workspace = true }
llrm-nib = { workspace = true }
llrm-qb = { workspace = true }
llrm-c = { workspace = true }
serde_json = { workspace = true }
tempfile = { workspace = true }

[features]
default = ["toolchain"]
# What the build scripts bootstrap: Open Watcom's wccq (llrm-c), jwasm and jwlink, and DOSBox-X.
# The lib tests need only wccq.
toolchain = ["wccq", "jw", "dosrun"]
wccq = ["llrm-c/toolchain"]
jw = []
dosrun = []

[dev-dependencies]
llrm-target = { workspace = true }
llrm-x86 = { workspace = true }
llrm-x86-m16 = { workspace = true }
llrm-x86-m32 = { workspace = true }
llrm-driver = { workspace = true }
llrm-object = { workspace = true }
regex = { workspace = true }
toml = { workspace = true }

[[bin]]
name = "llrm-qb"
path = "src/bin/llrm-qb.rs"

[[bin]]
name = "llrm-c"
path = "src/bin/llrm-c.rs"

[[bin]]
name = "llrm-omf"
path = "src/bin/llrm-omf.rs"

[[bin]]
name = "llrm-nib"
path = "src/bin/llrm-nib.rs"

[[bin]]
name = "llrm-mir"
path = "src/bin/llrm-mir.rs"

[[bin]]
name = "llrm-run"
path = "src/bin/llrm-run.rs"

[[bin]]
name = "nibfront"
path = "src/bin/nibfront.rs"

[[bin]]
name = "nib-lsp"
path = "src/bin/nib-lsp.rs"

# Release, bench and `test --release` inherit this; only a clean rebuilds all.
[profile.release]
incremental = true

# The shipped llrm-c, the vs-gcc compile-time table and the creep run on main: one codegen unit and fat LTO (about 3 minutes from cold, against
# 7-60 s incremental). Compile instructions -11..-13% (d_faces, combat, cmd, mdl, nbody_single, queens, x_life, 2026-10-09); thin LTO with
# 16 units gets -6.5..-7.4% in ~40 s. Not for the PR gate, which compares two commits built the same way on `release`:
# the deltas of #1039, #1032 and #1029 agree in sign and size under release, thin and dist (docs/testing.md).
[profile.dist]
inherits = "release"
incremental = false
codegen-units = 1
lto = "fat"

# Iteration builds: `cargo test --profile fast`. More codegen units keep a
# one-line change from re-optimizing most of the crate.
[profile.fast]
inherits = "release"
codegen-units = 256
