[package]
name = "llrm"
version = "0.1.0"
edition = "2024"
rust-version = "1.87"
description = "LLVM-style optimizing compiler and object rewriter for 16-bit x86"
default-run = "llrm-qb"

[dependencies]
iced-x86 = { version = "=1.21.0", default-features = false, features = ["std", "decoder", "instr_info"] }
indexmap = "2"
num-bigint = "0.4"

[build-dependencies]
buildprs = { path = "tools/buildprs" }

[dev-dependencies]
buildprs = { path = "tools/buildprs" }

[[bin]]
name = "llrm-qb"
path = "src/bin/llrm-qb.rs"

[[bin]]
name = "llrm-c-old"
path = "src/bin/llrm-c-old.rs"

[[bin]]
name = "llrm-c"
path = "src/bin/llrm-c.rs"

[[bin]]
name = "llrm-omf"
path = "src/bin/llrm-omf.rs"

[[bin]]
name = "llrm-objdump"
path = "src/bin/llrm-objdump.rs"

[[bin]]
name = "llrm-opt"
path = "src/bin/llrm-opt.rs"

[[bin]]
name = "llrm-modern"
path = "src/bin/llrm-modern.rs"

[[bin]]
name = "qbfront"
path = "src/bin/qbfront.rs"

[[bin]]
name = "qbparse-stages"
path = "src/bin/qbparse_stages.rs"
