[package]
name = "llrm"
version = "0.1.0"
edition = "2024"
rust-version = "1.87"
description = "Low Level Real Machine: compiler suite for 16-bit real-mode DOS with GCC/LLVM-quality code generation"
default-run = "llrm-qb"

[dependencies]
iced-x86 = { version = "=1.21.0", default-features = false, features = ["std", "decoder", "block_encoder", "op_code_info", "instr_info", "nasm"] }
indexmap = "2"
num-bigint = "0.4"
num-traits = "0.2"
rustc-hash = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3.27.0"
toml = { version = "0.9", features = ["preserve_order"] }

[features]
default = ["toolchain"]
# Open Watcom's wccq, jwasm, jwlink and DOSBox-X, which build.rs bootstraps.
toolchain = []

[dev-dependencies]
regex = "1"

[[bin]]
name = "llrm-qb"
path = "src/bin/llrm-qb.rs"

[[bin]]
name = "llrm-c"
path = "src/bin/llrm-c.rs"

[[bin]]
name = "llrm-omf"
path = "src/bin/llrm-omf.rs"

[[bin]]
name = "llrm-nib"
path = "src/bin/llrm-nib.rs"

[[bin]]
name = "llrm-run"
path = "src/bin/llrm-run.rs"

[[bin]]
name = "nibfront"
path = "src/bin/nibfront.rs"

[[bin]]
name = "nib-lsp"
path = "src/bin/nib-lsp.rs"


# Release, bench and `test --release` inherit this; only a clean rebuilds all.
[profile.release]
incremental = true

# Iteration builds: `cargo test --profile fast`. More codegen units keep a
# one-line change from re-optimizing most of the crate.
[profile.fast]
inherits = "release"
codegen-units = 256
