[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "qbopt"
version = "0.1.0"
description = "A post-compilation pass over the .OBJ QuickBASIC's BC emits, between BC and LINK"
readme = "readme.md"
requires-python = ">=3.13"
authors = [{ name = "Ali Mosavian", email = "ali@42labs.ai" }]

[dependency-groups]
dev = [
    "pytest ~= 8.4",
    "ruff ~= 0.14",
    "isort ~= 6.1",
    "ty ~= 0.0.1a20",
    "pre-commit ~= 4.0",
    "iced-x86>=1.21.0",
    "pytest-xdist ~= 3.8",
]

[tool.hatch.build.targets.wheel]
packages = ["qbopt"]

[tool.ruff]
line-length = 120

[tool.ruff.format]
quote-style = "double"

[tool.ruff.lint]
select = ["E", "F", "W", "UP", "B", "SIM", "ANN"]

[tool.ruff.lint.per-file-ignores]
# vendored from the runtime pass and kept as it was, so the diff against the
# source stays readable; see the header in each file
"qbopt/cycles/*" = ["ALL"]
# measurement scripts, not the pass: they take MIR and module objects whose
# annotations would be noise here and are checked where they are defined
"tools/*" = ["ANN001", "ANN202"]
# mechanically imported qbasic-port corpus generators; keep their source
# layout recognizable while the typed wrapper in tools/qbgen owns validation
"tools/qbgen/qbasic_port/*" = ["B007", "E402", "E501"]
# declarative generated-case data is clearer one case per physical line
"tools/qbgen/families.py" = ["E501"]

[tool.isort]
skip_glob = ["qbopt/cycles/*"]
profile = "black"
line_length = 120
force_single_line = true
length_sort = true
length_sort_sections = ["FUTURE", "STDLIB", "THIRDPARTY", "FIRSTPARTY", "LOCALFOLDER"]
force_sort_within_sections = true
known_first_party = ["qbopt", "helpers", "corpus"]

[tool.ty.environment]
extra-paths = ["tools", "tests"]

[[tool.ty.overrides]]
include = ["qbopt/cycles/*", "qbopt/abi/runtime.toml"]

[tool.ty.overrides.rules]
unresolved-attribute = "ignore"
unresolved-import = "ignore"

[tool.ty.rules]
unresolved-import = "error"

[tool.pytest.ini_options]
# Tier 1 is deliberately too small for worker startup to pay for itself. The
# documented Tier 2 command adds four workers with work stealing: its durations
# are uneven, so the default up-front chunking scheduler mis-splits the corpus.
addopts = ["-ra", "--showlocals", "--strict-markers"]
testpaths = ["tests"]
pythonpath = ["tools", "tests"]
markers = [
    "fast: Tier 1 tests selected by default; hermetic or focused regressions",
    "full: Tier 2 exhaustive corpus or integration tests; selected with --full",
    "corpus: runs the rewriter over the committed .OBJ fixtures (no emulator)",
    "e2e: compiles, links and runs under DOSBox-X (needs the DOS toolchains)",
    "slow: measurement runs",
]
