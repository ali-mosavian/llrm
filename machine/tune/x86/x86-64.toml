# Reciprocal throughput, thousandths of a clock: MCSchedModel::getReciprocalThroughput
# (MCSchedule.cpp:114), the largest ReleaseAtCycle / NumUnits over a form's resources, from the
# pin's SandyBridgeModel (X86SchedSandyBridge.td at d1106deb71, X86.td:2264 `x86-64`); a form not
# listed here is priced at its clocks.
[recip]
alu_rr = 333  # WriteALU [SBPort015] X86SchedSandyBridge.td:127
alu_ri = 333  # WriteALU :127
alu_rm = 500  # WriteALU folded: SBPort23 :127
alu_mr = 1000  # WriteRMW [SBPort23,SBPort4] :108 (Port4: one unit)
cmov = 500  # WriteCMOV [SBPort05,SBPort015] :177
