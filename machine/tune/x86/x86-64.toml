mov_rr = 333  # WriteMove [SBPort015] :113
mov_ri = 333  # WriteMove :113
mov_rm = 500  # WriteLoad [SBPort23] :112
mov_mr = 1000  # WriteStore [SBPort23,SBPort4] :110 (Port4: one unit)
shift_ri = 500  # WriteShift [SBPort05] :169
shift_r1 = 500  # WriteShift :169
movzx = 333  # WriteALU :127
setcc = 500  # WriteSETCC [SBPort05] :179
cdq = 500  # SBWriteResGroup4 [SBPort05] :626
lea = 500  # WriteLEA [SBPort01] :196
imul_r32 = 1000  # WriteIMul32 [SBPort1,SBPort05,SBPort015] :135 (Port1: one unit)
imul_m32 = 1000  # WriteIMul32 folded :135
mul_r32 = 1000  # WriteIMul32 :135
idiv_r32 = 10000  # WriteIDiv32 [SBPort0,SBDivider] [1,10] :160 (divider: 10 cycles)
idiv_m32 = 10000  # WriteIDiv32 folded :160
push_r = 1000  # SBWriteResGroup33 [SBPort4,SBPort23] :767 (Port4: one unit)
push_i = 1000  # SBWriteResGroup33 :767
pop_r = 500  # SBWriteResGroup48 [SBPort23] :834
leave = 667  # SBWriteResGroup25_1 [SBPort23,SBPort015 x2] :717
