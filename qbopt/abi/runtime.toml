inc/stack.inc: `The basic frame is set up on entry to the main program, by B$ENSA/B$ENRA SUB and FUNCTION entry routines`, and it names what lands there -- the previous BASIC frame at FR_BFRAME, si and di at FR_SI/FR_DI `Preserved for C compatability`, the local byte count at FR_CLOCALS and a zeroed GOSUB count at FR_GOSUB. inc/rtmint.inc and inc/ulib.inc list it as an entry family with B$ENSA/B$ENRD/B$ENSD/B$ENFA; the code is in none of them. AGENTS.md measured the call site: the frame size arrives in cx, so nothing is on the stack to clean up. It moves both sp and bp, which is why it is in clobbers and why nothing may track stack depth across it.
'''

