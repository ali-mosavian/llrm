# What each QuickBASIC 4.5 runtime routine does, one row per routine.
#
# Data, not code: every field here is a claim about the runtime, and a
# claim wants an audit trail more than it wants a Python literal.
# `evidence` says where each came from -- the runtime source for the
# register and control facts, and `tools/runtime_writes.py` reading a
# linked image for what it writes.
#
# `established = false` means nothing here is known: the row concedes
# every register and every byte of memory, which is the only safe answer
# to a routine nobody has read.
#
# `cleanup = -1` is "not known", which is not the same as zero.

["B$?EVT"]
cleanup = 0
control = "returns"
enters_user_code = false
raises_error = false
error_handling = false
writes = "OWN"
reads = "NONE"
clobbers = ["ax", "bx", "cx", "ds", "dx", "flags"]
established = true
inputs = []
evidence = '''
rt/gwaevt.asm: `cProc B$?EVT,<FAR,PUBLIC>,<ES,SI,DI>`, no parameters. It clears b$TRPTBL to flag-zero/address--1 entries, zeroes b$TRAP_SEM, inits the b$TRAP_QUE descriptor through B$INITQ and calls [b$pInitKeys1] and [b$pInitKeys2] -- all runtime state, no user variable in sight, and it installs handlers rather than running one. Memory stays the worst case because those three callees were not followed. Emitted only under /V or /W, which the optimiser refuses anyway.
'''

