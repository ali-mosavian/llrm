rt/rtterm.asm: `cProc B$CENP,<PUBLIC,FAR,FORCEFRAME>`, no parameters, `Exceptions: Does not return.` -- the default end procedure, and the last call in any BASIC module. With an ON ERROR in progress it is `JMP FAR PTR B$ERR_NR`, handing a No RESUME error to the user's handler; otherwise it falls into termination. extent.py measured what follows one: in divmod-v-g3.obj the /X RESUME map begins exactly where its `call far B$CENP` ends, so the bytes after the call are data.
'''

