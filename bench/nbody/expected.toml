reason = "hoist prices a float load its reader folds as the reader's own memory form (and holds floats to the x87 stack's depth): a loop that read 16 hoisted-and-spilled matrix values now reads them as memory operands, as gcc does (d_faces, -O2 clocks vs gcc 1.17 -> 1.12). Here: nbody -Os instructions -6.5%, clocks -2.8%; nbody -O1/-O2 (QB) instructions +2.1% and memory operands +6.9% with clocks -1.4% and 20 B less code; fpbench/nbody_single -Os memory operands +32% (the folded loads), instructions -2.4%, clocks -1.6%, 8 B less code."
blessed = "2026-10-16"

