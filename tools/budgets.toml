# Budgets of tools/test_budgets.py: ratios of two sizes of one generated program, never an absolute floor.
#
# Every [[debt]] row is a budget above the default. It carries its issue and its owner, a measured ratio and the reason, and the
# file only shrinks: a row goes when its fix lands, and a row's ratio is never raised without a measured reason in the PR.

[default]
linear = 2.2            # an event count at 2N may be this times its count at N (a linear one reads 2, a quadratic one 4) ...
slack = 4               # ... plus this many, so a count of a few does not flip on one more
constant_slack = 2      # copies, selections and allocations of a one-function program do not grow by more than this
steps = 2.3             # a step's own work at 2N may be this times its work at N
onset_minstr = 0.5      # a step with less than this at N begins between the sizes: it has no slope to judge
floor_minstr = 5.0      # a step is read when its own work at 2N is this much, in millions of instructions (no share of the compile: that is a cliff)

