# Cause and owner of each m16 -Os grower, first match wins. A cause is a tag from the owners' ledger lists
# (ss: override, fixed-point divide, tree-ch, loop-idiom memcpy, LSR, x87 round/spills/compare, remat, closed-form,
# select setcc, urem magic, correctness-driven); a program with no entry is untriaged. Owners are the coordinator's sets.

[[program]]
match = "nbody_fixed/*"
cause = "fixed-point divide"
owner = "w-10"

[[program]]
match = "stft_fixed/*"
cause = "fixed-point divide"
owner = "w-10"

[[program]]
match = "qb/nbody.bas"
cause = "move-loop-invariants"
owner = "w-2"

[[program]]
match = "*/nbody.*"
cause = "BASIC SINGLE rounding at excess standard (SIZES_EXCESS=fast: 91 -> 70 B); the rest as fpbench"
owner = "w-13"
status = "cause known"
oracle = "none"

[[program]]
match = "*/stft_single.*"
cause = "integer movs (+15 on the pin's own IR at m32); x87 ops and fxch equal"
owner = "w-13"
status = "cause known"
oracle = "m32 llc"

[[program]]
match = "*/data_after_checked*"
cause = "correctness-driven: EXP overflow and LOG domain checks (B$SERR 6 and 5) that main did not emit, +24 insns in $QB$MAIN"
owner = "w-2"
status = "accept: behaviour change"
oracle = "none"

[[program]]
match = "*/log_exp*"
cause = "correctness-driven: the same EXP/LOG range checks (+21 insns in $QB$MAIN)"
owner = "w-2"
status = "accept: behaviour change"
oracle = "none"

[[program]]
match = "*/mandel*"
cause = "untriaged"
owner = "w-2"

[[program]]
match = "*/range_exp*"
cause = "untriaged"
owner = "w-2"

[[program]]
match = "*/pow_stack_depth*"
cause = "untriaged"
owner = "w-2"

[[program]]
match = "*/fpbench*"
cause = "BASIC SINGLE rounding at excess standard (set SIZES_EXCESS=fast on both: 126 -> 74 B); the rest is far-array selector spills and a second counter (RA/LSR), x87 ops equal"
owner = "w-13"
status = "cause known"
oracle = "none"

[[program]]
match = "*/memory.nib"
cause = "untriaged"
owner = "w-1"

[[program]]
match = "*/sieve*"
cause = "untriaged"
owner = "w-1"

[[program]]
match = "*/quicksort*"
cause = "untriaged"
owner = "w-1"

[[program]]
match = "*/udt*"
cause = "untriaged"
owner = "w-1"

[[program]]
match = "*/lcexit*"
cause = "tree-pre"
owner = "w-1"

[[program]]
match = "*/lru*"
cause = "relocatable-immediate store (w12) and RA; the stosb fill saves 5 B (disabled: 378 vs 373)"
owner = "w-12"
status = "cause known"
oracle = "none"

[[program]]
match = "*/matmul*"
cause = "untriaged"
owner = "w-13"

[[program]]
match = "*/jpeg*"
cause = "untriaged"
owner = "w-13"

# A pass whose removal shrinks a grower is its cause under --ablate (the flag name without -fno-); the owner of that pass.

