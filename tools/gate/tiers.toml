# The gate's tiers and the path map. `gate.py plan` shows what a diff selects; `gate.py run` runs it.
#
#   fast  every cheap step, plus each heavy step whose owner paths the diff touches.
#         Purpose: the confidence most PRs need. Budget: 5 minutes on the loaded host (a cold build of the formatter, ~40 s,
#         can be inside it once `fmt` is enforced; the host keeps the build between runs).
#   full  every step. Chosen when the diff touches [shared] or a path no rule knows. Budget: 10 minutes.
#         Also run over main after every 5 merges and nightly (`gate.py run --tier full`); red -> `gate.py bisect`.
#
# A step is cheap (runs in both tiers) unless a [[heavy]] below names it. A test file under tests/ or
# crates/*/*/tests/ that nobody lists is cheap, so a new test is never forgotten.
# A diff of only [inert] paths runs nothing. Changed paths in no table below are unknown: full.

# The compiler's source: a diff with none of it tests what it changed (the gate's own steps for those files) and not the compiler.
[compiler]
paths = ["crates/**", "src/**", "build.rs", "Cargo.toml", "Cargo.lock", "**/Cargo.toml", "rust-toolchain.toml", ".cargo/**"]

# Files the integration tests run or read without naming them in a test (the tools the build bootstraps, the requirement variables):
# a diff of only these still plans `integration`. tests/dwarf.rs reads WDUMP, the tool toolchain/wdump.sh builds.
[integration_inputs]
paths = ["toolchain/**", "tools/debug-gate.env"]

[inert]
paths = ["docs/**", "**/*.md", "editors/**", ".gitignore", ".github/**", ".zed/**"]

# Shared code every area runs through: the IR, the support library, target descriptions, the workspace. A change here
# takes the full tier. The backend (isel, regalloc, conventions, driver) and transforms are not listed: they take the
# fast tier plus every codegen step (run on all languages, qcport, pytest-programs; see [[heavy]]), which is everything
# the full tier adds except the debugger sessions and the identity gate. Move "crates/backend/**" and "crates/opt/**"
# here to send them to the full tier instead; the plan's `replay` cost is in docs/working/testing.md.
[shared]
paths = [
  "Cargo.toml", "Cargo.lock", "rust-toolchain.toml", "build.rs", "src/**", "tests/common/**",
  "crates/ir/**", "crates/support/**",
  "crates/target/llrm-target/**", "crates/mc/llrm-object/**",
  "tools/gate/**",
]

# The formatter (tools/fmt.sh): `fmt` checks the whole tree whenever a Rust file or the formatter itself changes.
# `enforced = true` fails the step on any file the formatter would change; false only lists them. It is false until
# the PR that formats the tree sets it to true: that one line is the switch.
[fmt]
enforced = true
paths = ["**/*.rs", "rustfmt.toml", "tools/fmt.sh", "tools/rfmt-post/**"]

# Paths outside [shared] the cheap steps cover on their own; they select no heavy step.
[plain]
paths = ["rustfmt.toml", "tests/**", "tools/**", "bench/**", "examples/**", "runtime/**", "toolchain/**", "crates/**"]

# Crates whose own tests read other crates' sources. A change to what they read runs them, though they depend on none of it.
[[reads]]
package = "llrm-mir"
why = "facts_rewrite lists every source file that reads an nsw/nuw/inbounds flag, and fails on one nobody audited"
paths = ["crates/**/*.rs"]

# Heavy steps (> 15 s on the loaded host): fast runs one only when a changed path matches its owners.
[[heavy]]
step = "turbo"
why = "Turbo Debugger session over a program: 48 s"
owners = ["crates/codegen/llrm-codegen/src/backend/debuginfo.rs", "crates/codegen/llrm-codegen/src/backend/frame.rs", "crates/codegen/llrm-codegen/src/backend/cfi*.rs", "tests/turbo.rs", "tests/common/**", "crates/mc/llrm-omf/**", "crates/mc/llrm-coff*/**", "crates/mc/llrm-dwarf/**", "toolchain/**", "tools/dosbatch/**", "tools/debug-gate.env"]

[[heavy]]
step = "cv4"
why = "Microsoft link + CodeView sessions: 30 s"
owners = ["crates/codegen/llrm-codegen/src/backend/debuginfo.rs", "crates/codegen/llrm-codegen/src/backend/frame.rs", "crates/codegen/llrm-codegen/src/backend/cfi*.rs", "tests/cv4.rs", "crates/mc/llrm-coff*/**", "crates/mc/llrm-omf/**", "toolchain/**", "tools/dosbatch/**", "tools/debug-gate.env"]

[[heavy]]
step = "identity"
why = "the identity gate rebuilds the compiler against itself: 96 s"
owners = ["tests/toolchain.rs", "tools/identity.sh", "tools/g-identical.sh", "tools/baseline.sh", "tools/llrmbin.py"]

[[heavy]]
step = "pytest-programs"
why = "compiles every program, and the loop cross-cases: 60 s"
owners = ["tests/test_programs_compile.py", "tests/test_loops.py", "tests/test_innerloops.py", "tools/sizes*", "tools/loops/**", "tools/innerloops.py", "examples/**", "bench/**", "tests/run/**", "crates/frontends/**", "crates/driver/llrm-cc/**", "crates/backend/**", "crates/codegen/**", "crates/driver/llrm-driver/**", "crates/opt/**"]

[[heavy]]
step = "dos-slow"
why = "NIBBLES and GORILLA played on dos32 against BCOM45, and the graphics sweeps: 5 to 8 minutes (tools/dosbatch/conftest.py's slow_dos tier)"
owners = ["runtime/qb/**", "runtime/shared/dos/**", "crates/frontends/qb/**", "crates/frontends/qb/**", "runtime/qb/**", "crates/ir/llrm-hir/src/mir*", "crates/codegen/llrm-codegen/src/driver/basic.rs", "tools/dosbatch/**", "toolchain/dosrunbuild.sh"]

[[heavy]]
step = "qcport"
why = "builds and runs QCport against the all-Borland build: 100 s"
owners = ["tools/qcport*", "tools/qcport/**", "tools/linkrecipe.py", "crates/frontends/llrm-c/**", "crates/driver/llrm-cc/**", "crates/target/llrm-x86-m32/**", "crates/mc/llrm-omf/**", "crates/target/llrm-x86/**", "crates/backend/**", "crates/opt/**", "runtime/**", "crates/codegen/**"]

[[heavy]]
step = "oracle-qcport"
why = "QCport's modules under every LLRM_CHECK_* oracle, then built and run against the Borland build: the C corpus the oracle sweep lacks"
owners = ["tools/oracle_qcport.py", "tools/oracle_sweep.py", "tools/oracle_expected.toml", "tools/qcport*", "tools/qcport/**", "crates/frontends/llrm-c/**", "crates/driver/llrm-cc/**", "crates/backend/**", "crates/opt/**", "crates/codegen/**"]

[[heavy]]
step = "rfmt-post"
why = "the formatter's own tests (cold build of its parser dependency: 40 s)"
owners = ["tools/rfmt-post/**", "tools/fmt.sh", "rustfmt.toml"]

[[heavy]]
step = "measure"
why = "compile cost (QCport and the 66 programs at -O1/-O2/-O3/-Os) and its growth with size (axes at N and 2N, and each step of the compile) against the merge-base's measurement in ~/.cache/llrm/measure: 3-8 minutes when the base is not measured yet"
owners = ["crates/backend/**", "crates/codegen/**", "crates/driver/llrm-driver/**", "crates/opt/**", "crates/frontends/llrm-c/**", "crates/driver/llrm-cc/**", "crates/target/llrm-x86-m32/**", "crates/target/llrm-x86/**", "tools/compile-cost.py", "tools/measure.py", "bench/**"]

# `run` always runs when code changed, on the languages the diff can affect (all, in a full tier).
[run_languages]
qb = ["crates/frontends/qb/**", "crates/frontends/qb/**", "runtime/qb/**", "tests/run/qb/**"]
c = ["crates/frontends/llrm-c/**", "crates/driver/llrm-cc/**", "tests/run/c/**"]
nib = ["crates/frontends/nib/**", "tests/run/nib/**"]
# Everything else (targets, examples, bench, tests/run/huge, tests/run/alias, run.rs) runs all languages.

# One slow test inside an otherwise cheap binary: split out, so the binary's other tests stay cheap.
[[split]]
step = "identity"
bin = "toolchain"
filter = "test_the_identity_gate_passes"

# Source scans: tests that read the tree's source text (a ratchet: no file may gain a pattern). They guard every crate whichever crate
# holds the test, so a diff to any source selects them in the fast tier, not only a diff to the crate that owns the test (#1057 and #1071
# skipped llrm-mir's dense-key ratchet and main's full run went red on it). A test that reads sources and is not listed here fails
# test_gate. `step = "integration"`: a root test binary the integration step runs on every code change anyway.
[scan_inputs]
paths = ["**/*.rs", "tools/**/*.py", "tools/**/*.sh", "crates/**/*.py", "crates/**/*.sh", "src/**/*.py", "src/**/*.sh", "crates/ir/llrm-mir/dense-keys.txt", "crates/ir/llrm-mir/slice-users.txt", "tests/target_facts.baseline"]

[[scan]]
file = "crates/ir/llrm-mir/src/tests.rs"
package = "llrm-mir"
lib = "no_file_gains_a_hash_or_tree_map_keyed_by_a_dense_id"

[[scan]]
file = "crates/ir/llrm-mir/src/tests.rs"
package = "llrm-mir"
lib = "no_file_gains_a_slice_read_of_a_use_list"

[[scan]]
file = "crates/support/llrm-support/tests/no_uncached_env_checks.rs"
package = "llrm-support"
test = "no_uncached_env_checks"

[[scan]]
file = "tests/seeded_maps.rs"
step = "integration"

[[scan]]
file = "tests/no_todo.rs"
step = "integration"

[[scan]]
file = "tests/target_facts.rs"
step = "integration"

[[scan]]
file = "tests/no_local_paths.rs"
step = "integration"

[[scan]]
file = "tests/no_kill_by_pattern.rs"
step = "integration"

[[scan]]
file = "tests/no_partial_ecx_counts.rs"
step = "integration"

[[scan]]
file = "tests/qb_dev_interface.rs"
step = "integration"

# Whole binaries that are heavy: every test in them is slow.
[whole]
cv4 = "cv4"
# The binary's five tests sleep-poll Turbo Debugger: 168 s of the integration step, which the turbo step (its owners: debug info) now runs.
turbo = "turbo"

# Binaries that change the working tree or run cargo on it (a probe file under crates/, a nested build): the run test
# compares the tree before and after, and cargo's lock serialises the rest. They run alone, after the other steps.
[exclusive]
build-script-reruns = "build_script_reruns"

# CI job groups (.github/workflows/ci.yml runs one job per group that has a step to run, in parallel, after the build).
# The smoke tier: one PR on origin/main, in about a minute. Its steps are the fast tier's, cut to these, plus `docs` (the generated pages
# and the pass pages are current) and `changed-tests` (the test files the diff touches or sits beside). `pytest-programs` (every program
# compiles) joins when the build does. A smoke PASS is never a merge licence: the train's full gate on the tip is.
[smoke]
steps = ["build", "lib", "crate-tests", "scans", "facts", "products", "fmt", "docs", "pytest-programs", "pytest-quick", "changed-tests"]
# The pytest step's files that took under 45 s of a loaded host (1.7 s of test_identical, 0.3 s of test_readme unloaded): smoke runs
# all but these, which are the minutes of it. A new slow file is added here, by the test that finds it over `slow_seconds`.
slow_pytest = [
    "crates/target/llrm-x86-m32/vsgcc/test_scaling_gate.py",
    "tools/dosbatch/test_qbrt.py",
    "tools/dosbatch/test_qb32.py",
    "tools/gate/test_gate.py",
    "tools/gate/test_prepush.py",
    "tools/dosbatch/test_qbgfxfill.py",
    "tools/bench/test_bench.py",
    "tools/dosbatch/test_qbgfxspeed.py",
    "crates/target/llrm-x86-m32/vsgcc/test_scaling.py",
    "tools/test_alloc_scaling.py",
    "tools/test_oracles.py",
    "tools/dosbatch/test_qb32cache.py",
    "tests/test_loops.py",
    "tools/dosbatch/test_qbentries.py",
    "crates/target/llrm-x86-m32/vsgcc/dfaces/test_dfaces.py",
    "tools/dosbatch/test_dosbatch.py",
]

# What tools/prepush.sh runs before a push: these gate steps (the smoke tier's commands, cut to the cheap ones that read the tree: the format check,
# the generated docs, the tracked build products, the source scans, target_facts) and these root test binaries beside them. A scan added to
# [[scan]] or a step added here is picked up; the script has no list of its own.
[prepush]
steps = ["fmt", "docs", "products", "scans", "facts"]
tests = ["docs_links"]
# Shell checks of the diff against origin/main (the tree as it stands, committed or not): a conflict marker or whitespace error that a merge left.
[prepush.checks]
"diff check" = "base=$(git merge-base HEAD origin/feat/parity 2>/dev/null || git merge-base HEAD origin/main) && git diff --check $base && ! git diff -U0 $base | grep -nE '^\\+(<<<<<<<|>>>>>>>)( |$)'"

# Every step the planner can produce is in exactly one group (a test checks).
[bench]
shards = 3

[oracle]
shards = 3

[groups]
unit = ["lib", "doc", "crate-tests", "scans", "rfmt-post", "facts", "identity"]
static = ["fmt", "docs", "products"]  # read the tree, build nothing: CI runs them first and alone, so a format error fails in minutes
integration = ["integration", "build-script-reruns"]
run = ["run"]
python = ["pytest", "pytest-programs", "pytest-quick", "changed-tests"]
perf = ["pytest-perf", "oracle-premise"]  # steps that read hardware counters: tinytim has them, a hosted VM has none
oracle = ["oracle-sweep"]  # CI runs it as `oracle-1` .. `oracle-N` ([oracle] shards): every LLRM_CHECK_* oracle over a slice of the BASIC and Nib programs
tools = ["torture"]
bench = ["bench"]  # CI runs it as `bench-1` .. `bench-N` ([bench] shards): one slice of the benchmarks each, judged together by bench.py --merge
reference = ["turbo", "cv4", "qcport", "oracle-qcport"]
dos = ["dos-slow"]
cost = ["measure"]

# Tools that are not in the repository and not free to fetch. A host without one has the capability missing:
# its [requires] steps are SKIPPED with the reason, and the LLRM_REQUIRE_* variables in `require` are unset so the
# tests in other steps that use it skip too (they print "SKIPPED: why"). A caller that sets one of them wants the
# tool required: nothing is skipped and a missing tool fails, as before. needs: env var (or default path) + a file in it.
[capability.turbo]
private = true
require = ["LLRM_REQUIRE_TURBO"]
needs = [
  { env = "TCPP30_DIR", default = "~/scratch/toolchains/tcpp30", marker = "bin/TCC.EXE" },
  { env = "TD_DIR", default = "~/scratch/toolchains/td", marker = "Td.exe" },
]

[capability.codeview]
private = true
require = ["LLRM_REQUIRE_CODEVIEW"]
needs = [
  { env = "VBDOS_DIR", default = "~/work/other/d32x/toolchains/vbdos", marker = "BIN/CV.EXE" },
  { env = "TCPP30_DIR", default = "~/scratch/toolchains/tcpp30", marker = "lib/C0M.OBJ" },
]

# Open Watcom's wdump reads the 16-bit DWARF images tests/dwarf.rs links; it is not built from this repository.
[capability.wdump]
require = ["LLRM_REQUIRE_WDUMP"]
needs = [{ env = "WDUMP", default = "~/dos/devtools/dev/c/watcom/binl/wdump", marker = "." }]

# The pinned clang and the m16 clang the llrm-cc tests drive, built by .github/workflows/toolchain.yml into trees named for their shas
# (toolchain/clangbuild.sh --print). Open source, so not private: CI builds and caches them, and a missing one is red there (only `perf` may
# be missing); a local run with GATE_ALLOW_MISSING=1 skips the steps that need them with this reason.
[capability.clang]
require = []
needs = [
  { run = 'cd "$(git rev-parse --show-toplevel)" && test -x "$(sh toolchain/clangbuild.sh --print pin)/bin/clang"' },
  { run = 'cd "$(git rev-parse --show-toplevel)" && test -x "$(sh toolchain/clangbuild.sh --print m16)/bin/clang"' },
]

[capability.qcport]
private = true
require = []
needs = [
  { env = "QCPORT", default = "~/scratch/qcport/src", marker = "." },
  { env = "QCPORT_BORLAND", default = "~/scratch/qcbcc", marker = "." },
]

# The private repository CI reads (never cached, uploaded or printed) and where each tool variable points in its checkout; a group's own table
# replaces a variable for its jobs (QCPORT is QCport's src; dfaces reads the qb-quake variant from DFACES_SRC).
# `private = true` capabilities are the ones only that checkout has: a group needing one is a private group, and a fork's pull request,
# which cannot read the checkout, fails it by name. `rm-quake` is the public QCport, cloned beside the private files.
[private]
repo = "ali-mosavian/llrm-private-tools"
public = { rm-quake = "ali-mosavian/rm-quake" }
env = { TCPP30_DIR = "tcpp30", TD_DIR = "td", VBDOS_DIR = "vbdos", PDS71_DIR = "pds71", QB45_DIR = "qb45", QB45_DEMOS_DIR = "gor", QCPORT_BORLAND = "qcbcc", QCPORT_INC = "qctc/inc", QCPORT_BCC_LIB = "bcpp31/lib", LLRM_BORLAND_INC = "bcinc", LLRM_BORLAND_LIB = "bcpp31/lib", TOOLCHAINS = ".", TURBO = "." }
group_env = { reference = { QCPORT = "rm-quake/src" }, cost = { QCPORT = "rm-quake/src" }, python = { QCPORT = "rm-quake/src", DFACES_SRC = "qbq-llrm/src" } }

# What each item needs, one table. A key is a step (`turbo`), a `run` language (`lang:qb`), a cheap test binary (`bin:differential`).
# A step is skipped whole; a language or binary is left out of the step that runs it, and the step is skipped if no language is left.
# A Python test file declares its own need, not here: `REQUIRES = ["perf"]` at module level.
[requires]
integration = ["clang"]  # the llrm-cc tests (tests/common/cc.rs) drive the pinned and m16 clang
turbo = ["turbo"]
cv4 = ["codeview"]
qcport = ["qcport"]
oracle-qcport = ["qcport"]
dos-slow = ["qb45", "qb45demos"]
pytest-perf = ["perf"]
oracle-premise = ["perf"]
measure = ["perf", "qcport"]  # callgrind counts (capability `counter`) but takes over an hour a run on a hosted runner: measure waits for its shards and a cached base (#1844). qcport: its rows are QCport's modules; without them measure would judge the programs alone
bench = ["qb45"]
"lang:qb" = ["qb45"]
"bin:differential" = ["qb45"]

# Microsoft QuickBASIC 4.5's LINK and BC: the qb programs link with them, and the BC differential and the bench's BASIC rows run them.
[capability.qb45]
private = true
require = []
needs = [{ env = "QB45_DIR", default = "~/work/42-labs/mini-qb/dosbox/qb45", marker = "LINK.EXE" }]


# Microsoft's NIBBLES.BAS and GORILLA.BAS, which the repository does not hold: the dos32 demo tests play them.
[capability.qb45demos]
private = true
require = []
needs = [{ env = "QB45_DEMOS_DIR", default = "~/scratch/gor", marker = "NIBBLES.BAS" }]

# Something that counts instructions: hardware counters (`perf stat`), or valgrind's callgrind where there are none (crates/target/llrm-x86-m32/
# vsgcc/levels_time.py `counted`). The measure step runs on either; the step costs it judges need the compiler's own counter, perf.
[capability.counter]
require = []
needs = [{ run = "perf stat -x, -e instructions:u true 2>&1 | grep -Eq '^[0-9]+,' || command -v valgrind >/dev/null" }]

# Hardware instruction counters (`perf stat`): a VM often has none.
[capability.perf]
require = []
# perf exits 0 and prints "<not supported>" where there is no counter: the probe reads the count.
needs = [{ run = "perf stat -x, -e instructions:u true 2>&1 | grep -Eq '^[0-9]+,'" }]

# Tolerances of tools/measure.py, which compares a branch's compile cost and growth with its merge-base's. A rise past one fails; a
# drop is not recorded anywhere, the next branch's base has it. Set from the same build measured twice (2026-10-08): geomean within
# 0.0001 and the worst file 0.0047 of 393; axis ratios within 0.0014; a step's own count within 2.7% (242 steps, 3 runs).
[measure]
geomean = 1.003      # per level, over QCport's files or the programs
worst = 1.02         # one file
excess = 0.01        # an axis' superlinear work (the second difference c(2N) - 3c(N) + 2c(N/2)) may rise by this much of the base's cost at 2N
fall = 0.001        # an axis whose cost at 2N fell by more than this of the base's is not failed for a rise of its second difference (the axes spread 0.0009)
step_excess = 0.005  # a step's, of the compile's cost at 2N; the same build measured 3 times spreads D by 0.0005 of it (axes 0.0009 of theirs, 2026-10-09), so 10x above noise
pass_slack = 1.05    # a step's cost at 2N
linear = 2.1         # where the base read no such step: what gcc's passes reach
step_rise = 1.5      # a step's cost at 2N may not rise by more than this, whatever its share of the compile ...
step_floor = 20.0    # ... when it rose by this many Minstr too (a small step's count moves with run order, not growth)
high = 0.025         # a step needs this share of the compile's work to fail (the scaling_gate reads steps down to 1.5%)

# Rows the user accepted a rise on, each at a ceiling equal to what the decision measured: a row above its ceiling fails as ever.
# A row names a prefix (`nest O1` is also its steps); the limits it gives replace the general ones for it. Tighten as the follow-up lands.

# A row with `branch` is a decision for that PR alone (tools/measure.py drops it for any other head and lays its limits over the
# first matching row, the higher standing). T-1, https://github.com/ali-mosavian/llrm/issues/2295: the scalar GVN (#2179) costs +1.0% of
# a compile and gvn's own cost is x1.1 to x1.6 of the base's while the old forwarding and pricing machinery still runs beside it
# (a constant factor: gvn at 512, 1024, 2048, 4096 statements of `straight` O1 is x1.414, x1.414, x1.413, x1.410 of the base's).
# Exit, the same for each of the four: stages 4-6 of docs/architecture/gvn-port.md delete spill_forecast, loadjoins, motion_price and
# joined and Gvn::run reaches <= 25,680 instructions per IR instruction per run; the four are deleted in that PR.
[[measure.accepted]]
row = "qcport -Os"
branch = "alim/feat/gvn-scalar-pr"
geomean = 1.0145
why = "T-1: qcport geomean at -Os."

[[measure.accepted]]
suffix = "mir gvn"
branch = "alim/feat/gvn-scalar-pr"
pass_slack = 1.65
step_rise = 1.6
why = "T-1: gvn's own cost at 2N against the base's, on every axis and level (widest read: cells O1 x1.626, straight O1 x1.583)."

[[measure.accepted]]
row = "straight Os"
branch = "alim/feat/gvn-scalar-pr"
worst = 1.0225
why = "T-1: the whole compile at 2N=1024 of the straight axis (read x1.0220)."

[[measure.accepted]]
row = "callers Os analysis call-effects"
branch = "alim/feat/gvn-scalar-pr"
pass_slack = 1.15
why = "T-1: call-effects at 2N (read x1.133), asked more often by the scalar pass's callers."

[[measure.accepted]]
row = "callers-m16 Os analysis call-effects"
branch = "alim/feat/gvn-scalar-pr"
pass_slack = 1.15
why = "T-1: call-effects at 2N (read x1.132)."

[[measure.accepted]]
row = "fjoins O1 analysis through-memory"
step_rise = 2.0
why = "Time-limited (#1915, removal tracked in #1983): the passes that follow what is known read ThroughMemory for the body as it stands (#1909), derived once per body version instead of kept as sound, which doubles the solves; each solve is the walker's pre-existing cost (the memory-SSA structure built per solve, nearest_writes ~52 K per load). Measured x1.90 against the limit 1.5. Remove when the walker's per-load cost falls (R2)."

[[measure.accepted]]
row = "fjoins O2 analysis through-memory"
step_rise = 2.0
why = "Time-limited (#1915, removal tracked in #1983): the passes that follow what is known read ThroughMemory for the body as it stands (#1909), derived once per body version instead of kept as sound, which doubles the solves; each solve is the walker's pre-existing cost (the memory-SSA structure built per solve, nearest_writes ~52 K per load). Measured x1.90 against the limit 1.5. Remove when the walker's per-load cost falls (R2)."

[[measure.accepted]]
row = "fjoins Os analysis through-memory"
step_rise = 2.0
why = "Time-limited (#1915, removal tracked in #1983): the passes that follow what is known read ThroughMemory for the body as it stands (#1909), derived once per body version instead of kept as sound, which doubles the solves; each solve is the walker's pre-existing cost (the memory-SSA structure built per solve, nearest_writes ~52 K per load). Measured x1.90 against the limit 1.5. Remove when the walker's per-load cost falls (R2)."

[[measure.accepted]]
