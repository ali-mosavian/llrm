reason = "PR #2210 (@noipa, #2196): the six Nib kernels the compiler evaluated at -O3 are opaque to the interprocedural passes, so the same measurement as the C and BASIC rows (a call the compiler cannot see through): matmul no longer specialised on its seed 0 (+2.8% instructions), crc +3 code bytes, and the four parity kernels call their inner function instead of folding it (+3..+11 instructions, +6..+25 code bytes). At -O3 the rows were 'not in the map' (the call was evaluated at compile time); they are measured now. Clocks are not gated."

