reason = "@noipa on the six Nib bench kernels (#2196): the kernel is opaque to the interprocedural passes, so the compiler no longer specialises it on its caller's constants (matmul's seed 0) or reads its body from main. The same measurement as the C and BASIC rows (volatile pointer): the general kernel. +2 or +3 code bytes each (the entry a standalone procedure keeps), matmul +174/+177 instructions and +79/+60 bytes. At -O3 the six rows were 'not in the map' (the call was evaluated at compile time) and are measured now."

