# What llrm refuses by design, by the text of the refusal (a regular expression on the cause the runner prints). Each entry says
# why; a refusal no entry matches is a finding, never skipped.

[[refused]]
match = "^wccq: Unable to open"
reason = "a header the runner's tools/torture/include does not provide (stdio, stdarg, setjmp, signal, math, ctype, ...): the program needs a libc facility the runner has none of"

[[refused]]
match = "^wccq: (Expecting|Missing|Expression must be constant|Expression has void type|Type required in parameter list|An id list not allowed|Dimension cannot be|Initializer list cannot be empty|Cannot perform operation with pointer to void|Type mismatch|Symbol '_' has not been declared)"
reason = "Open Watcom's C front end (wccq) does not parse the program: GNU C or C99 syntax it lacks (statement expressions, typeof, __attribute__, labels as values, designated and empty initializers, zero-length arrays, K&R forms, implicit declarations of builtins)"

[[refused]]
match = "^undefined symbol __builtin_(alloca|return_address|frame_address|classify_type|constant_p|prefetch|expect|va_|bswap|clz|ctz|popcount|ffs|parity|setjmp|longjmp|unreachable|huge_val|inf|nan|isnan)"
reason = "a GCC builtin the front end calls as an external of that name and the runner does not implement"

[[refused]]
match = "^undefined symbol (sprintf|printf|snprintf|puts|putchar|fprintf|isprint|isalpha|isdigit|isspace|toupper|tolower|qsort|bsearch|atoi|strtol|getenv|rand|srand|time|clock|signal|raise|setjmp|longjmp|strstr|strncat|strpbrk|strspn|strcspn|strdup|memchr|strcasecmp)"
reason = "a libc routine tools/torture/libc.c does not implement"

# Programs that run and exit non-zero by design (a wrong result of one is reported as `differs`, with its reason, at any level).

[[differs]]
program = "pr32244-1"
reason = "GNU C does arithmetic on a bit-field in the field's own precision (an `unsigned long long : 40` shifts and rotates in 40 bits: GCC PR middle-end/32244, expr.c ChangeLog 2008-01-25; implement-c.texi, 'Structures, Unions, Enumerations, and Bit-Fields'). ISO C11 6.3.1.1p2 leaves a bit-field wider than int in its declared type (64 bits), so `x.b << 32` is not 0: llrm, on Open Watcom's front end, follows ISO."

[[differs]]
program = "pr34971"
reason = "The same: GNU C's bit-field precision (GCC PR middle-end/34971, expr.c ChangeLog 2008-02-27) against ISO C11 6.3.1.1p2, which llrm follows."
