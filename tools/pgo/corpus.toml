# What the instrumented compiler compiles to make the profile: the paths a compile takes in real use. A program measured against the profile
# must be left out (`pgo.py ... --exclude lru bintree`), or the gain is the training set's.
levels = ["-O1", "-O2", "-Os"]

[bench]
globs = ["bench/*/*.c", "bench/parity/*/*.c"]

# Programs llrm-cc cannot build yet (c-run-tests-llrm-cc-2026-10-28.md): left out of the training of llrm-llc. Each is a gap to close, then remove here.
[llrm-cc]
unbuilt = ["es_across_copy", "idioms", "stackdeep", "stackover", "memcpy_runtime", "memfuncs_runtime", "overflow_builtins", "tail_calls_edges"]
