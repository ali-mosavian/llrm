name: tblgen-tree
description: The pin's llvm-tblgen and source (toolchain/tblgenbuild.sh) that the DAG tables' staleness test regenerates from, restored from the cache or built, and saved under the ref that runs this.
runs:
  using: composite
  steps:
    - id: tree
      shell: bash
      run: |
        dir=$(sh toolchain/tblgenbuild.sh --print)
        echo "dir=$dir" >> "$GITHUB_OUTPUT"
        echo "name=$(basename "$dir")" >> "$GITHUB_OUTPUT"
    - id: restore
      uses: actions/cache/restore@v4
      with:
        path: ${{ steps.tree.outputs.dir }}
        key: llrm-${{ steps.tree.outputs.name }}
    - name: build
      if: steps.restore.outputs.cache-hit != 'true'
      shell: bash
      run: |
        sudo apt-get update -qq
        sudo apt-get install -y -qq ninja-build cmake lld
        sh toolchain/tblgenbuild.sh
    # Saved here, as in clang-tree: a cancelled job's post step saves nothing.
    - if: steps.restore.outputs.cache-hit != 'true'
      uses: actions/cache/save@v4
      with:
        path: ${{ steps.tree.outputs.dir }}
        key: llrm-${{ steps.tree.outputs.name }}
    - shell: bash
      run: ${{ steps.tree.outputs.dir }}/build/bin/llvm-tblgen --version | head -3
