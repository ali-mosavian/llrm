# The tiered gate (tools/gate/gate.py), on every pull request and on main. Not a required check: merges never wait for it.
#
#   plan    gate.py plan --json: the tier from the diff, the job groups it needs, the steps skipped here.
#   build   cargo build + test binaries once; the target dir is handed to the groups as an artifact.
#   gate    one job per group (tiers.toml [groups]), in parallel; wall time is the longest group.
#   ci      one status for the run.
# The tools that are not in this repository (Turbo C++, CodeView, QB 4.5, PDS, BCC, QCport's Borland build) are in a private
# repository (tools/gate/tiers.toml [private]), read with a read-only deploy key (secret LLRM_PRIVATE_KEY) by the jobs of the groups
# that need them, into the runner's temp directory: never cached, uploaded as an artifact (those groups' logs are not) or printed.
# A pull request from a fork cannot read the secret: its private groups fail, named. Only `perf` may be missing, and only on a hosted
# runner (no counters on a VM: `measure` and the scaling tests are not run there); any other capability missing is a red job, not a skip.
#
# Runners: only the groups that need hardware perf counters (tools/ci/pick_runners.py PERF: perf, cost) prefer tinytim, six ephemeral rootless-podman runners
# (tools/ci/selfhosted, docs/working/ci.md). `plan` reads the repository variable TINYTIM_HEARTBEAT ("epoch idle", written each minute by
# the supervisor): missing, older than 3 minutes or zero idle means every job runs on ubuntu-24.04. Only main and this repository's own pull requests get tinytim.
#
# Caches (all restored by .github/actions/setup; each key is what invalidates it):
#   llrm-forks   ~/.cache/llrm: JWasm, JWlink, DOSBox-X, the Open Watcom tree, the gcc torture corpus. Key: hash of the
#                scripts that pin them. A changed pin falls back to the newest older cache (restore-keys) and
#                toolchain/cache.sh builds only the tree whose commit is new; trees no pin names are pruned.
#   target       the workspace build, saved on main pushes. Key: Cargo.lock + rust-toolchain.toml + commit; a run restores
#                the newest of its lock. tools/ci/restore_mtime.py gives files their commit times (and files changed since
#                the cached commit "now"), so cargo rebuilds only what changed.
#   rust-cache   cargo registry (Swatinem, no target). Key: Cargo.lock.
#   uv           tools/uv.lock.
name: ci

on:
  pull_request:
    # A draft runs plan and static only (minutes); marking it ready starts the full gate.
    # Parity work targets the integration branch feat/parity and a stack targets its parent's branch: only a pull request into main runs the gate.
    branches: [main]
    types: [labeled]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_TARGET_DIR: ${{ github.workspace }}/target
  CARGO_INCREMENTAL: "0"
  GATE_ALLOW_MISSING: perf

jobs:
  # The gate runs in CI and only to merge into main: a push runs nothing, a pull request runs nothing until the merge loop labels ONE of them
  # `merge-candidate` (any other label starts nothing; a push after the label needs the label put on again), and that run is the FULL gate. Its verdict line,
  # `GATE <tier> CANDIDATE PASS at <head12> on <main12>`, names the head that merges (tools/ci/candidate_ok.py judges it). docs/working/ci.md.
  plan:
    if: ${{ github.event_name != 'pull_request' || github.event.label.name == 'merge-candidate' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      base: ${{ steps.plan.outputs.base }}
      groups: ${{ steps.plan.outputs.groups }}
      static: ${{ steps.plan.outputs.static }}
      compiler: ${{ steps.plan.outputs.compiler }}
      setup_changed: ${{ steps.plan.outputs.setup_changed }}
      parent: ${{ steps.stale.outputs.parent }}
      workflow: ${{ steps.stale.outputs.workflow }}
      perf_hosted: ${{ steps.runners.outputs.perf_hosted }}
      groups_run: ${{ steps.runners.outputs.groups_run }}
      runner_small: ${{ steps.runners.outputs.small }}
      draft: ${{ steps.draft.outputs.draft }}
      any: ${{ steps.plan.outputs.any }}
      private: ${{ steps.plan.outputs.private }}
      tier: ${{ steps.plan.outputs.tier }}
      runner_build: ${{ steps.runners.outputs.build }}
      runner_groups: ${{ steps.runners.outputs.groups }}
      runner_summary: ${{ steps.runners.outputs.summary }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # A pull request runs the workflow of its merge commit: when its parent lacks the last change main made to .github/, tools/gate/ or
      # tools/ci/ (or its base is not main) the run judges by old rules and is not a pass (tools/ci/stale_workflow.py).
      - id: stale
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          read parent workflow < <(python3 tools/ci/stale_workflow.py)
          echo "parent=$parent" >> "$GITHUB_OUTPUT"
          echo "workflow=$workflow" >> "$GITHUB_OUTPUT"
      # Whether the pull request is a draft NOW, from the API: the event's payload is the state when it was sent, and a ready_for_review run
      # cancelled by a draft one that was queued after it left the PR with a "draft" verdict and no gate (#1918).
      - id: draft
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          PAYLOAD: ${{ github.event.pull_request.draft }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          now=$(python3 tools/ci/pr_state.py "$GITHUB_REPOSITORY" "$PR" "$PAYLOAD")
          echo "draft=$now" >> "$GITHUB_OUTPUT"
      - id: plan
        run: |
          # A pull request is checked out as its merge with the base: the first parent is the base's tip.
          if [ "${{ github.event_name }}" = pull_request ]; then base=HEAD^1; elif [ "${{ github.ref }}" = refs/heads/main ]; then base=${{ github.event.before }}; else base=origin/main; fi
          # The planner is a hosted VM with no perf counters; the perf jobs run where there are some, and each job checks for itself.
          export GATE_PLAN_ASSUME=perf
          json=$(python3 tools/gate/gate.py plan --json --base "$base")
          echo "$json"
          echo "base=$base" >> "$GITHUB_OUTPUT"
          echo "groups=$(echo "$json" | python3 -c 'import json,sys; print(json.dumps(sorted(g for g in json.load(sys.stdin)["groups"] if g != "static")))')" >> "$GITHUB_OUTPUT"
          echo "static=$(echo "$json" | python3 -c 'import json,sys; print(str("static" in json.load(sys.stdin)["groups"]).lower())')" >> "$GITHUB_OUTPUT"
          echo "private=$(echo "$json" | python3 -c 'import json,sys; print(json.dumps(json.load(sys.stdin)["private"]))')" >> "$GITHUB_OUTPUT"
          echo "any=$(echo "$json" | python3 -c 'import json,sys; print(str(bool(json.load(sys.stdin)["steps"])).lower())')" >> "$GITHUB_OUTPUT"
          echo "tier=$(echo "$json" | python3 -c 'import json,sys; print(json.load(sys.stdin)["tier"])')" >> "$GITHUB_OUTPUT"
          # The set-up action is every job's first step on both kinds of runner: a change to it is run on tinytim too (job setup-check).
          if [ "${{ github.event_name }}" = pull_request ] && git diff --name-only HEAD^1 HEAD | grep -qE '^(\.github/actions/setup/|tools/ci/ensure_nightly)'; then echo "setup_changed=true" >> "$GITHUB_OUTPUT"; fi
          echo "compiler=$(echo "$json" | python3 -c 'import json,sys; print(str(json.load(sys.stdin)["compiler"]).lower())')" >> "$GITHUB_OUTPUT"
          python3 tools/gate/gate.py plan --base "$base" | tee -a "$GITHUB_STEP_SUMMARY"
      # tinytim when its heartbeat is fresh and a runner idle, else hosted (tools/ci/pick_runners.py). A fork's pull request is always hosted.
      - id: runners
        env:
          HEARTBEAT: ${{ vars.TINYTIM_HEARTBEAT }}
          # Only main and this repository's own pull requests: a fork's pull request, a push to another branch and a manual run elsewhere are hosted.
          ELIGIBLE: ${{ (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository) || github.ref == 'refs/heads/main' }}
          GROUPS_JSON: ${{ steps.plan.outputs.groups }}
          GH_TOKEN: ${{ github.token }}
          # The perf and cost jobs judge a pull request; a push to main runs neither (each merge queued a pair on six runners: 16 of 20 waiting jobs).
          COMPILER: ${{ github.event_name == 'pull_request' && steps.plan.outputs.compiler || 'false' }}
        run: |
          # The hosted jobs waiting for a runner now: a new job queues behind them.
          backlog=$(python3 tools/ci/hosted_backlog.py)
          json=$(python3 tools/ci/pick_runners.py "$GROUPS_JSON" "${HEARTBEAT:-}" "$ELIGIBLE" "$backlog" "$COMPILER")
          echo "$json"
          echo "build=$(echo "$json" | python3 -c 'import json,sys; print(json.dumps(json.load(sys.stdin)["build"]))')" >> "$GITHUB_OUTPUT"
          echo "groups=$(echo "$json" | python3 -c 'import json,sys; print(json.dumps(json.load(sys.stdin)["groups"]))')" >> "$GITHUB_OUTPUT"
          echo "small=$(echo "$json" | python3 -c 'import json,sys; print(json.dumps(json.load(sys.stdin)["small"]))')" >> "$GITHUB_OUTPUT"
          echo "groups_run=$(echo "$json" | python3 -c 'import json,sys; print(json.dumps(json.load(sys.stdin)["run"]))')" >> "$GITHUB_OUTPUT"
          echo "perf_hosted=$(echo "$json" | python3 -c 'import json,sys; print(" ".join(json.load(sys.stdin)["perf_hosted"]))')" >> "$GITHUB_OUTPUT"
          summary=$(echo "$json" | python3 -c 'import json,sys; print(json.load(sys.stdin)["summary"])')
          echo "summary=$summary" >> "$GITHUB_OUTPUT"
          echo "Runners: $summary" >> "$GITHUB_STEP_SUMMARY"

  # The checks that read the tree and build nothing (tiers.toml [groups] static: format, generated docs, tracked products) run alone before
  # the build: a mistake in them fails in minutes and the long jobs never start. What fails there hides the later jobs' failures until it is fixed.
  # The set-up step on a tinytim runner, where the image's own toolchains make it differ from a hosted one (#1987): only when the action changed.
  setup-check:
    needs: plan
    if: needs.plan.outputs.setup_changed == 'true' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, tinytim]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: rustup toolchain list && rustfmt +nightly --version

  static:
    needs: plan
    if: needs.plan.outputs.static == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup
      - run: JOBS=$(nproc) python3 tools/gate/gate.py run --group static --base "${{ needs.plan.outputs.base }}"

  build:
    needs: [plan, static]
    if: ${{ !cancelled() && needs.plan.outputs.draft != 'true' && needs.plan.outputs.any == 'true' && needs.static.result != 'failure' }}
    runs-on: ${{ fromJSON(needs.plan.outputs.runner_build) }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup
        with:
          save: "true"
      # tinytim has perf (the sysctl and a seccomp profile allowing perf_event_open): nothing may be missing there.
      - if: runner.environment == 'self-hosted'
        run: echo "GATE_ALLOW_MISSING=" >> "$GITHUB_ENV"
      # The workspace's own outputs, from the last main build: cargo rebuilds only what changed since (restore_mtime.py).
      - id: target
        uses: actions/cache/restore@v4
        with:
          path: target
          key: target-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}-${{ github.sha }}
          restore-keys: target-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}-
      - run: python3 tools/ci/restore_mtime.py . "$(cat target/.built-from 2>/dev/null || true)"
      - name: Build
        run: |
          before=$(find ~/.cache/llrm -name .complete -printf '%p %T@\n' 2>/dev/null | sort || true)
          JOBS=$(nproc) python3 tools/gate/gate.py run --group build --base "${{ needs.plan.outputs.base }}"
          after=$(find ~/.cache/llrm -name .complete -printf '%p %T@\n' | sort)
          # A cache hit builds nothing: every .complete is the one the cache restored.
          if [ "$before" = "$after" ]; then echo "forks: none built (cache hit)"; else diff <(echo "$before") <(echo "$after") | sed 's/^/forks built: /' || true; fi
          git rev-parse HEAD > target/.built-from
      - name: Share the target dir
        run: tar -C "$GITHUB_WORKSPACE" -cf - target | zstd -T0 -3 -o "$RUNNER_TEMP/target.tar.zst"; ls -l "$RUNNER_TEMP/target.tar.zst"
      - if: github.event_name == 'push'
        uses: actions/cache/save@v4
        with:
          path: target
          key: target-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}-${{ github.sha }}
      - uses: actions/upload-artifact@v4
        with:
          name: target
          path: ${{ runner.temp }}/target.tar.zst
          compression-level: 0
          retention-days: 1

  # The clang trees the llrm-cc tests drive (toolchain/clangbuild.sh), restored or built here and saved under THIS run's ref: a pull request
  # into main cannot read the caches toolchain.yml saves on feat/parity (run 40780286803). Runs beside build; cold, a tree is ~1 h (cached after).
  toolchain:
    needs: plan
    if: ${{ !cancelled() && needs.plan.outputs.draft != 'true' && needs.plan.outputs.any == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        kind: [pin, m16]
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/clang-tree
        with:
          kind: ${{ matrix.kind }}

  # The pin's llvm-tblgen and source (toolchain/tblgenbuild.sh), which the unit group's table-staleness test regenerates from. Beside toolchain,
  # not in it: the clang trees' cache keys stay as they are. Cold 1-2 min, ~420 MB cached.
  tblgen:
    needs: plan
    if: ${{ !cancelled() && needs.plan.outputs.draft != 'true' && needs.plan.outputs.any == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/tblgen-tree

  gate:
    needs: [plan, build, toolchain, tblgen]
    # A skipped ancestor (static, when nothing it checks changed) would skip this job too: success() looks at every job upstream.
    if: ${{ !cancelled() && needs.build.result == 'success' && needs.toolchain.result == 'success' && needs.tblgen.result == 'success' }}
    runs-on: ${{ fromJSON(needs.plan.outputs.runner_groups)[matrix.group] }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        group: ${{ fromJSON(needs.plan.outputs.groups_run) }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup
        with:
          clang: "required"
          tblgen: ${{ matrix.group == 'unit' && 'required' || '' }}
      # tinytim has perf (the sysctl and a seccomp profile allowing perf_event_open): nothing may be missing there.
      - if: runner.environment == 'self-hosted'
        run: echo "GATE_ALLOW_MISSING=" >> "$GITHUB_ENV"
      - id: private
        run: echo "needed=${{ contains(fromJSON(needs.plan.outputs.private), matrix.group) }}" >> "$GITHUB_OUTPUT"
      # A fork's pull request cannot read the secret.
      - name: Private tools, unreadable from a fork
        if: steps.private.outputs.needed == 'true' && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository
        run: |
          echo "::error::group ${{ matrix.group }} needs the private tools (Turbo C++, CodeView, QB 4.5, QCport's Borland build ...), which a pull request from a fork cannot read: open the pull request from a branch of ${{ github.repository }}"
          exit 1
      - name: Private tools
        if: steps.private.outputs.needed == 'true' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        env:
          KEY: ${{ secrets.LLRM_PRIVATE_KEY }}
        run: |
          set -eu +x
          [ -n "$KEY" ] || { echo "::error::the secret LLRM_PRIVATE_KEY is not set"; exit 1; }
          dir="$RUNNER_TEMP/private"
          install -m 600 /dev/null "$RUNNER_TEMP/key"
          printf '%s\n' "$KEY" > "$RUNNER_TEMP/key"
          GIT_SSH_COMMAND="ssh -i $RUNNER_TEMP/key -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new" \
            git clone -q --depth 1 "git@github.com:$(python3 tools/gate/gate.py private-repo).git" "$dir"
          shred -u "$RUNNER_TEMP/key" 2>/dev/null || rm -f "$RUNNER_TEMP/key"
          rm -rf "$dir/.git"
          for pair in $(python3 tools/gate/gate.py private-public); do git clone -q --depth 1 "https://github.com/${pair#*=}.git" "$dir/${pair%%=*}"; done
          python3 tools/gate/gate.py private-env "$dir" --group "${{ matrix.group }}" >> "$GITHUB_ENV"
      - uses: actions/download-artifact@v4
        with:
          name: target
          path: ${{ runner.temp }}
      - name: Restore the target dir
        run: |
          zstd -dc -T0 "$RUNNER_TEMP/target.tar.zst" | tar -C "$GITHUB_WORKSPACE" -xf -
          # The build job made this target dir from this commit: no file is newer than it.
          python3 tools/ci/restore_mtime.py . "$(cat target/.built-from)"
      # The bench step judges the compiler's rows against the base's counts (tools/bench/readme.md). Building and measuring the base took 20 of
      # the group's 22 minutes: a push to main records its own counts under the key of what they depend on (basecounts.compiler_key: the
      # tree but docs and editor files), and a pull request restores its base's, the merge ref's first parent.
      - id: basecounts
        if: startsWith(matrix.group, 'bench-')
        run: |
          echo "LLRM_BENCH_BASE_DIR=$RUNNER_TEMP/bench-base" >> "$GITHUB_ENV"
          echo "base=bench-base-$(python3 tools/bench/basecounts.py key HEAD^1 2>/dev/null || echo none)" >> "$GITHUB_OUTPUT"
          echo "head=bench-base-$(python3 tools/bench/basecounts.py key HEAD)" >> "$GITHUB_OUTPUT"
      - if: startsWith(matrix.group, 'bench-')
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/bench-base
          key: ${{ steps.basecounts.outputs.base }}
      - run: JOBS=$(nproc) python3 tools/gate/gate.py run --group ${{ matrix.group }} --base "${{ needs.plan.outputs.base }}"
      # A shard's rows, counts and names only (nothing a private tool printed): bench-merge judges what no shard can alone.
      - if: always() && startsWith(matrix.group, 'bench-')
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.group }}
          path: target/bench-shards
          if-no-files-found: ignore
          retention-days: 1
      # A private group's logs stay in its job log (the failing excerpt): its tools' output is not uploaded.
      - if: always() && steps.private.outputs.needed != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: logs-${{ matrix.group }}
          path: target/gate-logs
          retention-days: 3

  # The verdict no shard has alone (standing against the references, waivers nothing needed) and, on a main push, the head's counts kept
  # as the base of the next pull requests: saved here, as soon as the shards are in, not at the end of a job that also measured the base.
  bench-merge:
    needs: [plan, build, gate]
    if: always() && needs.build.result == 'success' && contains(needs.plan.outputs.groups, '"bench-1"')
    runs-on: ${{ fromJSON(needs.plan.outputs.runner_small || '"ubuntu-24.04"') }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup
      - uses: actions/download-artifact@v4
        with:
          name: target
          path: ${{ runner.temp }}
      - name: Restore the target dir
        run: |
          zstd -dc -T0 "$RUNNER_TEMP/target.tar.zst" | tar -C "$GITHUB_WORKSPACE" -xf -
          python3 tools/ci/restore_mtime.py . "$(cat target/.built-from)"
      - uses: actions/download-artifact@v4
        with:
          pattern: bench-*
          path: ${{ runner.temp }}/shards
          merge-multiple: true
      - id: basecounts
        run: |
          echo "LLRM_BENCH_BASE_DIR=$RUNNER_TEMP/bench-base" >> "$GITHUB_ENV"
          echo "head=bench-base-$(python3 tools/bench/basecounts.py key HEAD)" >> "$GITHUB_OUTPUT"
      # The counts are saved when they were recorded, whatever the verdict: a regression or a failed later job must not leave the tree with no
      # base (every pull request on it would measure the base itself and time out). merge records only when all the shards are in.
      - id: merge
        run: |
          rc=0
          uv run -q --project tools python tools/bench/bench.py --merge "$RUNNER_TEMP/shards" "$(python3 tools/gate/gate.py shards)" ${{ github.event_name == 'push' && '--record' || '' }} || rc=$?
          ls "$LLRM_BENCH_BASE_DIR"/*-own.json >/dev/null 2>&1 && echo "recorded=true" >> "$GITHUB_OUTPUT"
          exit $rc
      - if: always() && github.event_name == 'push' && steps.merge.outputs.recorded == 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/bench-base
          key: ${{ steps.basecounts.outputs.head }}

  ci:
    needs: [plan, static, toolchain, tblgen, build, gate, bench-merge, setup-check]
    if: ${{ always() && (github.event_name != 'pull_request' || github.event.label.name == 'merge-candidate') }}
    runs-on: ${{ fromJSON(needs.plan.outputs.runner_small || '"ubuntu-24.04"') }}
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      # The line `gate.py run` prints, naming the head the run is of (a pull request's head, not the merge commit CI checks out).
      - run: |
          head="${{ github.event.pull_request.head.sha || github.sha }}"
          echo "plan=${{ needs.plan.result }} setup-check=${{ needs.setup-check.result }} static=${{ needs.static.result }} build=${{ needs.build.result }} gate=${{ needs.gate.result }} bench-merge=${{ needs.bench-merge.result }}"
          if [ "${{ needs.plan.outputs.draft }}" = true ] && [ "${{ needs.plan.result }}" = success ] && [ "${{ needs.static.result }}" != failure ]; then
            # The verdict was taken at plan time: a pull request marked ready since has had no gate, and a draft line is not its answer.
            now=$(python3 -c 'import json,os,urllib.request as u; r=u.Request("https://api.github.com/repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}", headers={"Authorization":"Bearer "+os.environ["GH_TOKEN"]}); print(str(json.load(u.urlopen(r))["draft"]).lower())' || echo unknown)
            if [ "$now" = false ]; then
              line="GATE ${{ needs.plan.outputs.tier }} DRAFT RUN OF A READY PR (not a pass) at ${head:0:12}: it was marked ready while this run was going; push or re-run for the gate"
              echo "$line" | tee -a "$GITHUB_STEP_SUMMARY"
              exit 1
            fi
            line="GATE ${{ needs.plan.outputs.tier }} DRAFT at ${head:0:12}: static=${{ needs.static.result }}, the gate runs when it is ready for review (not a pass)"
            echo "$line  [runners: ${{ needs.plan.outputs.runner_summary }}]" | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          # The counter tests judge the compiler: a pull request that changes its source is not a pass while they ran on a runner with none.
          on=""
          if [ "${{ github.event_name }}" = pull_request ]; then on=" on ${{ needs.plan.outputs.parent }}"; fi
          if [ "${{ github.event_name }}" = pull_request ] && [ "${{ needs.plan.outputs.workflow }}" != fresh ]; then
            line="GATE ${{ needs.plan.outputs.tier }} STALE WORKFLOW (not a pass) at ${head:0:12}$on: ${{ needs.plan.outputs.workflow }}; merge main into the branch (a stacked pull request runs its base's workflow)"
            echo "$line  [runners: ${{ needs.plan.outputs.runner_summary }}]" | tee -a "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          if [ "${{ github.event_name }}" = pull_request ] && [ "${{ needs.plan.outputs.compiler }}" = true ] && [ -n "${{ needs.plan.outputs.perf_hosted }}" ] && [ "${{ needs.gate.result }}" = success ]; then
            line="GATE ${{ needs.plan.outputs.tier }} PERF SKIPPED at ${head:0:12}: ${{ needs.plan.outputs.perf_hosted }} ran hosted (no counters); re-run when tinytim is idle"
            echo "$line  [runners: ${{ needs.plan.outputs.runner_summary }}]" | tee -a "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          if [ "${{ needs.plan.result }}" = success ] && [ "${{ needs.setup-check.result }}" != failure ] && [ "${{ needs.static.result }}" != failure ] && [ "${{ needs.build.result }}" != failure ] && [ "${{ needs.toolchain.result }}" != failure ] && [ "${{ needs.toolchain.result }}" != cancelled ] && [ "${{ needs.tblgen.result }}" != failure ] && [ "${{ needs.tblgen.result }}" != cancelled ] && [ "${{ needs.gate.result }}" != failure ] && [ "${{ needs.gate.result }}" != cancelled ] && [ "${{ needs.bench-merge.result }}" != failure ] && [ "${{ needs.bench-merge.result }}" != cancelled ]; then
            line="GATE ${{ needs.plan.outputs.tier }} PASS at ${head:0:12}$on"
            # A pull request's run is the merge candidate's, the full gate: its line says so.
            if [ "${{ github.event_name }}" = pull_request ]; then
              line="GATE ${{ needs.plan.outputs.tier }} CANDIDATE PASS at ${head:0:12}$on"
            fi
          else
            line="GATE ${{ needs.plan.outputs.tier }} FAIL at ${head:0:12}: plan=${{ needs.plan.result }} static=${{ needs.static.result }} build=${{ needs.build.result }} gate=${{ needs.gate.result }} bench-merge=${{ needs.bench-merge.result }}"
          fi
          echo "$line  [runners: ${{ needs.plan.outputs.runner_summary }}]" | tee -a "$GITHUB_STEP_SUMMARY"
          case "$line" in *" PASS at "*) ;; *) exit 1;; esac
