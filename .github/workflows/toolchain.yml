# The clang trees the llrm-cc tests need, built once per sha and cached (toolchain/clangbuild.sh): `pin` (LLRM_PIN_CLANG) and `m16`
# (LLRM_CLANG_M16). One job per tree: a tree is ~5.8 CPU-hours, about 3 h on 4 hosted vCPUs (an ESTIMATE, from the m16 tree's
# .ninja_log; not yet measured on a runner), so both in one job would meet the 6 h limit. The setup action restores them; a missing one is red.
name: toolchain
on:
  workflow_dispatch:
  push:
    branches: [feat/parity, main]
    paths: [toolchain/clang/pin, toolchain/clangbuild.sh, toolchain/cache.sh, .github/workflows/toolchain.yml]
jobs:
  clang:
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    strategy:
      fail-fast: false
      matrix:
        kind: [pin, m16]
    steps:
      - uses: actions/checkout@v4
      - id: tree
        run: |
          dir=$(sh toolchain/clangbuild.sh --print ${{ matrix.kind }})
          echo "dir=$dir" >> "$GITHUB_OUTPUT"
          echo "name=$(basename "$dir")" >> "$GITHUB_OUTPUT"
      - id: restore
        uses: actions/cache@v4
        with:
          path: ${{ steps.tree.outputs.dir }}
          key: llrm-${{ steps.tree.outputs.name }}
      - name: ccache (the second tree shares most objects with the first)
        uses: actions/cache@v4
        with:
          path: ~/.cache/ccache
          key: ccache-clang-${{ matrix.kind }}-${{ github.sha }}
          restore-keys: ccache-clang-
      - name: build
        if: steps.restore.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ninja-build cmake ccache lld
          sh toolchain/clangbuild.sh ${{ matrix.kind }}
      - run: ${{ steps.tree.outputs.dir }}/bin/clang --version
      # The same tree as an artifact: a pull request into main cannot read this branch's cache (toolchain/clangfetch.sh).
      - run: tar -C "${{ steps.tree.outputs.dir }}" -cf - . | zstd -T0 -3 -o "$RUNNER_TEMP/tree.tar.zst"
      - uses: actions/upload-artifact@v4
        with:
          name: llrm-${{ steps.tree.outputs.name }}
          path: ${{ runner.temp }}/tree.tar.zst
          compression-level: 0
          retention-days: 90
