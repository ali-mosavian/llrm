# The documentation site (tools/docsbuild), on every change that can alter it.
#
#   build   passdocs gap check, build.py --check (figures, links, constructs), the site as a Pages artifact.
#   deploy  main only, and only when the repository variable DOCS_PAGES is 'true' (Settings, Pages: source GitHub Actions).
#           Otherwise the run summary says why it was skipped; nothing fails.
name: docs

on:
  pull_request:
    paths:
      - "docs/**"
      - "**/*.md"
      - "tools/docsbuild/**"
      - "tools/passdocs.py"
      - "crates/**"
      - ".github/workflows/docs.yml"
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "**/*.md"
      - "tools/docsbuild/**"
      - "tools/passdocs.py"
      - "crates/**"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

concurrency:
  group: docs-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/passdocs.py --check --require crates/opt/llrm-analysis/src
      - run: python3 tools/docsbuild/build.py --check
      - run: python3 tools/docsbuild/build.py --out site
        env:
          GITHUB_SHA: ${{ github.sha }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
          retention-days: 14
      - if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.DOCS_PAGES != 'true'
        run: |
          echo "deploy skipped: repository variable DOCS_PAGES is not 'true'" >> "$GITHUB_STEP_SUMMARY"

  deploy:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.DOCS_PAGES == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
