# Builds nib-lsp for the Zed extension, which downloads it from the release
# tagged nib-lsp-v<extension version>. Main builds it (no release) only when a path in its closure changed:
# the list is generated, `python3 tools/ci/nib_lsp_paths.py --write`, and a test checks it.
name: nib-lsp release

on:
  push:
    tags: ["nib-lsp-v*"]
    branches: [main]
    paths:
      - "Cargo.toml"
      - "build.rs"
      - "crates/backend/llrm-dagisel/**"
      - "crates/backend/llrm-iselgen/**"
      - "crates/backend/llrm-peepgen/**"
      - "crates/codegen/llrm-codegen/**"
      - "crates/driver/llrm-bcdriver/**"
      - "crates/driver/llrm-cc/**"
      - "crates/driver/llrm-driver/**"
      - "crates/frontends/bcobj/**"
      - "crates/frontends/nib/**"
      - "crates/frontends/qb/**"
      - "crates/ir/llrm-hir/**"
      - "crates/ir/llrm-lir/**"
      - "crates/ir/llrm-mir/**"
      - "crates/mc/llrm-codeview/**"
      - "crates/mc/llrm-coff/**"
      - "crates/mc/llrm-dwarf/**"
      - "crates/mc/llrm-elf/**"
      - "crates/mc/llrm-macho/**"
      - "crates/mc/llrm-object/**"
      - "crates/mc/llrm-omf/**"
      - "crates/opt/llrm-analysis/**"
      - "crates/opt/llrm-transforms/**"
      - "crates/support/llrm-alloc/**"
      - "crates/support/llrm-env/**"
      - "crates/support/llrm-support/**"
      - "crates/target/llrm-arm64/**"
      - "crates/target/llrm-target/**"
      - "crates/target/llrm-x86-m16-select/**"
      - "crates/target/llrm-x86-m16/**"
      - "crates/target/llrm-x86-m32-select/**"
      - "crates/target/llrm-x86-m32/**"
      - "crates/target/llrm-x86-m64-select/**"
      - "crates/target/llrm-x86-m64/**"
      - "crates/target/llrm-x86/**"
      - "runtime/qb/**"
      - "src/**"
      - "!src/bin/**"
      - "src/bin/nib-lsp.rs"

permissions:
  contents: write

jobs:
  release:
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - run: gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --notes "nib-lsp for the Nib Zed extension."
        env:
          GH_TOKEN: ${{ github.token }}

  build:
    needs: release
    if: ${{ !failure() && !cancelled() }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: x86_64-unknown-linux-gnu, os: ubuntu-22.04 }
          - { target: aarch64-unknown-linux-gnu, os: ubuntu-22.04-arm }
          - { target: aarch64-apple-darwin, os: macos-14 }
          - { target: x86_64-apple-darwin, os: macos-14 }
          - { target: x86_64-pc-windows-msvc, os: windows-latest }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - run: rustup target add ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - run: cargo build --release --locked --no-default-features --bin nib-lsp --target ${{ matrix.target }}
      - name: Upload
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd target/${{ matrix.target }}/release
          if [ "$RUNNER_OS" = Windows ]; then
            asset=nib-lsp-${{ matrix.target }}.zip
            7z a "$asset" nib-lsp.exe
          else
            asset=nib-lsp-${{ matrix.target }}.tar.gz
            tar czf "$asset" nib-lsp
          fi
          gh release upload "$GITHUB_REF_NAME" "$asset" --repo "$GITHUB_REPOSITORY"
