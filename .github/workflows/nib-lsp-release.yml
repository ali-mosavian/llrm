# Builds nib-lsp for the Zed extension, which downloads it from the release
# tagged nib-lsp-v<extension version>.
name: nib-lsp release

on:
  push:
    tags: ["nib-lsp-v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - run: gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --notes "nib-lsp for the Nib Zed extension."
        env:
          GH_TOKEN: ${{ github.token }}

  build:
    needs: release
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: x86_64-unknown-linux-gnu, os: ubuntu-22.04 }
          - { target: aarch64-unknown-linux-gnu, os: ubuntu-22.04-arm }
          - { target: aarch64-apple-darwin, os: macos-14 }
          - { target: x86_64-apple-darwin, os: macos-14 }
          - { target: x86_64-pc-windows-msvc, os: windows-latest }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - run: rustup target add ${{ matrix.target }}
      - run: cargo build --release --locked --no-default-features --bin nib-lsp --target ${{ matrix.target }}
      - name: Upload
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd target/${{ matrix.target }}/release
          if [ "$RUNNER_OS" = Windows ]; then
            asset=nib-lsp-${{ matrix.target }}.zip
            7z a "$asset" nib-lsp.exe
          else
            asset=nib-lsp-${{ matrix.target }}.tar.gz
            tar czf "$asset" nib-lsp
          fi
          gh release upload "$GITHUB_REF_NAME" "$asset" --repo "$GITHUB_REPOSITORY"
