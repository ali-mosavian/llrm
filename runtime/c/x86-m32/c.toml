# C's runtime on flat DOS under DOS/32A: what the language asks of the target's OS layer
# (runtime/shared/dos/m32). Each field naming a file names one in this directory.

# Library routines this runtime has (ext.asm, under the names its ABI gives them: `memcpy_` in registers, `_memcpy` for sysv), which the
# compiler may call for what it does not move inline: `memcpy` for a copy of a variable length, over 128 bytes or of unaligned pointers
# (the pin's EmitTargetCodeForMemcpy). Absent, those are `rep movs`. `memmove` and `memset` are named for the passes that will call them.
# The QB runtime's flat C sources (fin.c, varptr.c) are compiled with this table and link without ext.asm: they get the routines from
# runtime/qb/dos/m32/memfuncs.asm, which includes the one copy ext.asm does (qbrt was 183/218 with this on and no copy there, 2026-10-23).
libcalls = ["memcpy", "memmove", "memset"]

# What `-fsanitize=stack` compares and calls.
stack = "stack.toml"
# The stack the OS layer's start-up reserves.
# 128 KiB: at about 40 B a level, the 16 KiB it was held ~400 levels and 1500 of recursion kept at -O1 (bench recmany) faulted in the
# extender (exception 0Dh). The extender takes the stack from extended memory, not from the 640 KiB, so it costs no DOS memory.
stack_base = 131072
# Fields the assembler is told as `-DSYMBOL=value`; the OS layer's own come from its description.
assembler_defines = ["stack_base:STACK_BYTES"]
