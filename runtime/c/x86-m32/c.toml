# C's runtime on flat DOS under DOS/32A: what the language asks of the target's OS layer
# (runtime/shared/dos/m32). Each field naming a file names one in this directory.

# What `-fsanitize=stack` compares and calls.
stack = "stack.toml"
# The stack the OS layer's start-up reserves.
stack_base = 16384
# Fields the assembler is told as `-DSYMBOL=value`; the OS layer's own come from its description.
assembler_defines = ["stack_base:STACK_BYTES"]

# How Open Watcom's front end is asked to record a C program for this target (llrm-c).
[frontend]
watcom_cpu = "386"
# What the front end calls `int`, in bytes: the C ABI's, which the data layout does not state.
int_bytes = 4
# The convention whose contract a call to a routine that states none has (`calling.toml`): the stack one, whose
# clobbers a caller must assume. An unmarked function is in registers (no -ecc) and states its own at each call.
convention = "cdecl32"
# The same switches but the model, packing and Borland's headers. Its C ABI is Open Watcom's 386
# flat one (`calling.toml`): structs laid out at -zp4, an unmarked function in registers.
flags = ["-3", "-fpi87", "-fp3", "-j", "-zp4", "-ei", "-s", "-zl", "-zq"]
# The header it includes first, from the repository root.
header = "crates/frontends/llrm-c/src/flat.h"
