# C's runtime on real-mode DOS: what the language asks of the target's OS layer
# (runtime/shared/dos/m16). Each field naming a file names one in this directory.

# What `-fsanitize=stack` compares and calls.
stack = "stack.toml"
# The stack the OS layer's start-up reserves.
stack_base = 16384
# The start-up hook the layer calls before `main`, and the file that defines it.
init = "_llrm_c_init"
init_file = "init.asm"
# Fields the assembler is told as `-DSYMBOL=value`; the OS layer's own come from its description.
assembler_defines = ["stack_base:STACK_BYTES", "init:LANG_INIT"]

# How Open Watcom's front end is asked to record a C program for this target (llrm-c).
[frontend]
# Which of its trees: i86 (16-bit) or 386 (flat 32-bit). The build makes one front end for each
# CPU the targets name.
watcom_cpu = "i86"
# What the front end calls `int`, in bytes: the C ABI's, which the data layout does not state.
int_bytes = 2
# The calling convention the front end compiles C under (`calling.toml`): -ecc is Borland's cdecl.
convention = "cdecl16"
# The routine the start-up calls, and the convention it calls it in.
entry = "main"
entry_convention = "cdecl16"
# Borland's medium model: far code, near data, cdecl, signed char, 80-bit long double,
# byte-packed structs, 16-bit enums, x87 inline, no stack probes, no default library. -fp3 is for
# inline assembly: qcport's own uses 387 instructions. Borland's ABI is the only one here: wccq
# also lays bit fields out as BCC 3.1 does, with no switch.
flags = ["-mm", "-3", "-fpi87", "-fp3", "-fld", "-j", "-zp1", "-ei", "-ecc", "-s", "-zl", "-zq"]
# The header it includes first, from the repository root.
header = "crates/frontends/llrm-c/src/borland.h"
# Borland C's interrupt handler parameters, in order: the registers its handler saved, each at its slot of the frame
# (`calling.toml`'s `interrupt_frame`); what it writes to them is what it returns to.
interrupt_parameters = ["bp", "di", "si", "ds", "es", "dx", "cx", "bx", "ax", "ip", "cs", "flags"]
