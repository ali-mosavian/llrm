# C's runtime on real-mode DOS: what the language asks of the target's OS layer
# (runtime/shared/dos/m16). Each field naming a file names one in this directory.

# Library routines this runtime has (ext.asm, as `_name@3` in regparm3, the default), which the compiler may call for what it does not move inline. Only
# `memmove`: no instruction moves overlapping bytes, and the pin calls it where it does not inline (getMemmoveLoadsAndStores). `memcpy` and
# `memset` stay `rep movs`/`rep stos`. Near pointers only: a far one is refused.
libcalls = ["memmove"]

# What `-fsanitize=stack` compares and calls.
stack = "stack.toml"
# The stack the OS layer's start-up reserves.
stack_base = 16384
# The start-up hook the layer calls before `main`, and the file that defines it.
init = "_llrm_c_init"
init_file = "init.asm"
# Fields the assembler is told as `-DSYMBOL=value`; the OS layer's own come from its description.
assembler_defines = ["stack_base:STACK_BYTES", "init:LANG_INIT"]

# How Open Watcom's front end is asked to record a C program for this target (llrm-c).
[frontend]
# Which of its trees: i86 (16-bit) or 386 (flat 32-bit). The build makes one front end for each
# CPU the targets name.
watcom_cpu = "i86"
# What the front end calls `int`, in bytes: the C ABI's, which the data layout does not state.
int_bytes = 2
# The routine the start-up calls, and the convention it calls it in.
entry = "main"
entry_convention = "cdecl16"
# What the front end records of a function it passes in its default registers (its own list, which differs by tree).
default_registers = "[ff:0]"
# The header it includes first, from the repository root.
header = "crates/frontends/llrm-c/src/borland.h"
# Borland C's interrupt handler parameters, in order: the registers its handler saved, each at its slot of the frame
# (`calling.toml`'s `interrupt_frame`); what it writes to them is what it returns to.
interrupt_parameters = ["bp", "di", "si", "ds", "es", "dx", "cx", "bx", "ax", "ip", "cs", "flags"]

# Open Watcom's register sets as the front end records them (cgx86reg.h): the bits of each register in the first
# word of a set, which whole register a half is part of, and its rank when a set is named high half first: a segment
# register is always the segment, and Open Watcom's compiler takes the offset of a pair from the first of ax, bx, si, di,
# dx, cx (measured with every pair). An inline block may declare changed `clobbered`, never `fixed`.
[frontend.registers]
accumulator = "ax"
flags = "flags"
segments = ["ds", "es", "cs", "ss"]
clobbered = ["ax", "bx", "cx", "dx", "si", "di", "sp", "es"]
fixed = ["bp", "ds", "cs", "st0"]
universe = "3ffff:3"
quad = ["ax", "bx", "cx", "dx"]

set = [
  { name = "ax", bits = 0x3 },
  { name = "bx", bits = 0xc, rank = 1 },
  { name = "cx", bits = 0x30, rank = 5 },
  { name = "dx", bits = 0xc0, rank = 4 },
  { name = "si", bits = 0x100, rank = 2 },
  { name = "di", bits = 0x200, rank = 3 },
  { name = "bp", bits = 0x400, rank = 1 },
  { name = "sp", bits = 0x800 },
  { name = "ds", bits = 0x1000, rank = 9 },
  { name = "es", bits = 0x2000, rank = 9 },
  { name = "cs", bits = 0x4000, rank = 9 },
  { name = "ss", bits = 0x8000, rank = 9 },
  { name = "ah", bits = 0x01, whole = "ax", high = true },
  { name = "al", bits = 0x02, whole = "ax" },
  { name = "bh", bits = 0x04, rank = 1, whole = "bx", high = true },
  { name = "bl", bits = 0x08, rank = 1, whole = "bx" },
  { name = "ch", bits = 0x10, rank = 5, whole = "cx", high = true },
  { name = "cl", bits = 0x20, rank = 5, whole = "cx" },
  { name = "dh", bits = 0x40, rank = 4, whole = "dx", high = true },
  { name = "dl", bits = 0x80, rank = 4, whole = "dx" },
  { name = "st0", bits = 0x10000 },
]

[frontend.registers.answer]
1 = ["al"]
2 = ["ax"]
4 = ["dx", "ax"]

# Every family names the OS the target is, `-bt=dos`: the front end otherwise predefines the host's (`__LINUX__`).
# Borland's medium model: far code, near data, cdecl, signed char (long double is the x87 type: llrm-c adds -fld),
# byte-packed structs, 16-bit enums, x87 inline, no stack probes, no default library. -fp3 is for
# inline assembly: qcport's own uses 387 instructions. Borland's ABI is the only one here: wccq
# also lays bit fields out as BCC 3.1 does, with no switch.
[frontend.abi.cdecl]
convention = "cdecl16"
flags = ["-mm", "-3", "-fpi87", "-fp3", "-j", "-zp1", "-ei", "-ecc", "-s", "-zl", "-zq", "-bt=dos"]
cdecl = "cdecl16"
registers = "watcall16"

# Open Watcom's own: no -ecc, so an unmarked function takes its registers; `__watcall` keeps Open Watcom's meaning, which Borland's
# runtime does not have (borland.h moves its declarations to cdecl). Its structs pack to 2 and its char is unsigned, its own
# defaults (its library is built with `-fsigned-char`), and it has none of Borland's names to undo: its header is empty.
[frontend.abi.watcom]
convention = "cdecl16"
header = "crates/frontends/llrm-c/src/watcom.h"
# Its linker is asked for the start-up (`_cstart_`, the object file's entry), and for `__argc`, which builds argv, where
# `main` takes arguments: the references Open Watcom's own compiler leaves in a module with a `main`.
entry_requests = ["_cstart_"]
# Its start-up runs the initializers and finalizers laid between these markers; every Open Watcom object declares them in
# order, and the linker lays segments out as it first meets them.
bracketed_segments = ["XIB:XI:XIE", "YIB:YI:YIE"]
entry_argument_requests = ["__argc"]
flags = ["-mm", "-3", "-fpi87", "-fp3", "-ei", "-s", "-zl", "-zq", "-bt=dos", "-dLLRM_WATCOM_ABI"]
cdecl = "cdecl16"
registers = "watcall16"

# gcc-ia16's: -ecc makes every function cdecl, which is its stack convention.
[frontend.abi.ia16]
convention = "ia16"
flags = ["-mm", "-3", "-fpi87", "-fp3", "-j", "-zp1", "-ei", "-ecc", "-s", "-zl", "-zq", "-bt=dos"]
cdecl = "ia16"
registers = "watcall16"

# gcc's -mregparm=3: no -ecc, so an unmarked function takes the front end's default registers, which this ABI states as `regparm3`
# (the Borland runtime's declarations and every function that names a convention stay cdecl).
[frontend.abi.regparm3]
convention = "regparm3"
flags = ["-mm", "-3", "-fpi87", "-fp3", "-j", "-zp1", "-ei", "-s", "-zl", "-zq", "-bt=dos"]
cdecl = "cdecl16"
registers = "regparm3"
