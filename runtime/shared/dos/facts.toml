# What DOS gives a program, which every DOS target's OS layer reads, once: the software
# interrupts and the function number each is called with in AH. The assembler is told each as
# DOS_<NAME>. The DPMI ones are the extender's (DOS/32A), reached through its own interrupt.
int = 0x21
open = 0x3D
create = 0x3C
close = 0x3E
delete = 0x41
rename = 0x56
mkdir = 0x39
chdir = 0x3B
rmdir = 0x3A
set_dta = 0x1A
get_drive = 0x19
find_first = 0x4E
find_next = 0x4F
free_space = 0x36
get_directory = 0x47
seek = 0x42
read = 0x3F
write = 0x40
read_key = 0x08
key_ready = 0x0B
exit = 0x4C
exec = 0x4B
resize = 0x4A
get_vector = 0x35
set_vector = 0x25
ioctl = 0x44
dpmi_int = 0x31
dpmi_alloc = 0x0501
dpmi_dos_alloc = 0x0100
dpmi_dos_free = 0x0101
dpmi_simulate = 0x0300
dpmi_get_vector = 0x0200
dpmi_set_vector = 0x0201

# A handle is a word; a program starts with these three open.
handle_bits = 16
stdin = 0
stdout = 1
stderr = 2

# DOS's own codes for the conditions the interface names: the layer returns them as they are, so
# each must be the interface's number.
[errors]
not_found = 2
path_not_found = 3
denied = 5
