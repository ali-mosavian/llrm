# What DOS gives a program, which every DOS target's OS layer reads, once: the software
# interrupts and the function number each is called with in AH. The assembler is told each as
# DOS_<NAME>. The DPMI ones are the extender's (DOS/32A), reached through its own interrupt.
int = 0x21
open = 0x3D
create = 0x3C
close = 0x3E
seek = 0x42
read = 0x3F
write = 0x40
read_key = 0x08
key_ready = 0x0B
exit = 0x4C
resize = 0x4A
get_time = 0x2C
get_vector = 0x35
set_vector = 0x25
ioctl = 0x44
video_int = 0x10
video_set_cursor = 0x02
video_get_cursor = 0x03
video_set_cursor_shape = 0x01
video_scroll_up = 0x06
video_get_mode = 0x0F
timer_clock = 1193182
dpmi_int = 0x31
dpmi_alloc = 0x0501

# A handle is a word; a program starts with these three open.
handle_bits = 16
stdin = 0
stdout = 1
stderr = 2

# DOS's own codes for the conditions the interface names: the layer returns them as they are, so
# each must be the interface's number.
[errors]
not_found = 2
path_not_found = 3
denied = 5
