# x86-m32's OS layer: flat DOS under DOS/32A. start.asm and os.asm implement the interface
# (runtime/shared/interface.toml); the assembler is told every integer here and each of DOS's facts.

os = "dos"
convention = "cdecl32"
pointer = "near"
groups = ["core", "console", "process", "files"]
start = "start.asm"
implementation = "os.asm"
# Whether the start-up zeroes the far uninitialised data, as it does the near.
far_bss = false
# The most the heap grows to, taken from the extender (DPMI 0501h) the first time it is asked.
heap_bytes = 16777216
# What the runtime's routines, DOS and an interrupt use below the deepest chain of frames the program
# makes: the stack limit is the bottom plus this, and the stack the object adds covers it.
stack_reserve = 512
# The BASIC error the runtime's divide-fault handler (B$TRAPS, trap.asm) reports for exception 0; absent where the layer installs none. A
# front end may then leave a signed divide's quotient overflow (-32768 \\ -1) to the processor.
divide_fault_error = 11
