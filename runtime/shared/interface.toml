# The OS layer's interface: what every target's operating system gives every language's runtime.
# One symbol per operation, `<symbol_prefix><NAME>` (the name in capitals, as the BASIC runtime's `B$` ones are), in the stack convention a target's `os.toml` names (cdecl16, cdecl32), whatever a language's default is; a target's
# `os.toml` says which groups it implements, its pointer kind and its convention, and the
# languages' bindings (os.nib, a C header) are rendered from this file, never written by hand.
#
# A result below zero is an error (`isize` is the target's own word, so no width is written here): minus its code, the code being the number `[errors]` gives it
# where it names the condition and the operating system's own otherwise.
#
# Types: `path` and `bytes` and `bytes_mut` are data pointers (far where the target has far data,
# flat otherwise); `heap` is a pointer into the program's near data; `handle` is an integer as wide
# as the operating system's facts say (`handle_bits`); `bool` is 0 or 1; the rest are integers.

symbol_prefix = "LL$"

# The handles every program starts with, whose numbers are the operating system's facts.
handles = ["stdin", "stdout", "stderr"]

[errors]
not_found = 2
path_not_found = 3
denied = 5

# What every target has.
[[op]]
group = "core"
name = "open"
doc = "A handle to an existing file; mode 0 reads, 1 writes, 2 both."
args = [["name", "path"], ["mode", "u8"]]
returns = "handle"

[[op]]
group = "core"
name = "create"
doc = "A handle to a new, empty file."
args = [["name", "path"]]
returns = "handle"

[[op]]
group = "core"
name = "read"
doc = "Bytes read, in one call, which moves at most i32 max."
args = [["handle", "handle"], ["data", "bytes_mut"], ["count", "usize"]]
returns = "i32"

[[op]]
group = "core"
name = "seek"
doc = "Seeks relative to origin 0, 1, or 2 and returns the absolute position."
args = [["handle", "handle"], ["position", "i32"], ["origin", "u8"]]
returns = "i32"

[[op]]
group = "core"
name = "write_file"
doc = "Bytes written, as read."
args = [["handle", "handle"], ["data", "bytes"], ["count", "usize"]]
returns = "i32"

[[op]]
group = "core"
name = "close"
doc = "0 on success."
args = [["handle", "handle"]]
returns = "isize"

[[op]]
group = "core"
name = "exit"
doc = "Ends the program with `code`."
args = [["code", "u8"]]
returns = "void"

[[op]]
group = "core"
name = "more"
doc = "`bytes` more of the heap, right after the last grant or in a new arena the target chains, or null."
args = [["bytes", "usize"]]
returns = "heap"

# The console: the keyboard, which DOS reads from standard input, so redirection applies. Its output and
# line input are `write_file` and `read` on the standard handles.
[[op]]
group = "console"
name = "console_read_key"
doc = "The next byte of standard input, not echoed, waiting for one; an extended key is 0 and then its scan code. At the end of redirected input it is 26 (Ctrl-Z), again and again."
args = []
returns = "u8"

[[op]]
group = "console"
name = "console_key_ready"
doc = "Whether `console_read_key` would not wait. What it says at the end of redirected input is the operating system's: DOSBox says ready."
args = []
returns = "bool"

# Interrupt vectors: a target that has them (real mode).
[[op]]
group = "vectors"
name = "vector"
doc = "The handler interrupt `number` enters."
args = [["number", "u8"]]
returns = "handler"

[[op]]
group = "vectors"
name = "set_vector"
doc = "Makes interrupt `number` enter `handler`; the program's exit puts back what it replaced."
args = [["number", "u8"], ["handler", "handler"]]
returns = "void"

[[op]]
group = "vectors"
name = "chain"
doc = "Enters `handler` as its interrupt would, and comes back."
args = [["handler", "handler"]]
returns = "void"

# The program's own memory block, where a target has one to give back and take from (real-mode DOS).
[[op]]
group = "memory"
name = "block_resize"
doc = "Resizes the memory block that starts at paragraph `segment` to `paragraphs`, or to the most there is, and returns the paragraphs it now has."
args = [["segment", "usize"], ["paragraphs", "usize"]]
returns = "usize"

# The program's command line and environment, where the operating system has them.
[[op]]
group = "process"
name = "command_line"
doc = "The command tail the program was started with, without its leading blank, copied to `data` (at most `max` bytes); its length."
args = [["data", "bytes_mut"], ["max", "usize"]]
returns = "isize"

[[op]]
group = "process"
name = "environment"
doc = "The `index`th (from 0) string of the environment, NAME=VALUE, copied to `data` (at most `max` bytes); its length, or -1 past the last."
args = [["index", "usize"], ["data", "bytes_mut"], ["max", "usize"]]
returns = "isize"

# The clock and the wait, where the operating system has them for a program (a host; DOS programs read the BIOS
# clock through their language's runtime).
[[op]]
group = "time"
name = "monotonic"
doc = "Milliseconds from an arbitrary start, modulo 2^31: it never goes back, and a difference is right while under 24 days."
args = []
returns = "i32"

[[op]]
group = "time"
name = "local_time"
doc = "Writes the local date and time to `data` as seven little-endian 16-bit words: year, month, day, hour, minute, second, hundredths; 0, or an error."
args = [["data", "bytes_mut"]]
returns = "isize"

[[op]]
group = "time"
name = "sleep"
doc = "Waits `milliseconds`, or less if a signal ends it."
args = [["milliseconds", "usize"]]
returns = "void"

[[op]]
group = "process"
name = "environment_read"
doc = "Up to `max` bytes of the environment block from byte `offset` to `data`; the count copied."
args = [["offset", "usize"], ["data", "bytes_mut"], ["max", "usize"]]
returns = "usize"

[[op]]
group = "process"
name = "environment_write"
doc = "`count` bytes from `data` into the environment block at byte `offset`; 0, or -1 when they do not fit in the block."
args = [["offset", "usize"], ["data", "bytes"], ["count", "usize"]]
returns = "isize"

[[op]]
group = "process"
name = "execute"
doc = "Runs the program `name` to its end with the command tail `tail` (a length byte, the text, a carriage return) and the caller's environment; 0 on success, the error code negated otherwise. The caller leaves the program enough memory to run in."
args = [["name", "path"], ["tail", "path"]]
returns = "isize"

# Files and directories by name, where the operating system has them.
[[op]]
group = "files"
name = "delete"
doc = "Deletes the file `name`; 0 on success. No wildcards."
args = [["name", "path"]]
returns = "isize"

[[op]]
group = "files"
name = "rename"
doc = "Renames `old` to `new`, which may be in another directory of the same drive; 0 on success."
args = [["old", "path"], ["new", "path"]]
returns = "isize"

[[op]]
group = "files"
name = "mkdir"
doc = "Makes the directory `name`; 0 on success."
args = [["name", "path"]]
returns = "isize"

[[op]]
group = "files"
name = "chdir"
doc = "Makes the directory `name` the current one; 0 on success."
args = [["name", "path"]]
returns = "isize"

[[op]]
group = "files"
name = "rmdir"
doc = "Removes the empty directory `name`; 0 on success."
args = [["name", "path"]]
returns = "isize"

[[op]]
group = "files"
name = "find_first"
doc = "Starts a directory search: the first file named by `pattern` (wildcards allowed) whose attributes are among `attrs` (0 for ordinary files, 0x10 adds directories), its entry written to the 43-byte buffer `entry` (attribute at 21, size at 26 as 32 bits, name at 30, NUL-ended); 0 on success."
args = [["pattern", "path"], ["attrs", "usize"], ["entry", "bytes_mut"]]
returns = "isize"

[[op]]
group = "files"
name = "find_next"
doc = "The next file of the search `entry` holds, written to `entry`; 0 on success, an error code negated at the end."
args = [["entry", "bytes_mut"]]
returns = "isize"

[[op]]
group = "files"
name = "free_bytes"
doc = "The bytes free on `drive` (0 the current one, 1 for A:); an error code negated."
args = [["drive", "usize"]]
returns = "i32"

[[op]]
group = "files"
name = "current_directory"
doc = "The current directory of `drive` (0 the current one), without a drive or a leading separator, NUL-ended in at most 64 bytes of `data`; 0 on success."
args = [["drive", "usize"], ["data", "bytes_mut"]]
returns = "isize"

[[op]]
group = "files"
name = "current_drive"
doc = "The current drive, 0 for A:."
args = []
returns = "isize"
