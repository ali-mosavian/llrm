<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>QB on wasm32</title>
<style>
  :root { color-scheme: dark; --bg: #000; --fg: #aaa; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg); font: 14px/1.4 monospace; }
  body { display: grid; grid-template-rows: 1fr auto; place-items: center; padding: 0 16px; }
  /* EGA 640x350 shows at 4:3 on a monitor. */
  #screen { width: min(100%, calc((100vh - 48px) * 4 / 3)); aspect-ratio: 4 / 3; image-rendering: pixelated; background: #000; }
  #status { padding: 12px 0; }
</style>
</head>
<body>
<canvas id="screen" width="640" height="350"></canvas>
<div id="status">Starting.</div>
<script type="module" src="main.mjs"></script>
</body>
</html>
