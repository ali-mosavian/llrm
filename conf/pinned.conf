# The pinned emulated machine. Every number quoted from DOSBox comes from this
# file and nothing else.
#
# core=normal because it is the deterministic one: under it the PIT advances
# with emulated cycles rather than host time, so two runs of the same binary
# give identical readings. tools/bench.py asserts that, which turns timing
# noise from something to tolerate into something that fails.
#
# cputype=pentium because timing reads RDTSC, which the normal core refuses
# below a Pentium. It no longer proves the emitted code needs nothing above a
# 386; the pass still targets one.
#
# cycles is fixed rather than max: cycles=max varies with host load, and a
# before-and-after where the machine differed is not a measurement.
[sdl]
priority=higher,normal
output=surface
showdetails=false
showbasic=false
[dosbox]
memsize=32
startquiet=true
startbanner=false
[cpu]
core=normal
cputype=pentium
cycles=20000
[dos]
xms=true
ems=true
dpmi=false
log console=false
[mixer]
nosound=true
