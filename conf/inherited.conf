# What the runtime pass's parity benchmark ran on, reconstructed. Nothing in
# the inherited documents records its DOSBox configuration; this is taken from
# the template its harness used, and it is here only so the figures in
# docs/measurement/numbers.md under "predecessor" can be compared with a qbopt row at all.
#
# Reconstructed, not recorded. Treat any comparison across it as approximate.
[sdl]
priority=higher,normal
output=surface
[dosbox]
memsize=64
startquiet=true
startbanner=false
[cpu]
core=dynamic
cputype=pentium_iii
cycles=75000
[dos]
xms=true
ems=true
dpmi=false
log console=false
[mixer]
nosound=true
