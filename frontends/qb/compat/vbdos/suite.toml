link_libraries = ["FINANCE.LIB"]
expected = "PASS financial"
parser = "required"
lowering = "required"
runtime = "required"
verification = "All thirteen FINANCE.LIB functions must return status zero and a distinct measured MKD$ byte result; IRR/MIRR/NPV also cross the array ABI, while noncommutative BYVAL arguments prevent calling-convention permutations from sharing an answer."

