schema = 1
dialect = "vbdos10"
runtime = "vbdos10"
inherits = "../pds71/suite.toml"

[[case]]
name = "underscore_identifiers"
source = "underid.bas"
level = 1
features = ["vbdos-only underscore identifiers", "option explicit", "long loop arithmetic"]
switches = ["/O", "/FPi", "/R", "/G3", "/E"]
expected = "underid.out"
parser = "required"
lowering = "required"
runtime = "required"
verification = "The underscore-named LONG accumulates 1+2+3 from 1000 and must equal 1006."

[[case]]
name = "g2_byval_long"
source = "g3long.bas"
level = 2
features = ["VBDOS /G2 acceptance", "two-word long-argument ABI", "byval long parameter"]
switches = ["/O", "/FPi", "/R", "/G2", "/E"]
expected = "g3long.out"
parser = "required"
lowering = "required"
runtime = "required"
verification = "Three distinct BYVAL LONG arguments feed noncommutative multiply/divide/MOD arithmetic yielding 2577 under /G2; caller canaries remain unchanged."

