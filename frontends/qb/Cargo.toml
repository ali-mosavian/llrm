[package]
name = "qbfront"
version = "0.1.0"
edition = "2021"
description = "QB/QBasic/PDS/VBDOS source frontend for qbopt"
default-run = "qbfront"

[lib]
name = "qbfront"
path = "src/lib.rs"

[[bin]]
name = "qbfront"
path = "src/main.rs"

[dependencies]
buildprs = { path = "crates/buildprs" }

[build-dependencies]
buildprs = { path = "crates/buildprs" }

# Release, bench and `test --release` inherit this; only a clean rebuilds all.
[profile.release]
incremental = true
